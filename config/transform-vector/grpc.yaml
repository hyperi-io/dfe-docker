#
# On `direct` the supervisor bridges Push to Vector and back over loopback, so
# Vector itself sends every record on to the next hop. `dfe_source` names the
# routing key the loader picks its table by.

dfe_source: main

source:
  transport: direct
  listen: 0.0.0.0:6000

sink:
  transport: direct
  endpoint: http://dfe-loader:50051
