# Project:   dfe-docker
# File:      config/transform-vrl/kafka.yaml
# Purpose:   dfe-transform-vrl config - the idle instance the single tier starts
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# It names no source topic, which is the transform's own idle predicate
# (dfe-infra apps.yaml `idle_when`): it starts, stays Ready, holds the
# pipeline_idle gauge at 1 and joins no consumer group. The source it is later
# given names both ends; transform-vrl/main.yaml is the profile that ships with
# a pair already set.

source:
  brokers:
    - kafka:9092
  # Explicitly empty: an omitted list defaults to `events`, which is a topic to
  # consume and so not idle.
  topics: []
  # Kept by any source bound over this base. The default (latest) skips what
  # reached the topic before the group first joined.
  auto_offset_reset: earliest

transforms:
  dir: /etc/dfe-transform-vrl/transforms

sink:
  # The app refuses an empty sink topic even with nothing to read, so this names
  # the catch-all's transformed topic until a source replaces both ends.
  brokers:
    - kafka:9092
  topic: main_load
  # Workaround: scalo's KafkaTransport::new always creates a
  # BaseConsumer alongside the FutureProducer, even when only the producer
  # side is used. Empty group.id makes librdkafka treat the instance as
  # producer-only, and BaseConsumer construction then fails with
  # "rdkafka consumer queue not available". Force a non-empty group.id via
  # librdkafka_options so the unused consumer can be constructed.
  librdkafka_options:
    group.id: dfe-transform-vrl-producer-dummy
