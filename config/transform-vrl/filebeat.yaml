# Project:   dfe-docker
# File:      config/transform-vrl/filebeat.yaml
# Purpose:   dfe-transform-vrl config - the per-source instance for the filebeat source
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# One transform instance per source, the same shape the Kubernetes tier deploys:
# the receiver routes _source=filebeat to filebeat_land, this instance is the only
# consumer of that topic, and dfe-loader derives the destination table from the
# filebeat_load topic name.

pipeline:
  name: filebeat

source:
  brokers:
    - kafka:9092
  topics:
    - filebeat_land
  # Explicit, because the passthrough instance and this one must never share a
  # group: Kafka assigns the union of a group's subscriptions across its members.
  # dfe-engine gives a source named filebeat this group too, so the two split the topic rather than each reading all of it.
  group_id: dfe-transform-vrl-filebeat
  # The default (latest) skips what reached the topic before the group first joined.
  auto_offset_reset: earliest

transforms:
  dir: /etc/dfe-transform-vrl/transforms

# The ios and meraki branches of the bundled pipeline resolve timezone
# abbreviations through this table, and a missing one is a compile error. The
# table lives outside transforms.dir because the transform scans that directory
# for programs and a non-.vrl file there is only tolerated by the glob.
enrichment_tables:
  - name: timezones
    path: /etc/dfe-transform-vrl/data/timezones.csv
    key_columns: ["abbreviation"]

sink:
  brokers:
    - kafka:9092
  topic: filebeat_load
  # Workaround: scalo's KafkaTransport::new always creates a
  # BaseConsumer alongside the FutureProducer, even when only the producer
  # side is used. Empty group.id makes librdkafka treat the instance as
  # producer-only, and BaseConsumer construction then fails with
  # "rdkafka consumer queue not available". Force a non-empty group.id via
  # librdkafka_options so the unused consumer can be constructed.
  librdkafka_options:
    group.id: dfe-transform-vrl-filebeat-producer-dummy
