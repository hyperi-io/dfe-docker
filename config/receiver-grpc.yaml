# gRPC transport: receiver forwards events to dfe-loader via DfeTransport/Push (:50051).
# This is the target default architecture. Requires transport-grpc wired in dfe-receiver
# (see Step 10 in TODO.md). Used with the full compose profile.

server:
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760  # 10MB
  request_timeout_ms: 30000
  tls:
    enabled: false
  auth:
    mode: "none"

grpc:
  enabled: true          # Vector protocol inbound on :6000
  bind_address: "0.0.0.0:6000"
  tls:
    enabled: false       # Uncomment cert paths below to enable TLS
    # cert_file: /etc/ssl/receiver.crt
    # key_file: /etc/ssl/receiver.key

validation:
  require_json: true
  required_fields: []
  dlq_on_invalid: true

routing:
  legacy_compat: true
  default_source: "events"
  topic_suffix: ""
  source_to_topic:
    auth: "auth_events"
    api: "api_events"
    admin: "admin_events"
    network: "network_events"
  dlq:
    enabled: true
    topic: "dlq_events"

# DfeTransport outbound — forwards to dfe-loader gRPC server
destinations:
  default: "grpc"
  rules: []

loader:
  transport: "grpc"
  grpc:
    target: "dfe-loader:50051"
    connect_timeout_ms: 5000
    request_timeout_ms: 10000
    retry_max_attempts: 3
    compression: false
    tls_enabled: false

buffer:
  memory_limit: 0
  pressure_threshold: 0.8

metrics:
  enabled: true
  address: "0.0.0.0:9090"
