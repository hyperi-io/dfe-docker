# gRPC transport: receiver forwards events to dfe-loader via DFETransport/Push (:50051).

grpc:
  enabled: true

routing:
  source_rules:
    - field: _source
      mode: key_value_use

destinations:
  default: loader

loader:
  transport: grpc
  grpc_endpoint: http://dfe-loader:50051
