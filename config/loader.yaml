# Bare-metal config: loader connects to Kafka + ClickHouse on localhost
# For docker usage, use loader-docker.yaml instead

kafka:
  brokers:
    - "localhost:19092"
  group: dfe-loader
  topics:
    - "events"
    - "auth_events"
    - "api_events"
    - "admin_events"
    - "network_events"
    - "dlq_events"
  client_id: dfe-loader

clickhouse:
  hosts:
    - "localhost:9000"
  database: dfe
  username: default
  password: ""
  protocol: native

routing:
  db_fields: []
  table_fields:
    - event_category
    - tags.event_category
  default_db: dfe
  default_table: common
  category_to_table:
    auth: auth_events
    api: api_events
    admin: admin_events
    errors: error_events
  dlq:
    enabled: true
    topic_suffix: ".dlq"

buffer:
  flush_bytes: 524288
  flush_rows: 1000
  flush_age_secs: 2

memory:
  limit_bytes: 67108864
  pressure_threshold: 0.8

metrics:
  enabled: true
  address: "0.0.0.0:9091"

logging:
  level: info
  format: text

timestamp_dq:
  enabled: true
  max_future_seconds: 600
  invalid_action: replace_with_now
  correct_known_bad: true

schema:
  cache_ttl_secs: 60
  refresh_on_error: true

auto_init:
  enabled: true
