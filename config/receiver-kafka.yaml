# Kafka transport: receiver forwards events to Kafka broker (kafka:9092).
# Used with full-kafka compose profile. For bare-metal testing use receiver.yaml.

server:
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760  # 10MB
  request_timeout_ms: 30000
  tls:
    enabled: false
  auth:
    mode: "none"

grpc:
  enabled: true          # Vector protocol inbound on :6000
  bind_address: "0.0.0.0:6000"
  tls:
    enabled: false       # Uncomment cert paths below to enable TLS
    # cert_file: /etc/ssl/receiver.crt
    # key_file: /etc/ssl/receiver.key

validation:
  require_json: true
  required_fields: []
  dlq_on_invalid: true

routing:
  topic_fields:
    - "tags.event.category"
    - "event_category"
  default_topic: "events"
  topic_suffix: ""
  category_to_topic:
    auth: "auth_events"
    api: "api_events"
    admin: "admin_events"
    network: "network_events"
  dlq:
    enabled: true
    topic: "dlq_events"

destinations:
  default: "kafka"
  rules: []

kafka:
  brokers:
    - "kafka:9092"
  client_id: "dfe-receiver"
  sasl:
    enabled: false
  tls:
    enabled: false
  producer:
    batch_size: 8388608
    batch_messages: 10000
    linger_ms: 20
    compression: "lz4"
    acks: "all"
    retries: 5

buffer:
  memory_limit: 0
  pressure_threshold: 0.8

metrics:
  enabled: true
  address: "0.0.0.0:9090"
