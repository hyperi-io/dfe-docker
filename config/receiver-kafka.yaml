# Kafka transport: receiver forwards events to Kafka broker (kafka:9092).
# Used with full-kafka compose profile. For bare-metal testing use receiver.yaml.

server:
  bind_address: "0.0.0.0:8080"

kafka:
  brokers:
    - "kafka:9092"

routing:
  source_rules:
    - field: "_source"
      mode: "key_value_use"
