# Direct chain: receiver pushes to dfe-transform-vector, which pushes to dfe-loader.

routing:
  source_rules:
    - field: _source
      mode: key_value_use

destinations:
  default: transform_vector
  transform_vector:
    grpc:
      endpoint: http://dfe-transform-vector:6000
