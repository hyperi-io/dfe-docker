# gRPC transport: receiver forwards events to dfe-loader via DFETransport/Push (:6000).

grpc:
  enabled: true

routing:
  source_rules:
    - field: _source
      mode: key_value_use

destinations:
  default: loader

# No grpc_endpoint: the receiver's default loader address is dfe-loader:6000, and an engine-rendered destinations.loader overrides it.
loader:
  transport: grpc
