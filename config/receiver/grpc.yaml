# gRPC transport: receiver forwards events to dfe-loader via DFETransport/Push (:6000).

grpc:
  enabled: true

routing:
  source_rules:
    - field: _source
      mode: key_value_use

destinations:
  default: loader

loader:
  transport: grpc
  # No grpc_endpoint here on purpose. dfe-engine compiles the receiver's
  # destination into destinations.loader.grpc.endpoint, and that block wins --
  # a second port written here is read by nobody and reads as the live one.
