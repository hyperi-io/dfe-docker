# Project:   dfe-docker
# File:      config/receiver/kafka.yaml
# Purpose:   Receives records onto Kafka, by their _source
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

transport: kafka

# A record keeps the `_source` its sender wrote, and one with none takes routing.default_source.
rules:
  rules:
    - id: sender-source
      set: {_source: {from: _source}}

# The detection tests and `make post` send their events' org in `_org_id`, kept
# here and held to the orgs the HTTP listener is bound to.
routing:
  source_org_id: allow

ingest_bindings:
  listeners:
    http:
      orgs: [default, e2e, post]
      default_org: default
