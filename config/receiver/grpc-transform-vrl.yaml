# Direct chain: receiver pushes to dfe-transform-vrl, which pushes to dfe-loader.

routing:
  source_rules:
    - field: _source
      mode: key_value_use

destinations:
  default: transform_vrl
  transform_vrl:
    grpc:
      endpoint: http://dfe-transform-vrl:6000
