name: aws-guardduty-high-severity
display_name: GuardDuty high severity finding
severity: high
source: aws-guardduty
source_type: raw
# GuardDuty rates a finding 7.0 to 8.9 high and 9.0 to 10.0 critical.
# The column is qualified because the hunt runner selects this rule's own severity label AS severity, which would shadow it (hyperi-io/dfe-engine#845).
user_sql: "SELECT * FROM dfe.`aws-guardduty` WHERE `aws-guardduty`.severity >= 7"
