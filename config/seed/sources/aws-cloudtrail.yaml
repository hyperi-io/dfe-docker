source: aws-cloudtrail
display_name: AWS CloudTrail
fetcher:
  source_type: aws
  config:
    access_key_id: env:AWS_ACCESS_KEY_ID
    secret_access_key: env:AWS_SECRET_ACCESS_KEY
    region: us-west-2
    services:
      - name: cloudtrail
header:
  type: common-header/timeseries
  version: 1.0.1
schema:
  meta_schema: meta/aws/cloudtrail
  meta_schema_version: 1.0.1
