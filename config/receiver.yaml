# Bare-metal config: receiver connects to Kafka on localhost:19092
# For Docker Compose, use receiver-docker.yaml instead

server:
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760  # 10MB
  request_timeout_ms: 30000
  tls:
    enabled: false
  auth:
    mode: "none"

grpc:
  enabled: false

validation:
  require_json: true
  required_fields: []
  dlq_on_invalid: true

routing:
  topic_fields:
    - "tags.event.category"
    - "event_category"
  default_topic: "events"
  topic_suffix: ""
  category_to_topic:
    auth: "auth_events"
    api: "api_events"
    admin: "admin_events"
    network: "network_events"
  dlq:
    enabled: true
    topic: "dlq_events"

destinations:
  default: "kafka"
  rules: []

kafka:
  brokers:
    - "localhost:19092"
  client_id: "dfe-receiver"
  sasl:
    enabled: false
  tls:
    enabled: false
  producer:
    batch_size: 8388608
    batch_messages: 10000
    linger_ms: 20
    compression: "lz4"
    acks: "all"
    retries: 5

buffer:
  memory_limit: 0
  pressure_threshold: 0.8

metrics:
  enabled: true
  address: "0.0.0.0:9090"
