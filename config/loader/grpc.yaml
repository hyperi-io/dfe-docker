# gRPC transport: loader listens on :6000 for DFETransport/Push, the port dfe-engine compiles every sender's endpoint against.

transport: grpc

clickhouse:
  hosts:
    - clickhouse:8123
  database: dfe
  protocol: http
  username: env:CLICKHOUSE_USERNAME
  password: env:CLICKHOUSE_PASSWORD

grpc:
  listen: 0.0.0.0:6000

routing:
  dlq:
    enabled: false
