# gRPC transport: loader listens on :6000 for DFETransport/Push from dfe-receiver.
# 6000 is the suite-wide loader gRPC port -- dfe-infra's chart derives grpcPort
# from it and dfe-engine compiles the receiver's endpoint against it, so a
# different value here silently drops every record with an HTTP 202.

transport: grpc

clickhouse:
  hosts:
    - clickhouse:8123
  database: dfe
  protocol: http
  username: env:CLICKHOUSE_USERNAME
  password: env:CLICKHOUSE_PASSWORD

grpc:
  listen: 0.0.0.0:6000

routing:
  dlq:
    enabled: false
