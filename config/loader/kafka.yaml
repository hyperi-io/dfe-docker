clickhouse:
  hosts:
    - clickhouse:8123
  database: dfe
  protocol: http
  username: env:CLICKHOUSE_USERNAME
  password: env:CLICKHOUSE_PASSWORD

kafka:
  brokers:
    - kafka:9092
  group: dfe-loader
  topic_regex: .*_land

routing:
  dlq:
    enabled: false