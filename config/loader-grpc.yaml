# gRPC transport: loader listens on :50051 for DFETransport/Push from dfe-receiver.

transport: "grpc"

grpc:
  listen: "0.0.0.0:50051"

clickhouse:
  hosts:
    - "clickhouse:8123"
  database: dfe
