transport: kafka

kafka:
  brokers:
    - kafka:9092
  topics:
    - main_land

archive:
  # Container-local and throwaway, because a fresh archiver-data volume is
  # root-owned and every write to it is refused.
  destination: file:///tmp/dfe-archive
