# Project:   dfe-docker
# File:      config/proxy/nginx.conf
# Purpose:   Single-origin reverse proxy fronting dfe-ui + dfe-engine
# Language:  nginx
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# The dfe-ui image ships a Next.js client that calls the engine with a relative base URL (`/api/v1/...`). That only works when the UI and the engine answer on the SAME origin. This proxy provides that origin:
#    /api/v1/* --> dfe-engine:8000  (config/schema API)
#    everything else (UI, /_next, NextAuth /api/auth/*) -> dfe-ui:3000
#
# Mounted read-only at /etc/nginx/conf.d/default.conf.
#
# Upstreams are referenced through variables so their DNS is resolved per request via Docker's embedded resolver (127.0.0.11). This lets nginx boot even if a backend is momentarily down and recover when it returns, instead of failing at startup on "host not found in upstream".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Liveness endpoint served directly by nginx (no backend, no redirect).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Engine API - same-origin path proxied to the backend.
    location /api/v1/ {
        set $engine_upstream http://dfe-engine:8000;
        proxy_pass $engine_upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else - the Next.js UI, including NextAuth at /api/auth/*.
    location / {
        set $ui_upstream http://dfe-ui:3000;
        proxy_pass $ui_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}