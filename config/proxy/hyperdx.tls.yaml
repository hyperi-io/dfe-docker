# Project:   dfe-docker
# File:      config/proxy/hyperdx.tls.yaml
# Purpose:   hyperdx.yaml with TLS and plain HTTP on both origins
# Language:  Envoy static config
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Mounted instead of hyperdx.yaml when DFE_PROXY_TLS=true
# Must equal hyperdx.yaml plus the marked TLS blocks (test_proxy_tls_config.py)

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  clusters:
    # Fixed container ports, the DFE_HYPERDX_*_PORT dials only move the host ports
    - name: hyperdx
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: hyperdx
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hyperdx, port_value: 8090 }
      type: STRICT_DNS
    - name: hyperdx-api
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: hyperdx-api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hyperdx, port_value: 8000 }
      type: STRICT_DNS
  listeners:
    - name: hyperdx-app
      address:
        socket_address: { address: 0.0.0.0, port_value: 8090 }
      filter_chains:
        # BEGIN TLS
        - filter_chain_match:
            transport_protocol: tls
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: hyperdx_app
                  virtual_hosts:
                    - name: hyperdx
                      domains: ["*"]
                      routes:
                        - match: { prefix: / }
                          route: { cluster: hyperdx }
                stat_prefix: hyperdx_app
                upgrade_configs:
                  - upgrade_type: websocket
                use_remote_address: true
          # The console's certificate, since this origin shares the console's https scheme
          transport_socket: &hyperdx_tls
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/console.crt
                    private_key:
                      filename: /etc/envoy/certs/console.key
                tls_params:
                  # TLS 1.2 only, TLS 1.3 picks its own
                  cipher_suites:
                    - ECDHE-ECDSA-AES256-GCM-SHA384
                    - ECDHE-RSA-AES256-GCM-SHA384
                    - ECDHE-ECDSA-CHACHA20-POLY1305
                    - ECDHE-RSA-CHACHA20-POLY1305
                    - ECDHE-ECDSA-AES128-GCM-SHA256
                    - ECDHE-RSA-AES128-GCM-SHA256
                  # X25519MLKEM768 first, with P-384 added to Envoy's default X25519 and P-256
                  ecdh_curves:
                    - X25519MLKEM768
                    - P-384
                    - X25519
                    - P-256
        # END TLS
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: hyperdx_app
                  virtual_hosts:
                    - name: hyperdx
                      domains: ["*"]
                      routes:
                        - match: { prefix: / }
                          route: { cluster: hyperdx }
                stat_prefix: hyperdx_app
                upgrade_configs:
                  - upgrade_type: websocket
                use_remote_address: true
      # BEGIN TLS
      # Browsers use TLS, the engine's admin-link probe uses plain HTTP
      listener_filters:
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      # END TLS
    - name: hyperdx-api
      address:
        socket_address: { address: 0.0.0.0, port_value: 8000 }
      filter_chains:
        # BEGIN TLS
        - filter_chain_match:
            transport_protocol: tls
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: hyperdx_api
                  virtual_hosts:
                    - name: hyperdx
                      domains: ["*"]
                      routes:
                        - match: { prefix: / }
                          route: { cluster: hyperdx-api }
                stat_prefix: hyperdx_api
                use_remote_address: true
          transport_socket: *hyperdx_tls
        # END TLS
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: hyperdx_api
                  virtual_hosts:
                    - name: hyperdx
                      domains: ["*"]
                      routes:
                        - match: { prefix: / }
                          route: { cluster: hyperdx-api }
                stat_prefix: hyperdx_api
                use_remote_address: true
      # BEGIN TLS
      listener_filters:
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      # END TLS
