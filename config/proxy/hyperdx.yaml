#
# oauth2-proxy takes these ports when the auth profile is on

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  clusters:
    # Fixed container ports, the DFE_HYPERDX_*_PORT dials only move the host ports
    - name: hyperdx
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: hyperdx
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hyperdx, port_value: 8090 }
      type: STRICT_DNS
    - name: hyperdx-api
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: hyperdx-api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hyperdx, port_value: 8000 }
      type: STRICT_DNS
  listeners:
    - name: hyperdx-app
      address:
        socket_address: { address: 0.0.0.0, port_value: 8090 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: hyperdx_app
                  virtual_hosts:
                    - name: hyperdx
                      domains: ["*"]
                      routes:
                        - match: { prefix: / }
                          route: { cluster: hyperdx }
                stat_prefix: hyperdx_app
                upgrade_configs:
                  - upgrade_type: websocket
                use_remote_address: true
    - name: hyperdx-api
      address:
        socket_address: { address: 0.0.0.0, port_value: 8000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: hyperdx_api
                  virtual_hosts:
                    - name: hyperdx
                      domains: ["*"]
                      routes:
                        - match: { prefix: / }
                          route: { cluster: hyperdx-api }
                stat_prefix: hyperdx_api
                use_remote_address: true
