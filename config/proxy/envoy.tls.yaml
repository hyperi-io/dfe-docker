# Project:   dfe-docker
# File:      config/proxy/envoy.tls.yaml
# Purpose:   envoy.yaml with TLS on both listeners
# Language:  Envoy static config
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Mounted instead of envoy.yaml when DFE_PROXY_TLS=true
# Must equal envoy.yaml plus the marked TLS blocks (test_proxy_tls_config.py)

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  clusters:
    - name: hyperdx
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: hyperdx
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hyperdx, port_value: 8090 }
      type: STRICT_DNS
    - name: dfe-engine
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: dfe-engine
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: dfe-engine, port_value: 8000 }
      type: STRICT_DNS
    - name: dfe-ui
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: dfe-ui
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: dfe-ui, port_value: 3000 }
      type: STRICT_DNS
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                # Stops encoded or doubled-slash paths dodging the /metrics 404
                merge_slashes: true
                normalize_path: true
                route_config:
                  name: single_origin
                  virtual_hosts:
                    - name: dfe
                      domains: ["*"]
                      request_headers_to_add:
                        - header:
                            key: X-Real-IP
                            value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                      routes:
                        - direct_response:
                            body: { inline_string: "ok\n" }
                            status: 200
                          match: { path: /livez }
                        # dfe-ui's /metrics is unauthenticated
                        - direct_response:
                            status: 404
                          match: { case_sensitive: false, path_separated_prefix: /metrics }
                        - match: { prefix: /api/v1/ }
                          route: { cluster: dfe-engine }
                        - match: { prefix: / }
                          route: { cluster: dfe-ui }
                stat_prefix: ingress
                upgrade_configs:
                  - upgrade_type: websocket
                use_remote_address: true
          # BEGIN TLS
          transport_socket: &console_tls
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/console.crt
                    private_key:
                      filename: /etc/envoy/certs/console.key
                tls_params:
                  # TLS 1.2 only, TLS 1.3 picks its own
                  cipher_suites:
                    - ECDHE-ECDSA-AES256-GCM-SHA384
                    - ECDHE-RSA-AES256-GCM-SHA384
                    - ECDHE-ECDSA-CHACHA20-POLY1305
                    - ECDHE-RSA-CHACHA20-POLY1305
                    - ECDHE-ECDSA-AES128-GCM-SHA256
                    - ECDHE-RSA-AES128-GCM-SHA256
                  # Fallback curves for older clients
                  ecdh_curves:
                    - X25519MLKEM768
                    - P-384
                    - X25519
                    - P-256
                  tls_maximum_protocol_version: TLSv1_3
                  tls_minimum_protocol_version: TLSv1_2
          # END TLS
    - name: hyperdx-embed
      address:
        socket_address: { address: 0.0.0.0, port_value: 8091 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: hyperdx_embed
                  virtual_hosts:
                    - name: hyperdx
                      domains: ["*"]
                      # HyperDX's built-in frame-ancestors 'self' would block the console's iframe
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: Content-Security-Policy
                            value: "frame-ancestors 'self' %ENVIRONMENT(DFE_HYPERDX_EMBED_ANCESTOR)%"
                      routes:
                        - match: { prefix: / }
                          route: { cluster: hyperdx }
                stat_prefix: hyperdx_embed
                upgrade_configs:
                  - upgrade_type: websocket
                use_remote_address: true
          # BEGIN TLS
          # An http embed inside the https console is blocked as mixed content
          transport_socket: *console_tls
          # END TLS
