# Project:   dfe-docker
# File:      config/proxy/envoy.yaml
# Purpose:   Console origin for dfe-ui and dfe-engine, plus the HyperDX embed
# Language:  Envoy static config
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# /api/v1 to dfe-engine, everything else to dfe-ui

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  clusters:
    - name: hyperdx
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: hyperdx
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hyperdx, port_value: 8090 }
      type: STRICT_DNS
    - name: dfe-engine
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: dfe-engine
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: dfe-engine, port_value: 8000 }
      type: STRICT_DNS
    - name: dfe-ui
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: dfe-ui
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: dfe-ui, port_value: 3000 }
      type: STRICT_DNS
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                # Stops encoded or doubled-slash paths dodging the /metrics 404
                merge_slashes: true
                normalize_path: true
                route_config:
                  name: single_origin
                  virtual_hosts:
                    - name: dfe
                      domains: ["*"]
                      request_headers_to_add:
                        - header:
                            key: X-Real-IP
                            value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                      routes:
                        - direct_response:
                            body: { inline_string: "ok\n" }
                            status: 200
                          match: { path: /livez }
                        # dfe-ui's /metrics is unauthenticated
                        - direct_response:
                            status: 404
                          match: { case_sensitive: false, path_separated_prefix: /metrics }
                        - match: { prefix: /api/v1/ }
                          route: { cluster: dfe-engine }
                        - match: { prefix: / }
                          route: { cluster: dfe-ui }
                stat_prefix: ingress
                upgrade_configs:
                  - upgrade_type: websocket
                use_remote_address: true
    - name: hyperdx-embed
      address:
        socket_address: { address: 0.0.0.0, port_value: 8091 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: hyperdx_embed
                  virtual_hosts:
                    - name: hyperdx
                      domains: ["*"]
                      # HyperDX's built-in frame-ancestors 'self' would block the console's iframe
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: Content-Security-Policy
                            value: "frame-ancestors 'self' %ENVIRONMENT(DFE_HYPERDX_EMBED_ANCESTOR)%"
                      routes:
                        - match: { prefix: / }
                          route: { cluster: hyperdx }
                stat_prefix: hyperdx_embed
                upgrade_configs:
                  - upgrade_type: websocket
                use_remote_address: true
