# Project:   dfe-docker
# File:      config/proxy/envoy.yaml
# Purpose:   Single-origin reverse proxy fronting dfe-ui + dfe-engine
# Language:  Envoy static config
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# The dfe-ui image ships a Next.js client that calls the engine with a
# relative base URL (/api/v1/...), so UI and engine must answer on ONE
# origin. This proxy provides that origin:
#    /api/v1/*  -> dfe-engine:8000  (config/schema API)
#    everything else (UI, /_next, NextAuth /api/auth/*) -> dfe-ui:3000
#
# Envoy replaces nginx as THE entrypoint across the product (same proxy the
# k8s tier runs at its edge): OSS nginx has no free inbound OIDC, while
# Envoy's oauth2/jwt_authn filters are Apache-2.0. Those auth filters chain
# in here when the bundled dex issuer lands (the one-issuer decision) --
# semantically the same edge policy the k8s SecurityPolicies express.
#
# Docker mode never assumes an issuer exists. OIDC is a capability the dex
# profile adds to THIS origin, never a requirement any profile inherits; ingest,
# machine paths, metrics and the datastores stay outside it.
#
# STRICT_DNS clusters resolve per refresh via Docker's embedded DNS, so the
# proxy boots while a backend is down and recovers when it returns (the
# equivalent of nginx's variable-upstream resolver trick).

admin:
  # Local healthcheck surface only -- never published by compose.
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress
      # Unprivileged port; compose maps ${DFE_UI_PORT}:8080.
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                # Sets X-Forwarded-For / X-Forwarded-Proto from the real peer.
                use_remote_address: true
                upgrade_configs:
                  - upgrade_type: websocket
                http_filters:
                  # AUTH SEAM: jwt_authn + oauth2 filters insert here when the
                  # bundled dex issuer lands, gated on that profile running.
                  # Scope them per-route, never chain-wide: /api/v1 is a machine
                  # path and must return 401, not a login redirect.
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: single_origin
                  virtual_hosts:
                    - name: dfe
                      domains: ["*"]
                      request_headers_to_add:
                        - header:
                            key: X-Real-IP
                            value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                      routes:
                        # Liveness served by the proxy itself (scalo surface: /livez + /readyz, no /healthz alias).
                        - match: { path: /livez }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                        - match: { prefix: /api/v1/ }
                          route: { cluster: dfe-engine }
                        - match: { prefix: / }
                          route: { cluster: dfe-ui }
  clusters:
    - name: dfe-engine
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: dfe-engine
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: dfe-engine, port_value: 8000 }
    - name: dfe-ui
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: dfe-ui
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: dfe-ui, port_value: 3000 }
