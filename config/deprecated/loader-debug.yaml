# Project:   dfe-docker
# File:      config/loader-debug.yaml
# Purpose:   dfe-loader config - file sink debug mode (no ClickHouse writes)
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

# Debug mode: writes events to JSONL files instead of ClickHouse.
# Used with the debug compose profile. Shared volume at /var/spool/dfe.
# NOTE: requires debug.file_sink config key to be implemented in dfe-loader.
# Config is pre-wired; will activate once the feature is added.

transport: "grpc"

grpc:
  listen: "0.0.0.0:50051"
  subscribe: []
  health_check: true

debug:
  file_sink:
    enabled: true
    path: "/var/spool/dfe/debug/loader"
    format: "jsonl"

dlq:
  mode: "file_only"
  file_path: "/var/spool/dfe/dlq"

metrics:
  enabled: true
  address: "0.0.0.0:9090"

logging:
  level: info
  format: text
