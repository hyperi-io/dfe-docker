# External ClickHouse template. Copy values from your ClickHouse Cloud instance
# or on-prem installation. Set CLICKHOUSE_HOST in .env to skip the Docker container.
#
# Usage:
#   Mount this file instead of loader-grpc.yaml when using external ClickHouse:
#   - ./config/loader-ext-ch.yaml:/etc/dfe/loader.yaml:ro

transport: "grpc"
grpc:
  listen: "0.0.0.0:50051"
  subscribe: []
  health_check: true
  recv_buffer_size: 10000

clickhouse:
  hosts:
    - "your-instance.clickhouse.cloud:9440"   # Fill in your host:port
  database: dfe
  username: default
  password: "your-password-here"              # Fill in your password
  protocol: native
  tls:
    enabled: true
    skip_verify: false
    # ca_cert: /etc/ssl/ca.crt               # Optional: custom CA

routing:
  db_fields: []
  table_fields:
    - event_category
    - tags.event_category
  default_db: dfe
  default_table: default
  category_to_table:
    auth: auth_events
    api: api_events
    admin: admin_events
    errors: error_events

dlq:
  mode: "file_only"
  file_path: "/var/spool/dfe/dlq"

buffer:
  flush_bytes: 524288
  flush_rows: 1000
  flush_age_secs: 2

memory:
  limit_bytes: 67108864
  pressure_threshold: 0.8

metrics:
  enabled: true
  address: "0.0.0.0:9090"

logging:
  level: info
  format: text

timestamp_dq:
  enabled: true
  max_future_seconds: 600
  invalid_action: replace_with_now
  correct_known_bad: true

schema:
  cache_ttl_secs: 60
  refresh_on_error: true
