# Project:   dfe-docker
# File:      config/receiver-debug.yaml
# Purpose:   dfe-receiver config - file sink debug mode (no forwarding)
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

# Debug mode: writes events to JSONL files instead of forwarding downstream.
# Used with the debug compose profile. Shared volume at /var/spool/dfe.
# NOTE: requires FileSink destination to be implemented in dfe-receiver.
# Config is pre-wired; will activate once the feature is added.

server:
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760
  request_timeout_ms: 30000
  tls:
    enabled: false
  auth:
    mode: "none"

grpc:
  enabled: true
  bind_address: "0.0.0.0:6000"
  tls:
    enabled: false

validation:
  require_json: true
  required_fields: []
  dlq_on_invalid: true

destinations:
  default: "file"
  rules: []

debug:
  file_sink:
    enabled: true
    path: "/var/spool/dfe/debug/receiver"
    format: "jsonl"

dlq:
  enabled: true
  mode: "file_only"
  file_path: "/var/spool/dfe/dlq"

buffer:
  memory_limit: 0
  pressure_threshold: 0.8

metrics:
  enabled: true
  address: "0.0.0.0:9090"
