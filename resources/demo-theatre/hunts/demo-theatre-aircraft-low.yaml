name: demo-theatre-aircraft-low
display_name: Aircraft below 1,500 feet
cron: "*/5 * * * *"
# A required label: the runner takes each detection's org from the matched row.
customers:
  - demo
rules:
  - demo-theatre-aircraft-low
global_source_table_name: dfe.adsb-tracks
global_target_table_name: dfe.detection
checkpoint_timestamp_field: _timestamp_load
