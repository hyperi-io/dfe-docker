# Project:   dfe-docker
# File:      resources/demo/sources/wikipedia-recentchanges.yaml
# Purpose:   A demo fetcher that pulls live English Wikipedia recent changes
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

description: Live English Wikipedia recent changes, every edit and log entry as it happens
display_name: Wikipedia recent changes
fetcher:
  config:
    auth:
      mode: none
    interval_secs: 5
    profile:
      auth:
        accepts: [none]
      base_url: "{{ vars.api_url }}"
      endpoints:
        - add_fields:
            _dfe_fetcher_wiki: "{{ vars.wiki }}"
          paginate:
            from: "body:/continue/rccontinue"
            into: "query:rccontinue"
            strategy: cursor
          path: /w/api.php
          query:
            action: query
            format: json
            list: recentchanges
            rcdir: newer
            rcend: "{{ int(window.end) - 2 }}"
            rclimit: "100"
            rcprop: title|ids|sizes|flags|user|timestamp|comment
            rcstart: "{{ int(window.start) - 1 }}"
          rows:
            at: /query/recentchanges
            decoder: json_at
          unit: recentchanges
      headers:
        Accept: application/json
        User-Agent: DFE-demo/{{ vars.demo_version }} (https://github.com/hyperi-io/dfe-docker)
      probe:
        path: /w/api.php
        query:
          action: query
          format: json
          meta: siteinfo
      retry:
        never_retry: [401, 403]
      shape: incremental
      window:
        format: epoch_secs
        lookback: 30s
        # At about four edits a second a longer window passes the fetcher's page ceiling
        step: 5m
    vars:
      api_url: https://en.wikipedia.org
      demo_version: "2.2"
      wiki: en.wikipedia.org
  source_type: rest
  topic: own
header:
  type: common-header/timeseries
  version: 1.0.1
schema:
  meta_schema: meta/syslog
  meta_schema_version: 1.0.0
source: wikipedia-recentchanges
