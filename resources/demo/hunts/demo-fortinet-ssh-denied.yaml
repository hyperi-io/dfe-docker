name: demo-fortinet-ssh-denied
display_name: SSH connections denied by FortiGates
cron: "*/5 * * * *"
# A required label: the runner takes each detection's org from the matched row.
customers:
  - demo
rules:
  - demo-fortinet-ssh-denied
global_source_table_name: dfe.fortinet
global_target_table_name: dfe.detection
checkpoint_timestamp_field: _timestamp_load
