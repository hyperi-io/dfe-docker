# The engine's POST /sources body for the intake, whose match claims the receiver's `_source: syslog` lines for dfe-transform-elastic to relabel per vendor
intake:
  description: Raw vendor syslog, each line detected and parsed by dfe-transform-elastic in agentless mode
  display_name: Demo syslog
  header:
    type: common-header/timeseries
    version: 1.0.1
  match:
    field: _source
    operator: equals
    value: syslog
  schema:
    meta_schema: meta/syslog
    meta_schema_version: 1.0.0
  source: demo-syslog
  transform:
    detect:
      unmatched: passthrough
    engine: elastic
    mode: agentless

# Engine catalogue entries, one table each, whose default variants become the intake's detect candidates
sources:
  - cisco-asa
  - fortinet
