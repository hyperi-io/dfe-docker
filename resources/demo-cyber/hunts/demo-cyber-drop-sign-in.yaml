name: demo-cyber-drop-sign-in
display_name: Failed sign-ins from DROP-listed networks
cron: "*/5 * * * *"
# A required label: the runner takes each detection's org from the matched row.
customers:
  - default
rules:
  - demo-cyber-drop-sign-in
global_source_table_name: dfe.okta
global_target_table_name: dfe.detection
checkpoint_timestamp_field: _timestamp_load
