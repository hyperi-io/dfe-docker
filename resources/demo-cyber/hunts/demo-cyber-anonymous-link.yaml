name: demo-cyber-anonymous-link
display_name: Anonymous links used on Microsoft 365 files
cron: "*/5 * * * *"
# A required label: the runner takes each detection's org from the matched row.
customers:
  - demo
rules:
  - demo-cyber-anonymous-link
global_source_table_name: dfe.o365
global_target_table_name: dfe.detection
checkpoint_timestamp_field: _timestamp_load
