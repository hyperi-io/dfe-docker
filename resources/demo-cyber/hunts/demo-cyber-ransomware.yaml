name: demo-cyber-ransomware
display_name: Ransomware behaviour on endpoints
cron: "*/5 * * * *"
# A required label: the runner takes each detection's org from the matched row.
customers:
  - demo
rules:
  - demo-cyber-ransomware
global_source_table_name: dfe.crowdstrike
global_target_table_name: dfe.detection
checkpoint_timestamp_field: _timestamp_load
