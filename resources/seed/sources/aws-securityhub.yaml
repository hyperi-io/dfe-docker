source: aws-securityhub
display_name: AWS Security Hub
fetcher:
  source_type: aws
  config:
    access_key_id: env:AWS_ACCESS_KEY_ID
    interval_secs: 30
    region: us-west-2
    secret_access_key: env:AWS_SECRET_ACCESS_KEY
    services:
      - name: securityhub
header:
  type: common-header/timeseries
  version: 1.0.1
schema:
  meta_schema: meta/aws/securityhub
  meta_schema_version: 1.0.1
