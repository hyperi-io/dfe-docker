# Project:   dfe-docker
# File:      resources/demo-telco/sources/core-probes.yaml
# Purpose:   The telco demo's core probe table, NGAP, GTPv2-C and Diameter procedure records replayed through the receiver as JSON
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

description: >-
  Core network probe records for NGAP (N2), GTPv2-C (S11) and Diameter (S6a, Gx) procedures, each
  with its result, cause code and latency. Generated by events/generate.py with one failure burst
  and replayed with timestamps shifted to now.
display_name: Core probes
header:
  type: common-header/timeseries
  version: 1.0.1
# The field events/generate.py sets on every record, which the receiver routes on
match:
  field: _dfe_demo_source
  operator: equals
  value: core-probes
schema:
  meta_schema: meta/syslog
  meta_schema_version: 1.0.0
source: core-probes
