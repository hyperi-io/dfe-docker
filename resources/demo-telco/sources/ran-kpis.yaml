# Project:   dfe-docker
# File:      resources/demo-telco/sources/ran-kpis.yaml
# Purpose:   The telco demo's cell KPI table, five-minute PM counters per cell replayed through the receiver as JSON
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

description: >-
  Five-minute PM counters for 20 cells on 7 sites: downlink and uplink throughput, average RSRP,
  downlink PRB utilisation and active users. Generated by events/generate.py with three injected
  faults and replayed with timestamps shifted to now.
display_name: Cell KPIs
header:
  type: common-header/timeseries
  version: 1.0.1
# The field events/generate.py sets on every record, which the receiver routes on
match:
  field: _dfe_demo_source
  operator: equals
  value: ran-kpis
schema:
  meta_schema: meta/syslog
  meta_schema_version: 1.0.0
source: ran-kpis
