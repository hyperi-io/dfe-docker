name: demo-telco-weak-signal
display_name: Cell reporting a very weak signal
severity: medium
source: ran-kpis
source_type: raw
user_sql: "SELECT * FROM dfe.`ran-kpis` WHERE toFloat64OrZero(toString(_json.rsrp_dbm)) < -102"
