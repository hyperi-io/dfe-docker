name: demo-telco-peer-withdrawals
display_name: BGP withdrawal from a RIS peer
severity: medium
source: bgp-updates
source_type: raw
# A rule matches single rows and may not read another table, so the burst, more than 20 withdrawals in a minute from one peer, is counted where the demo-telco-bgp-peers dashboard reads the detections.
user_sql: "SELECT * FROM dfe.`bgp-updates` WHERE toString(_json.type) = 'W'"
