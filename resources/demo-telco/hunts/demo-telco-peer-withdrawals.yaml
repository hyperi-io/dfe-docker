name: demo-telco-peer-withdrawals
display_name: BGP peers withdrawing routes
cron: "*/5 * * * *"
# A required label: the runner takes each detection's org from the matched row.
customers:
  - default
rules:
  - demo-telco-peer-withdrawals
global_source_table_name: dfe.bgp-updates
global_target_table_name: dfe.detection
checkpoint_timestamp_field: _timestamp_load
