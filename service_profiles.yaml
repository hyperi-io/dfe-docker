# Project:   dfe-docker
# File:      service_profiles.yaml
# Purpose:   DFE service profiles - defines transport and enabled services
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Each profile names its transport and the DFE services it starts, with the config
# file each mounts (config_path, relative to config/). Keys and defaults: docs/profiles.md.

active_profile: single-kafka

profiles:
  slim-grpc:
    transport: grpc
    clickhouse: true
    core: true
    hyperdx: true
    otel: true
    services:
      dfe-loader:
        config_path: loader/grpc.yaml
      dfe-receiver:
        config_path: receiver/grpc.yaml

  slim-kafka:
    transport: kafka
    clickhouse: true
    core: true
    hyperdx: true
    kafbat: true
    otel: true
    services:
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml

  # dfe-engine runs a fetcher or transform for a source on Kafka only, so on gRPC
  # single runs no per-source app.
  single-grpc:
    transport: grpc
    clickhouse: true
    core: true
    hyperdx: true
    otel: true
    services:
      dfe-loader:
        config_path: loader/grpc.yaml
      dfe-receiver:
        config_path: receiver/grpc.yaml

  single-kafka:
    transport: kafka
    clickhouse: true
    core: true
    hyperdx: true
    kafbat: true
    otel: true
    fetcher_enabled: true
    transform_elastic_enabled: true
    transform_vector_enabled: true
    transform_vrl_enabled: true
    services:
      dfe-archiver:
        config_path: archiver/kafka.yaml
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
