# Project:   dfe-docker
# File:      service_profiles.yaml
# Purpose:   DFE service profiles - defines transport and enabled services
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Each profile declares a transport mode and which DFE services to start.
# Presence = enabled: if a service is listed, it starts. If absent, it does not.
#
# Active profile is overridden by DFE_PROFILE env var:
#   DFE_PROFILE=grpc-full make dev
#
# config_path is relative to the config/ directory.
#
# FOOTPRINT KEYS (optional, per profile) say which non-data-plane components run.
# An absent key keeps the default, so a profile that declares none behaves as it
# always has:
#
#   clickhouse  (default true)   the warehouse container
#   core        (default true)   dfe-engine, dfe-hunt-runner, dfe-ui, dfe-proxy
#   kafbat      (default true)   the Kafka UI; kafka transport only
#   hyperdx     (default false)  hyperdx + its Postgres and FerretDB
#   otel        (default false)  the collector that takes the stack's OWN telemetry
#   auth        (default false)  oauth2-proxy in front of each infra UI (kafbat,
#                                hyperdx); needs an OIDC issuer, so it stays off
#                                until a deployment supplies one
#
# The matching env var -- DFE_CLICKHOUSE_ENABLED, DFE_CORE_ENABLED,
# KAFBAT_ENABLED, DFE_HYPERDX_ENABLED, DFE_OTEL_ENABLED, DFE_AUTH_ENABLED --
# overrides the key, because .env is what a deploy writes and the profile is the
# committed shape.
#
# NAMING: `slim` and `single` are the shared vocabulary with the Kubernetes tier
# (dfe-infra argocd/values/profile-*.yaml), so one deployment dial reads the same
# on both. There is no `scale` here: Compose cannot run an HA broker or a
# ClickHouse cluster. Every profile below is single-node, so the axis that
# carries information is how COMPLETE the stack is, not the node count.
# The transport-shaped names below `single` are the fine-grained data-plane
# shapes; the e2e suite pins them by name.

active_profile: slim

profiles:
  # BEGIN projected profiles -- rendered by `make render-profiles`
  # Kubernetes is the master for these two: edit dfe-infra
  # argocd/values/profile-<mode>.yaml, then re-render. See docs/profiles.md.
  # Mirrors the Kubernetes slim tier: grpc transport, no broker, the warehouse,
  # self-monitoring, and the apps apps.yaml makes default there.
  slim:
    transport: grpc
    clickhouse: true
    core: true
    hyperdx: true
    otel: true
    services:
      dfe-archiver:
        config_path: archiver/grpc.yaml
      dfe-loader:
        config_path: loader/grpc.yaml
      dfe-receiver:
        config_path: receiver/grpc.yaml
  # Mirrors the Kubernetes single tier: kafka transport, the warehouse,
  # self-monitoring, and the apps apps.yaml makes default there.
  single:
    transport: kafka
    clickhouse: true
    core: true
    hyperdx: true
    kafbat: true
    otel: true
    services:
      dfe-archiver:
        config_path: archiver/kafka.yaml
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-elastic:
        config_path: transform-elastic/kafka.yaml
      dfe-transform-vrl:
        config_path: transform-vrl/kafka.yaml
  # END projected profiles

  # Hand-crafted from here down. WHICH apps the two projected profiles run is
  # dfe-infra apps.yaml's `default_in`, not a choice made here: they idle Ready
  # until an operator configures them, so being deployed unconfigured costs a
  # container and nothing else. The single tier therefore starts one archiver,
  # one fetcher and one transform-vrl idle, and the configs named `<app>/kafka.yaml`
  # are those idle ones; a profile below that exists to exercise an app names the
  # config that ships it work instead.
  kafka-minimal:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka.yaml

  kafka-full:
    transport: kafka
    services:
      dfe-archiver:
        config_path: archiver/kafka-archive.yaml
      dfe-fetcher:
        config_path: fetcher/aws-kafka.yaml
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml

  kafka-receiver:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml

  kafka-receiver-transform-vector:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka-load.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-vector:
        config_path: transform-vector/kafka.yaml

  kafka-full-transform-vrl:
    transport: kafka
    services:
      dfe-fetcher:
        config_path: fetcher/aws-kafka.yaml
      dfe-loader:
        config_path: loader/kafka-load.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-vrl:
        config_path: transform-vrl/main.yaml

  # The same shape on dfe-transform-elastic, on the config a projected tier would
  # give it. The loader is the topic_regex one rather than kafka-load.yaml,
  # because this app has no passthrough: an instance runs ONE compiled-in
  # transform, so nothing here moves main_land to main_load and the loader reads
  # the landing topic itself.
  kafka-full-transform-elastic:
    transport: kafka
    services:
      dfe-fetcher:
        config_path: fetcher/aws-kafka.yaml
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-elastic:
        config_path: transform-elastic/kafka.yaml

  # The per-source transform shape: two dfe-transform-vrl instances, one on the
  # shared main_land and one on the filebeat source's own filebeat_land, with
  # a loader consuming both output topics. A source with its own transform gets
  # its own instance and its own table; adding a second means adding a service,
  # not reconfiguring this one.
  kafka-filebeat:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka-load-filebeat.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-vrl:
        config_path: transform-vrl/main.yaml
      dfe-transform-vrl-filebeat:
        config_path: transform-vrl/filebeat.yaml

  # The same per-source shape as kafka-filebeat, with dfe-transform-vector doing
  # the transforming: the bundled filebeat VRL runs inside a Vector remap instead
  # of the embedded VRL engine. Its own source name, topics and table, so a
  # deployment can run this profile and kafka-filebeat side by side and compare
  # what the two transform apps make of the same corpus.
  kafka-filebeat-vector:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka-load-filebeat-vector.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-vector:
        config_path: transform-vector/kafka.yaml
      dfe-transform-vector-filebeat:
        config_path: transform-vector/filebeat.yaml

  # The per-source shape on dfe-transform-elastic: the source is cisco-ios rather
  # than filebeat because this app selects ONE compiled-in transform by name, and
  # `filebeat.cisco_ios.default` is a data stream rather than an umbrella
  # program. Its topics and its table are its own, disjoint from the two filebeat
  # profiles. One transform instance, not two: there is no passthrough to pair it
  # with, so the loader reads main_land directly through its topic_regex.
  kafka-elastic-cisco-ios:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-elastic-cisco-ios:
        config_path: transform-elastic/cisco-ios.yaml

  kafka-receiver-archiver:
    transport: kafka
    services:
      dfe-archiver:
        config_path: archiver/kafka-archive.yaml
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml

  # Every Kafka app with work to do, for the broker-outage e2e test: an idle app
  # joins no consumer group, so it cannot show a consumer resuming. Each
  # transform reads its own source's topic and the loader reads all three outputs.
  kafka-resilience:
    transport: kafka
    services:
      dfe-archiver:
        config_path: archiver/kafka-resilience.yaml
      dfe-loader:
        config_path: loader/kafka-resilience.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-elastic-cisco-ios:
        config_path: transform-elastic/cisco-ios.yaml
      dfe-transform-vector:
        config_path: transform-vector/resilience.yaml
      dfe-transform-vrl:
        config_path: transform-vrl/main.yaml

  kafka-fetcher:
    transport: kafka
    services:
      dfe-fetcher:
        config_path: fetcher/aws-kafka.yaml
      dfe-loader:
        config_path: loader/kafka.yaml

  grpc-minimal:
    transport: grpc
    services:
      dfe-loader:
        config_path: loader/grpc.yaml
  
  grpc-full:
    transport: grpc
    services:
      dfe-fetcher:
        config_path: fetcher/aws-grpc.yaml
      dfe-loader:
        config_path: loader/grpc.yaml
      dfe-receiver:
        config_path: receiver/grpc.yaml

  grpc-receiver:
    transport: grpc
    services:
      dfe-loader:
        config_path: loader/grpc.yaml
      dfe-receiver:
        config_path: receiver/grpc.yaml

  # A two-hop direct chain, receiver -> dfe-transform-vrl -> loader, all gRPC.
  grpc-receiver-transform-vrl:
    transport: grpc
    services:
      dfe-loader:
        config_path: loader/grpc.yaml
      dfe-receiver:
        config_path: receiver/grpc-transform-vrl.yaml
      dfe-transform-vrl:
        config_path: transform-vrl/grpc.yaml

  grpc-fetcher:
    transport: grpc
    services:
      dfe-fetcher:
        config_path: fetcher/aws-grpc.yaml
      dfe-loader:
        config_path: loader/grpc.yaml
