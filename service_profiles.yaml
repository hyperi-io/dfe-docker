# Project:   dfe-docker
# File:      service_profiles.yaml
# Purpose:   DFE service profiles - defines transport and enabled services
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Each profile declares a transport mode and which DFE services to start.
# Presence = enabled: if a service is listed, it starts. If absent, it does not.
#
# Active profile is overridden by DFE_PROFILE env var:
#   DFE_PROFILE=grpc-full make dev
#
# config_path is relative to the config/ directory.
#
# FOOTPRINT KEYS (optional, per profile) say which non-data-plane components run.
# An absent key keeps the default, so a profile that declares none behaves as it
# always has:
#
#   clickhouse  (default true)   the warehouse container
#   core        (default true)   dfe-engine, dfe-hunt-runner, dfe-ui, dfe-proxy
#   kafbat      (default true)   the Kafka UI; kafka transport only
#   hyperdx     (default false)  hyperdx + its Postgres and FerretDB
#   otel        (default false)  the collector that takes the stack's OWN telemetry
#   auth        (default false)  oauth2-proxy in front of each infra UI (kafbat,
#                                hyperdx); needs an OIDC issuer, so it stays off
#                                until a deployment supplies one
#
# The matching env var -- DFE_CLICKHOUSE_ENABLED, DFE_CORE_ENABLED,
# KAFBAT_ENABLED, DFE_HYPERDX_ENABLED, DFE_OTEL_ENABLED, DFE_AUTH_ENABLED --
# overrides the key, because .env is what a deploy writes and the profile is the
# committed shape.
#
# NAMING: `slim` and `single` are the shared vocabulary with the Kubernetes tier
# (dfe-infra argocd/values/profile-*.yaml), so one deployment dial reads the same
# on both. There is no `scale` here: Compose cannot run an HA broker or a
# ClickHouse cluster. Every profile below is single-node, so the axis that
# carries information is how COMPLETE the stack is, not the node count.
# The transport-shaped names below `single` are the fine-grained data-plane
# shapes; the e2e suite pins them by name.

active_profile: kafka-fetcher

profiles:
  # Mirrors the Kubernetes slim tier: gRPC transport, no broker, the
  # receiver/loader ingest path, and the collector that tier also runs.
  slim:
    transport: grpc
    clickhouse: true
    core: true
    otel: true
    services:
      dfe-loader:
        config_path: loader/grpc.yaml
      dfe-receiver:
        config_path: receiver/grpc.yaml

  # One node of the whole PLATFORM, with Kafka: warehouse, core surface, Kafka UI
  # and self-monitoring. The data plane is receiver + loader ONLY, because those
  # two are the pair that runs from a default deploy with nothing external
  # configured. dfe-archiver, dfe-fetcher and the transforms need endpoints or
  # credentials this profile cannot supply, so they stay opt-in on the
  # fine-grained profiles below. HyperDX is opt-in too, matching the Kubernetes
  # profile.
  single:
    transport: kafka
    clickhouse: true
    core: true
    kafbat: true
    otel: true
    services:
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml

  kafka-minimal:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka.yaml

  kafka-full:
    transport: kafka
    services:
      dfe-archiver:
        config_path: archiver/kafka.yaml
      dfe-fetcher:
        config_path: fetcher/aws-kafka.yaml
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml

  kafka-receiver:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml

  kafka-receiver-transform-vector:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka-load.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-vector:
        config_path: transform-vector/kafka.yaml

  kafka-full-transform-vrl:
    transport: kafka
    services:
      dfe-fetcher:
        config_path: fetcher/aws-kafka.yaml
      dfe-loader:
        config_path: loader/kafka-load.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-vrl:
        config_path: transform-vrl/kafka.yaml

  # The per-source transform shape: two dfe-transform-vrl instances, one on the
  # shared default_land and one on the filebeat source's own filebeat_land, with
  # a loader consuming both output topics. A source with its own transform gets
  # its own instance and its own table; adding a second means adding a service,
  # not reconfiguring this one.
  kafka-filebeat:
    transport: kafka
    services:
      dfe-loader:
        config_path: loader/kafka-load-filebeat.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml
      dfe-transform-vrl:
        config_path: transform-vrl/kafka.yaml
      dfe-transform-vrl-filebeat:
        config_path: transform-vrl/filebeat.yaml

  kafka-receiver-archiver:
    transport: kafka
    services:
      dfe-archiver:
        config_path: archiver/kafka.yaml
      dfe-loader:
        config_path: loader/kafka.yaml
      dfe-receiver:
        config_path: receiver/kafka.yaml

  kafka-fetcher:
    transport: kafka
    services:
      dfe-fetcher:
        config_path: fetcher/aws-kafka.yaml
      dfe-loader:
        config_path: loader/kafka.yaml

  grpc-minimal:
    transport: grpc
    services:
      dfe-loader:
        config_path: loader/grpc.yaml
  
  grpc-full:
    transport: grpc
    services:
      dfe-fetcher:
        config_path: fetcher/aws-grpc.yaml
      dfe-loader:
        config_path: loader/grpc.yaml
      dfe-receiver:
        config_path: receiver/grpc.yaml

  grpc-receiver:
    transport: grpc
    services:
      dfe-loader:
        config_path: loader/grpc.yaml
      dfe-receiver:
        config_path: receiver/grpc.yaml

  grpc-fetcher:
    transport: grpc
    services:
      dfe-fetcher:
        config_path: fetcher/aws-grpc.yaml
      dfe-loader:
        config_path: loader/grpc.yaml
