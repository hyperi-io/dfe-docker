#
# This file is auto-loaded by docker compose in dev (no flags needed).
# CI and production use: docker compose -f docker-compose.yml ... (skips this file)
#
# The <service>:local images are built by `make dev` / `make dev-build` via
# scripts/build_dev_images.py: each rust component is compiled from source with
# docker/dfe-rust-builder.Dockerfile, then packaged by the component's OWN
# committed Dockerfile (single source of truth for runtime). dfe-ui builds from
# its own Next.js standalone Dockerfile. Source comes via git (cloned into a
# managed cache at DFE_SRC_REF), or from your own checkouts when DFE_SRC_ROOT is
# set -- never from an assumed directory layout. To live-edit dfe-engine config
# without rebuilding, add docker-compose.live.yml: `make dev LIVE=1`.

services:
  dfe-receiver:
    image: dfe-receiver:local

  dfe-fetcher:
    image: dfe-fetcher:local

  dfe-archiver:
    image: dfe-archiver:local

  dfe-loader:
    image: dfe-loader:local

  dfe-transform-vector:
    image: dfe-transform-vector:local

  dfe-transform-vrl:
    image: dfe-transform-vrl:local

  dfe-engine:
    image: dfe-engine:local

  dfe-ui:
    image: dfe-ui:local

  hyperdx:
    image: hyperdx:local
