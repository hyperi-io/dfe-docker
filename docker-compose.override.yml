# Project:   dfe-docker
# File:      docker-compose.override.yml
# Purpose:   Dev mode - builds images from local source instead of pulling registry
# Language:  YAML
#
# License:   FSL-1.1-ALv2
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# This file is auto-loaded by docker compose in dev (no flags needed).
# CI and production use: docker compose -f docker-compose.yml ... (skips this file)
#
# Prereq: component repos (dfe-receiver, dfe-loader, hyperi-rustlib) must be
# checked out under PROJECTS_PATH (default: /projects).
# Set PROJECTS_PATH in .env to override. The Dockerfiles do a full cargo build
# inside the container. First build is slow (~5-10 min). Subsequent builds use
# Docker layer cache.

services:
  dfe-receiver:
    build:
      context: ${PROJECTS_PATH:-/projects}
      dockerfile: ${PROJECTS_PATH:-/projects}/dfe-docker/docker/dfe-receiver.Dockerfile
    image: dfe-receiver:local

  dfe-fetcher:
    build:
      context: ${PROJECTS_PATH:-/projects}
      dockerfile: ${PROJECTS_PATH:-/projects}/dfe-docker/docker/dfe-fetcher.Dockerfile
    image: dfe-fetcher:local

  dfe-archiver:
    build:
      context: ${PROJECTS_PATH:-/projects}
      dockerfile: ${PROJECTS_PATH:-/projects}/dfe-docker/docker/dfe-archiver.Dockerfile
    image: dfe-archiver:local

  dfe-loader:
    build:
      context: ${PROJECTS_PATH:-/projects}
      dockerfile: ${PROJECTS_PATH:-/projects}/dfe-docker/docker/dfe-loader.Dockerfile
    image: dfe-loader:local
