# Project:   dfe-docker
# File:      docker-compose.override.yml
# Purpose:   Dev mode - run locally built images instead of the registry ones
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# This file is auto-loaded by docker compose in dev (no flags needed).
# CI and production use: docker compose -f docker-compose.yml ... (skips this file)
#
# The <service>:local images are built by `make dev` / `make dev-build` via
# scripts/build_dev_images.py: each rust component is compiled from local source
# with docker/dfe-rust-builder.Dockerfile, then packaged by the component's OWN
# committed Dockerfile (single source of truth for runtime). dfe-ui builds from its
# own Next.js standalone Dockerfile. Prereq: the component repos are checked out
# under PROJECTS_PATH (default: /projects; see .env).

services:
  dfe-receiver:
    image: dfe-receiver:local

  dfe-fetcher:
    image: dfe-fetcher:local

  dfe-archiver:
    image: dfe-archiver:local

  dfe-loader:
    image: dfe-loader:local

  dfe-transform-vector:
    image: dfe-transform-vector:local

  dfe-transform-vrl:
    image: dfe-transform-vrl:local

  dfe-engine:
    image: dfe-engine:local
    volumes:
      - ${PROJECTS_PATH:-/projects}/dfe-engine/config:/app/config
      - ${PROJECTS_PATH:-/projects}/dfe-engine/schemas:/app/schemas

  dfe-ui:
    image: dfe-ui:local
