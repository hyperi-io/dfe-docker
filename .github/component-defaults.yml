components:
  - name:   archiver
    image:  ghcr.io/hyperi-io/dfe-archiver
    repo:   hyperi-io/dfe-archiver
    binary: dfe-archiver

  - name:   fetcher
    image:  ghcr.io/hyperi-io/dfe-fetcher
    repo:   hyperi-io/dfe-fetcher
    binary: dfe-fetcher

  - name:   loader
    image:  ghcr.io/hyperi-io/dfe-loader
    repo:   hyperi-io/dfe-loader
    binary: dfe-loader

  - name:   receiver
    image:  ghcr.io/hyperi-io/dfe-receiver
    repo:   hyperi-io/dfe-receiver
    binary: dfe-receiver

  - name:   transform-vector
    image:  ghcr.io/hyperi-io/dfe-transform-vector
    repo:   hyperi-io/dfe-transform-vector
    binary: dfe-transform-vector

  - name:   transform-vrl
    image:  ghcr.io/hyperi-io/dfe-transform-vrl
    repo:   hyperi-io/dfe-transform-vrl
    binary: dfe-transform-vrl
