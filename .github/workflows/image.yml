# Project:   dfe-docker
# File:      .github/workflows/image.yml
# Purpose:   Build the dfe-docker image for amd64 and arm64, and on a release push it and attach quickstart.json
#
# License:   BUSL-1.1 - HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED

# Two images per release, both built from one Dockerfile

name: Image

on:
  # A pull request builds both images and pushes nothing
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/image.yml
      - Makefile
      - docker/dfe-docker.Dockerfile
      - scripts/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach quickstart.json to
        required: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.7"
  REPOSITORY: ghcr.io/hyperi-io/dfe-docker
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    # Each architecture on its own runner, never emulated
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Name the release
        id: release
        run: |
          version="${TAG#v}"
          {
            echo "version=${version:-0.0.0-pr}"
            echo "stack=$(python3 scripts/quickstart_json.py --print-stack)"
            echo "push=${{ github.event_name != 'pull_request' }}"
          } >> "$GITHUB_OUTPUT"

      - name: GHCR login
        if: steps.release.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Pushed by digest only, the publish job tags both architectures
      - name: Build both images
        env:
          PUSH: ${{ steps.release.outputs.push }}
          STACK: ${{ steps.release.outputs.stack }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          # :<version> bakes in the pinned stack, :latest the newest
          for variant in latest pinned; do
            if [ "$variant" = latest ]; then
              stack=latest
              image="$REPOSITORY"
            else
              stack="$STACK"
              image="$REPOSITORY:$VERSION"
            fi
            docker buildx build \
              --platform "linux/${{ matrix.arch }}" \
              --file docker/dfe-docker.Dockerfile \
              --build-arg "IMAGE=$image" \
              --build-arg "STACK=$stack" \
              --build-arg "VERSION=$VERSION" \
              --output "type=image,name=$REPOSITORY,push-by-digest=true,name-canonical=true,push=$PUSH" \
              --metadata-file "$RUNNER_TEMP/$variant.json" \
              .
            jq -r '."containerimage.digest"' "$RUNNER_TEMP/$variant.json" > "$RUNNER_TEMP/digests/$variant-${{ matrix.arch }}"
          done

      - name: Hand the digests to the publish job
        if: steps.release.outputs.push == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          retention-days: 1

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Fetch the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - name: GHCR login
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # :latest moves only on a release that is not a pre-release
      - name: Tag both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          digests="$RUNNER_TEMP/digests"
          docker buildx imagetools create --tag "$REPOSITORY:$version" \
            "$REPOSITORY@$(cat "$digests/pinned-amd64")" "$REPOSITORY@$(cat "$digests/pinned-arm64")"
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false ]; then
            docker buildx imagetools create --tag "$REPOSITORY:latest" \
              "$REPOSITORY@$(cat "$digests/latest-amd64")" "$REPOSITORY@$(cat "$digests/latest-arm64")"
          fi
          docker buildx imagetools inspect "$REPOSITORY:$version"

      # scripts/stack.py reads the stack's image pins through oras
      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      # The compose files go in the package under their own tags
      - name: Publish the compose files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          docker compose version
          # The demo's helpers run the image just tagged, by digest
          digest="$(docker buildx imagetools inspect "$REPOSITORY:$version" --format '{{.Manifest.Digest}}')"
          moving=()
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false ]; then
            moving=(--moving)
          fi
          python3 scripts/publish_compose.py --stack "$(python3 scripts/quickstart_json.py --print-stack)" \
            --image "$REPOSITORY@$digest" --out-dir "$RUNNER_TEMP/compose" \
            --publish "$REPOSITORY" --release "$version" "${moving[@]}"

      - name: Attach quickstart.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/quickstart_json.py --version "${TAG#v}" --out "$RUNNER_TEMP/quickstart.json"
          cat "$RUNNER_TEMP/quickstart.json"
          gh release upload "$TAG" "$RUNNER_TEMP/quickstart.json" --repo "$GITHUB_REPOSITORY" --clobber
