        if dfe-transform-elastic config-schema --dir /app/content/contract/dfe-transform-elastic; then
          printf '{"app":"dfe-transform-elastic","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-transform-elastic/source.json
        else
          echo "contract: dfe-transform-elastic emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-transform-vector:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VECTOR_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-contract-dfe-transform-vector
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:-}
    command:
      - |
        if dfe-transform-vector config-schema --dir /app/content/contract/dfe-transform-vector; then
          printf '{"app":"dfe-transform-vector","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-transform-vector/source.json
        else
          echo "contract: dfe-transform-vector emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-transform-vrl:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VRL_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-contract-dfe-transform-vrl
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:-}
    command:
      - |
        if dfe-transform-vrl config-schema --dir /app/content/contract/dfe-transform-vrl; then
          printf '{"app":"dfe-transform-vrl","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
