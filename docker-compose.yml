#
# Profile    | Services
# -----------|---------------------
# clickhouse | clickhouse
# kafka      | kafka, kafka-init
# ui         | kafka-ui
#
# DFE services have no profile and are started by name. Which ones run is controlled by service_profiles.yaml at the repo root. Config paths are also set there.
#
# Quick start:
#   make dev                          # uses active_profile from service_profiles.yaml
#   DFE_PROFILE=grpc-full make dev    # override profile
#
# Dev build from source (requires docker-compose.override.yml - auto-loaded):
#   make dev
#
# CI / registry images only (skip override):
#   docker compose -f docker-compose.yml --profile clickhouse --profile kafka up -d dfe-loader

services:

  # ===========================================================================
  # ClickHouse
  # Set CLICKHOUSE_HOST in .env to use an external instance.
  # ===========================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-latest}
    container_name: dfe-clickhouse
    profiles: ["clickhouse"]
    ports:
      - ${CLICKHOUSE_HTTP_PORT:-8123}:8123
      - ${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init-dfe.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/default-user.xml:/etc/clickhouse-server/users.d/default-custom.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1 FROM system.databases WHERE name = '\"$$CLICKHOUSE_DB\"'\""]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ===========================================================================
  # Kafka KRaft
  # Opt-in interim transport. Selected automatically when DFE_TRANSPORT=kafka.
  # ===========================================================================

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    container_name: dfe-kafka
    profiles: ["kafka"]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-dfe-docker-dev-cluster-01}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:29092}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:29092}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
    ports:
      - ${KAFKA_PLAINTEXT_PORT:-9092}:9092
      - ${KAFKA_PLAINTEXT_HOST_PORT:-19092}:19092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # Kafka Init
  # Creates default topics on first start so consumers don't fail on empty broker.
  # ===========================================================================

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    container_name: dfe-kafka-init
    profiles: ["kafka"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic default_land \
          --partitions 1 --replication-factor 1
    restart: no

  # ===========================================================================
  # Kafka UI
  # Opt-in UI for Kafka cluster.
  # ===========================================================================

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFBAT_VERSION:-latest}
    container_name: dfe-kafka-ui
    profiles: ["ui"]
    ports:
      - ${KAFBAT_PORT:-8081}:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: ${KAFBAT_DYNAMIC_CONFIG_ENABLED:-true}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFBAT_KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS:-kafka:9092}
      KAFKA_CLUSTERS_0_NAME: ${KAFBAT_KAFKA_CLUSTERS_0_NAME:-dfe-local}

  # ===========================================================================
  # dfe-archiver
  # Only supports Kafka input transport.
  # ===========================================================================

  dfe-archiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:-latest}
    container_name: dfe-archiver
    profiles: ["dfe"]
    ports:
      - ${DFE_ARCHIVER_PROMETHEUS_PORT:-9093}:9090
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
        required: false
    # Archiver creates ./.tmp at startup; root WORKDIR isn't writable by appuser.
    working_dir: /home/appuser
    volumes:
      - ./config/${DFE_ARCHIVER_CONFIG:-archiver/kafka.yaml}:/etc/dfe/archiver.yaml:ro
      - archiver-data:/var/data/archive
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-fetcher
  # ===========================================================================

  dfe-fetcher:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-fetcher:${DFE_FETCHER_VERSION:-latest}
    container_name: dfe-fetcher
    profiles: ["dfe"]
    ports:
      - ${DFE_FETCHER_INGEST_PORT:-8082}:8080
      - ${DFE_FETCHER_PROMETHEUS_PORT:-9094}:9090
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DFE_FETCHER_SOURCES__AWS__REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      dfe-loader:
        condition: service_healthy
        required: false
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_FETCHER_CONFIG:-fetcher/aws-kafka.yaml}:/etc/dfe/fetcher.yaml:ro
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-loader
  # Defined before dfe-receiver so receiver can depend_on loader (gRPC path).
  # ===========================================================================

  dfe-loader:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-loader:${DFE_LOADER_VERSION:-latest}
    container_name: dfe-loader
    profiles: ["dfe"]
    ports:
      - ${DFE_LOADER_PROMETHEUS_PORT:-9091}:9090
      - ${DFE_LOADER_GRPC_PORT:-50051}:50051
    environment:
      DFE_LOADER_CLICKHOUSE__USERNAME: ${CLICKHOUSE_USERNAME:-default}
      DFE_LOADER_CLICKHOUSE__PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_LOADER_CONFIG:-loader/kafka.yaml}:/etc/dfe/loader.yaml:ro
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-receiver
  # ===========================================================================

  dfe-receiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-receiver:${DFE_RECEIVER_VERSION:-latest}
    container_name: dfe-receiver
    profiles: ["dfe"]
    ports:
      - ${DFE_RECEIVER_GRPC_PORT:-6000}:6000
      - ${DFE_RECEIVER_HTTP_PORT:-8080}:8080
      - ${DFE_RECEIVER_PROMETHEUS_PORT:-9090}:9090
      # Uncomment to expose additional ingest protocols:
      # - ${DFE_RECEIVER_BEATS_PORT:-5044}:5044
      # - ${DFE_RECEIVER_HEC_PORT:-8088}:8088
      # - ${DFE_RECEIVER_OTLP_GRPC_PORT:-4317}:4317
      # - ${DFE_RECEIVER_OTLP_HTTP_PORT:-4318}:4318
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      dfe-loader:
        condition: service_healthy
        required: false
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_RECEIVER_CONFIG:-receiver/kafka.yaml}:/etc/dfe-receiver/config.yaml:ro
      - dlq-spool:/var/spool/dfe
      # Uncomment to enable TLS on gRPC inbound (:6000):
      # - ./certs/dev/receiver.crt:/etc/ssl/receiver.crt:ro
      # - ./certs/dev/receiver.key:/etc/ssl/receiver.key:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vector
  # ===========================================================================

  dfe-transform-vector:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:-latest}
    container_name: dfe-transform-vector
    profiles: ["dfe"]
    ports:
      - ${DFE_TRANSFORM_VECTOR_PROMETHEUS_PORT:-9095}:9090
      - ${DFE_TRANSFORM_VECTOR_API_PORT:-8686}:8686
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_TRANSFORM_VECTOR_CONFIG:-transform-vector/kafka.yaml}:/etc/dfe-transform-vector/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vrl
  # ===========================================================================

  dfe-transform-vrl:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:-latest}
    container_name: dfe-transform-vrl
    profiles: ["dfe"]
    ports:
      - ${DFE_TRANSFORM_VRL_PROMETHEUS_PORT:-9096}:9090
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Workaround: dfe-transform-vrl double-starts a metrics server on the
      # same port as hyperi-rustlib's auto-started one. Move VRL's duplicate
      # to 9091 (internal-only) so rustlib's 9090 server keeps serving the
      # published port and healthcheck. See TODO.md `dfe-transform-vrl` issues.
      DFE_TRANSFORM_METRICS_ADDRESS: "0.0.0.0:9091"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_TRANSFORM_VRL_CONFIG:-transform-vrl/kafka.yaml}:/etc/dfe/config.yaml:ro
      - ./config/transform-vrl/transforms:/etc/dfe/transforms:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  clickhouse-data:
  kafka-data:
  archiver-data:
  dlq-spool:
