# License:   FSL-1.1-ALv2
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Profiles:
#   bare-bones   - dfe-receiver + dfe-loader via gRPC (DEFAULT - no ClickHouse, no Kafka)
#   full         - ClickHouse + dfe-receiver + dfe-loader via gRPC (DEFAULT - no Kafka)
#   full-kafka   - ClickHouse + dfe-receiver + dfe-loader via Kafka (opt-in)
#   ui           - Kafka-ui standalone (requires kafka profile)
#   debug        — File-sink mode, no ClickHouse writes
#
# Quick start (Kafka transport, works today):
#   DFE_TRANSPORT=kafka make dev
#
# Dev build from source (requires docker-compose.override.yml — auto-loaded):
#   make dev
#
# CI / registry images only (skip override):
#   docker compose -f docker-compose.yml --profile full-kafka up --build -d

# ===========================================================================
# Base DFE Services
# Allows different configs to be used on different profiles
# ===========================================================================

x-loader-base: &loader-base
  image: dfe-loader:${LOADER_VERSION:-latest}
  build:
    context: images/loader
    args:
      ARCHITECTURE: ${ARCHITECTURE:-linux-amd64}
      JFROG_TOKEN: ${JFROG_TOKEN}
      VERSION: ${LOADER_VERSION:-latest}
  ports:
    - "${DFE_LOADER_PROMETHEUS_PORT:-9091}:9090"
    - "${DFE_LOADER_GRPC_PORT:-50051}:50051"
  environment:
    DFE_LOADER__CLICKHOUSE__HOSTS: "${CLICKHOUSE_HOST:-clickhouse}:${CLICKHOUSE_PORT:-9000}"
    LOADER_LOG_LEVEL: ${LOG_LEVEL:-info}
    LOADER_LOG_FORMAT: ${LOG_FORMAT:-text}
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:9090/health/live"]
    interval: 10s
    timeout: 3s
    retries: 5

x-receiver-base: &receiver-base
  image: dfe-receiver:${RECEIVER_VERSION:-latest}
  build:
    context: images/receiver
    args:
      ARCHITECTURE: ${ARCHITECTURE:-linux-amd64}
      JFROG_TOKEN: ${JFROG_TOKEN}
      VERSION: ${RECEIVER_VERSION:-latest}
  ports:
    - "${DFE_RECEIVER_HTTP_PORT:-8080}:8080"
    - "${DFE_RECEIVER_PROMETHEUS_PORT:-9090}:9090"
    - "${DFE_RECEIVER_GRPC_PORT:-6000}:6000"
    # Uncomment to expose additional ingest protocols:
    # - "${DFE_RECEIVER_OTLP_GRPC_PORT:-4317}:4317"
    # - "${DFE_RECEIVER_OTLP_HTTP_PORT:-4318}:4318"
    # - "${DFE_RECEIVER_BEATS_PORT:-5044}:5044"
    # - "${DFE_RECEIVER_HEC_PORT:-8088}:8088"
  environment:
    RECEIVER_LOG_LEVEL: ${LOG_LEVEL:-info}
    RECEIVER_LOG_FORMAT: ${LOG_FORMAT:-text}
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:9090/health/live"]
    interval: 10s
    timeout: 3s
    retries: 5

services:

  # ===========================================================================
  # ClickHouse (profiles: full, full-kafka)
  # Use profile 'bare-bones' and set CLICKHOUSE_HOST in .env to use an external instance.
  # ===========================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-latest}
    container_name: dfe-clickhouse
    profiles: ["full", "full-kafka"]
    ports:
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dfe}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init-dfe.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query \"SELECT 1 FROM system.databases WHERE name = '${CLICKHOUSE_DB:-dfe}'\""]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ===========================================================================
  # Kafka KRaft (profile: full-kafka)
  # Opt-in interim transport. Selected automatically when DFE_TRANSPORT=kafka.
  # ===========================================================================

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    container_name: dfe-kafka
    profiles: ["full-kafka"]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-dfe-docker-dev-cluster-01}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:29092}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:29092}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
    ports:
      - "${KAFKA_PLAINTEXT_PORT:-9092}:9092"
      - "${KAFKA_PLAINTEXT_HOST_PORT:-19092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFBAT_VERSION:-latest}
    container_name: dfe-kafka-ui
    profiles: ["ui"]
    ports:
      - "${KAFBAT_PORT:-8081}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: ${KAFBAT_DYNAMIC_CONFIG_ENABLED:-true}
      KAFKA_CLUSTERS_0_NAME: ${KAFBAT_KAFKA_CLUSTERS_0_NAME:-dfe-local}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS:-kafka:9092}
    depends_on:
      kafka:
        condition: service_healthy

  # ===========================================================================
  # dfe-loader (profiles: bare-bones, full, full-kafka, debug)
  # Defined before dfe-receiver so receiver can depend_on loader (gRPC path).
  # ===========================================================================

  dfe-loader-bare-bones:
    <<: *loader-base
    container_name: dfe-loader-bare-bones
    profiles: ["bare-bones"]
    volumes:
      - ./config/loader-grpc.yaml:/etc/dfe/loader.yaml:ro

  dfe-loader:
    <<: *loader-base
    container_name: dfe-loader
    profiles: ["full"]
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./config/loader-grpc.yaml:/etc/dfe/loader.yaml:ro

  dfe-loader-kafka:
    <<: *loader-base
    container_name: dfe-loader-kafka
    profiles: ["full-kafka"]
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./config/loader-kafka.yaml:/etc/dfe/loader.yaml:ro

  dfe-loader-debug:
    # Requires FileSink support (pre-wired, pending impl)
    <<: *loader-base
    container_name: dfe-loader-debug
    profiles: ["debug"]
    volumes:
      - ./config/loader-debug.yaml:/etc/dfe/loader.yaml:ro
      - dfe-debug:/var/spool/dfe

  # ===========================================================================
  # dfe-receiver (profiles: bare-bones, full, full-kafka, debug)
  # ===========================================================================

  dfe-receiver-bare-bones:
    <<: *receiver-base
    container_name: dfe-receiver-bare-bones
    profiles: ["bare-bones"]
    depends_on:
      dfe-loader-bare-bones:
        condition: service_healthy
    volumes:
      - ./config/receiver-grpc.yaml:/etc/dfe-receiver/config.yaml:ro
      # Uncomment to enable TLS on gRPC inbound (:6000):
      # - ./certs/dev/receiver.crt:/etc/ssl/receiver.crt:ro
      # - ./certs/dev/receiver.key:/etc/ssl/receiver.key:ro

  dfe-receiver:
    <<: *receiver-base
    container_name: dfe-receiver
    profiles: ["full"]
    depends_on:
      dfe-loader:
        condition: service_healthy
    volumes:
      - ./config/receiver-grpc.yaml:/etc/dfe-receiver/config.yaml:ro
      # Uncomment to enable TLS on gRPC inbound (:6000):
      # - ./certs/dev/receiver.crt:/etc/ssl/receiver.crt:ro
      # - ./certs/dev/receiver.key:/etc/ssl/receiver.key:ro

  dfe-receiver-kafka:
    <<: *receiver-base
    container_name: dfe-receiver-kafka
    profiles: ["full-kafka"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config/receiver-kafka.yaml:/etc/dfe-receiver/config.yaml:ro

  dfe-receiver-debug:
    # Requires FileSink support (pre-wired, pending impl)
    <<: *receiver-base
    container_name: dfe-receiver-debug
    profiles: ["debug"]
    depends_on:
      dfe-loader-debug:
        condition: service_healthy
    volumes:
      - ./config/receiver-debug.yaml:/etc/dfe-receiver/config.yaml:ro
      - dfe-debug:/var/spool/dfe

volumes:
  clickhouse-data:
  kafka-data:
  dfe-debug:
