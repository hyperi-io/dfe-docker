# Project:   dfe-docker
# File:      docker-compose.yml
# Purpose:   DFE 2.2 Docker Compose stack
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Profile        | Services                            | Notes                                     |
# ---------------|-------------------------------------|-------------------------------------------|
# clickhouse     | clickhouse                          |                                           |
# kafka-redpanda | kafka-redpanda                      | Redpanda (default); BSL -- see README      |
# kafka-apache   | kafka-apache                        | Apache Kafka (opt-in); Apache-2.0 only     |
# kafka-ui       | kafka-ui                            |                                           |
# otel           | otel-collector                      | self-monitoring; opt-in                   |
# auth           | oauth2-proxy-* (3)                  | edge OIDC + group check; opt-in           |
#
# The kafka-* profiles are mutually exclusive: all three share the network alias `kafka`, and downstream
# configs always address `kafka:9092`.
#
# Topics and ClickHouse objects are NOT created here. dfe-schemas declares them and dfe-engine applies
# them at its own startup, reporting healthy only once that pass converged -- which is what every
# `depends_on: dfe-engine: service_healthy` below is waiting for.
#
# DFE services carry profiles too -- `dfe`, `core`, `hyperdx`, `otel`. WHICH of them start is a second,
# independent selection made by service_profiles.yaml, which also sets their config paths.
#
# Three host-binding variables, split by audience: DFE_INGRESS_BIND_HOST (ingest, 0.0.0.0), DFE_UI_BIND_HOST
# (every web UI, from the DFE_BIND_SCOPE dial, 127.0.0.1) and DFE_BIND_HOST (operators, 127.0.0.1).
# docs/operating.md#port-exposure-is-split-by-audience.
#
# Every DFE service serves `/livez`, `/readyz` and `/metrics` and nothing else -- the retired aliases 404.
# A HEALTHCHECK uses `/livez` EXCEPT where a `depends_on` gates on it, which is why dfe-loader and
# dfe-engine use `/readyz`. docs/troubleshooting.md#which-path-each-healthcheck-uses-and-why-it-differs.
#
# Every service declares deploy.resources.limits, in four tiers. `make limits` prints the resolved numbers;
# docs/operating.md#resource-limits-four-tiers-ceilings-not-reservations explains the sizing.
#
# Every DFE app runs a release check at startup, ON unless .env says otherwise. DFE_VERSION_CHECK_ENABLED=false
# turns it off in all of them and DFE_VERSION_CHECK_SEND_INSTANCE_ID=false keeps it without the install id.
# Each app reads scalo's key under its own cascade prefix, so each service maps the one dial onto its spelling.
# docs/configuration.md#release-check.
#
# Quick start:
#   make dev                         # Uses active_profile from service_profiles.yaml
#   DFE_PROFILE=single-kafka make dev  # Override profile
#   KAFKA_BACKEND=apache make dev    # Override Kafka backend
#
# Dev build from source (requires docker-compose.override.yml - auto-loaded):
#   make dev
#
# CI / registry images only (skip override):
#   docker compose -f docker-compose.yml --profile clickhouse --profile kafka-redpanda up -d dfe-loader

# =============================================================================
# Resource limit tiers
# Anchors, not services -- the `x-` prefix keeps Compose from treating them as one.
# =============================================================================

# Sized for a 16 GB box running the DEFAULT profile. No totals written down here
# -- `make limits` computes them from the resolved config and cannot drift.
x-limits-clickhouse: &limits-clickhouse
  resources:
    limits:
      cpus: "${DFE_CLICKHOUSE_CPUS:-2.0}"
      memory: ${DFE_CLICKHOUSE_MEMORY:-3G}

# Redpanda subtracts the HOST's vm.min_free_kbytes from this limit before it
# checks --memory. redpanda/start.sh lowers --memory to what fits, and this
# headroom keeps the full 1G on any host whose reserve is under 1536M.
x-limits-broker: &limits-broker
  resources:
    limits:
      cpus: "${DFE_BROKER_CPUS:-1.5}"
      memory: ${DFE_BROKER_MEMORY:-2560M}

# 2.0 CPUs is a FLOOR, not a sizing estimate. Below it Tokio gives a scalo service
# one worker thread, the Kafka poll loop owns it, and the whole observability port
# goes dark while the data path keeps working. `make check-compose` enforces it.
# docs/operating.md#dfe_service_cpus-has-a-floor-of-20-and-it-is-not-about-speed
x-limits-service: &limits-service
  resources:
    limits:
      cpus: "${DFE_SERVICE_CPUS:-2.0}"
      memory: ${DFE_SERVICE_MEMORY:-768M}

# HyperDX takes the service tier's CPUs but not its memory.
# On node 24 its four Node processes hold about 820 MiB for the first 100 s after a start, so 768M OOM-kills it in a loop.
# 2G is the limit the Kubernetes hyperdx chart gives the same image.
x-limits-hyperdx: &limits-hyperdx
  resources:
    limits:
      cpus: "${DFE_SERVICE_CPUS:-2.0}"
      memory: ${DFE_HYPERDX_MEMORY:-2G}

# 512M rather than less: a sidecar's whole job is to exit cleanly, and a tighter
# cap risks an OOM kill on one.
x-limits-sidecar: &limits-sidecar
  resources:
    limits:
      cpus: "${DFE_SIDECAR_CPUS:-0.5}"
      memory: ${DFE_SIDECAR_MEMORY:-512M}

# =============================================================================
# oauth2-proxy shared settings (the opt-in `auth` profile)
#
# One OIDC identity and one cookie secret across every infra-UI proxy, so a
# single sign-in covers all of them. They gate on the SAME groups, so sharing a
# session is the intent rather than a leak. Cookies ignore PORT, which is what
# lets the HyperDX app and its API sit on one session across two origins.
#
# EVERY key here takes a default and none of them is a hard-fail, which is
# load-bearing: compose interpolates the whole file BEFORE it filters by profile,
# so a hard-fail key inside a profiled service aborts a stack that never asked
# for that profile. dfe-docker may not require an OIDC issuer to start, so the
# "issuer is missing" check lives in resolve_profile.py, which runs only when the
# auth footprint actually resolves ON.
# =============================================================================
x-oauth2-proxy-env: &oauth2-proxy-env
  OAUTH2_PROXY_PROVIDER: oidc
  OAUTH2_PROXY_OIDC_ISSUER_URL: ${DFE_OIDC_ISSUER_URL:-}
  OAUTH2_PROXY_CLIENT_ID: ${DFE_OIDC_CLIENT_ID:-}
  OAUTH2_PROXY_CLIENT_SECRET: ${DFE_OIDC_CLIENT_SECRET:-}
  # The group check, not authn alone. Plural env name because --allowed-group is
  # a list flag. Setting it makes the generic OIDC provider request the `groups`
  # scope implicitly, so there is no separate scope dial to keep in step.
  OAUTH2_PROXY_ALLOWED_GROUPS: ${DFE_OIDC_ALLOWED_GROUPS:-dfe-infra,dfe-admin}
  # `*` because the group check is the gate. Narrowing by email domain as well
  # is a deployment's choice, not a default.
  OAUTH2_PROXY_EMAIL_DOMAINS: ${DFE_OIDC_EMAIL_DOMAINS:-*}
  OAUTH2_PROXY_COOKIE_SECRET: ${DFE_OAUTH2_PROXY_COOKIE_SECRET:-}
  # Blank = a host-only cookie, which is what shares one session across the
  # infra UIs on a single box. Name it only for a real multi-host deployment.
  OAUTH2_PROXY_COOKIE_DOMAINS: ${DFE_OAUTH2_PROXY_COOKIE_DOMAIN:-}
  # Compose serves plain HTTP, so a Secure cookie would never be sent back and
  # every sign-in would loop. Behind real TLS, set this true.
  OAUTH2_PROXY_COOKIE_SECURE: ${DFE_OAUTH2_PROXY_COOKIE_SECURE:-false}
  OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

# =============================================================================
# Where the DFE apps reach Kafka, as resolve_profile.py resolves DFE_KAFKA_BOOTSTRAP_SERVERS: empty on a profile without Kafka
# =============================================================================
x-kafka-brokers: &kafka-brokers ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}

services:

  # ===========================================================================
  # ClickHouse
  # Set CLICKHOUSE_HOST in .env to use an external instance.
  # Ports bind DFE_BIND_HOST (loopback by default): an unauthenticated analytics
  # database on 0.0.0.0 is fine on a laptop and an open database anywhere else.
  # ===========================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin CLICKHOUSE_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-clickhouse
    # Fixed, because the Replicated database leaves a stale host id behind on every recreate
    hostname: clickhouse
    profiles: ["clickhouse"]
    restart: unless-stopped
    deploy: *limits-clickhouse
    ports:
      # Host publish only: every service on the network dials 8123/9000 directly.
      - ${DFE_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123
      - ${DFE_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Read by replication.xml. Required: a server started on `dfe:` exits 231 once a real password lands
      DFE_KEEPER_IDENTITY: dfe:${CLICKHOUSE_KEEPER_PASSWORD:?run 'make init' to mint CLICKHOUSE_KEEPER_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # access_control_improvements is only read from config.d
      - ./config/clickhouse/server-custom.xml:/etc/clickhouse-server/config.d/dfe-custom.xml:ro
      # What dfe-engine's Replicated DDL needs from a self-hosted server
      - ./config/clickhouse/replication.xml:/etc/clickhouse-server/config.d/dfe-replication.xml:ro
      # Replaces the image's file of that name, which opens every port on every interface
      - ./config/clickhouse/listen.xml:/etc/clickhouse-server/config.d/docker_related_config.xml:ro
      # The image logs at trace and keeps system log tables with no TTL
      - ./config/clickhouse/server-logger.xml:/etc/clickhouse-server/config.d/dfe-logger.xml:ro
      - ./config/clickhouse/system-logs.xml:/etc/clickhouse-server/config.d/dfe-system-logs.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1 FROM system.databases WHERE name = '\"$$CLICKHOUSE_DB\"'\""]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ===========================================================================
  # Kafka (Redpanda)
  # Default Kafka-API broker (mutually exclusive with other kafka-* services)
  #
  # LICENCE: the core is BSL, not OSS. Set KAFKA_BACKEND=apache if a
  # per-deployment check does not come back clean.
  # docs/operating.md#kafka-backend-licensing-is-a-human-decision
  #
  # `--mode=dev-container` is Redpanda's DEVELOPER mode, not a production one.
  # docs/operating.md#redpanda-ships-in-developer-mode
  # ===========================================================================

  kafka-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:?run 'make stack VERSION=X.Y.Z' to pin REDPANDA_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-kafka-redpanda
    profiles: ["kafka-redpanda"]
    restart: unless-stopped
    deploy: *limits-broker
    networks:
      default:
        aliases:
          - kafka
    # redpanda/start.sh appends --memory: REDPANDA_MEMORY, lowered to what the
    # container limit holds once this host's kernel reserve is taken off.
    entrypoint: ["/bin/bash", "/usr/local/bin/dfe-redpanda-start.sh"]
    environment:
      REDPANDA_MEMORY: ${REDPANDA_MEMORY:-1G}
    command:
      - redpanda
      - start
      - --mode=${REDPANDA_MODE:-dev-container}
      - --smp=${REDPANDA_SMP:-1}
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}:19092
    volumes:
      - kafka-redpanda-data:/var/lib/redpanda/data
      - ./redpanda/start.sh:/usr/local/bin/dfe-redpanda-start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # Apache Kafka
  # Opt-in Kafka alternative (mutually exclusive with other kafka-* services)
  # ===========================================================================

  kafka-apache:
    image: apache/kafka:${APACHE_KAFKA_VERSION:?run 'make stack VERSION=X.Y.Z' to pin APACHE_KAFKA_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-kafka-apache
    profiles: ["kafka-apache"]
    restart: unless-stopped
    deploy: *limits-broker
    networks:
      default:
        aliases:
          - kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-dfe-docker-dev-cluster-01}
      # KAFKA_ADVERTISED_HOST / KAFKA_PLAINTEXT_HOST_PORT are threaded through here
      # too, so the .env.example guidance about advertising a reachable name works
      # on BOTH backends. Previously this hardcoded localhost:19092 while the
      # Redpanda service honoured the variables -- so following the documentation
      # on the Apache backend silently did nothing.
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:29092}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:29092}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}:19092
    volumes:
      - kafka-apache-data:/var/lib/kafka/data
      # The image declares these as VOLUMEs too, empty unless a deployment
      # supplies TLS material or property files. Named, so no down/up strands one.
      - kafka-apache-secrets:/etc/kafka/secrets
      - kafka-apache-config:/mnt/shared/config
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # Kafka UI
  # Opt-in UI for Kafka cluster.
  # ===========================================================================

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFBAT_VERSION:?run 'make stack VERSION=X.Y.Z' to pin KAFBAT_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-kafka-ui
    profiles: ["kafka-ui"]
    restart: unless-stopped
    # Service tier, not sidecar: kafbat is a Spring Boot JVM, and the JVM sizes its
    # heap as a percentage of the container limit. On the 512M sidecar tier that
    # leaves roughly 128M of heap, and an OOM kill under `restart: unless-stopped`
    # becomes a restart loop rather than a clean failure.
    deploy: *limits-service
    ports:
      # A web UI, so it binds DFE_UI_BIND_HOST (the DFE_BIND_SCOPE dial), and it
      # is INFRA class -- DFE_INFRA_UIS_EXTERNAL=false unpublishes it along with
      # HyperDX. docs/operating.md#port-exposure-is-split-by-audience
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${KAFBAT_PORT:-8081}:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: ${KAFBAT_DYNAMIC_CONFIG_ENABLED:-true}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFBAT_KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS:-kafka:9092}
      KAFKA_CLUSTERS_0_NAME: ${KAFBAT_KAFKA_CLUSTERS_0_NAME:-dfe-local}

  # ===========================================================================
  # dlq-init
  # Makes the shared DLQ spool, the archive volume and the fetcher cursors
  # writable by the services that use them: Docker creates each mountpoint
  # root-owned and every consumer runs as uid 1000, so without this dfe-archiver
  # crash-loops on its eager DLQ writer and fails every archive write.
  #
  # Three sharp edges -- `required: false` means a FAILED dlq-init only warns,
  # uid 1000 is hard-coded, and no profile names this service, so dev mode builds
  # the archiver for it. docs/troubleshooting.md#the-dlq-spool
  # ===========================================================================

  dlq-init:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ARCHIVER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-dlq-init
    profiles: ["dfe"]
    deploy: *limits-sidecar
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # A LIST with one element, not a bare scalar. Compose splits a scalar command
    # into argv, so `sh -c` would receive only `chown` and the rest would land in
    # $0/$1/$2 -- which fails with "chown: missing operand".
    command:
      - chown -R 1000:1000 /var/spool/dfe /var/data/archive /var/lib/dfe-fetcher
    volumes:
      - dlq-spool:/var/spool/dfe
      - archiver-data:/var/data/archive
      - fetcher-cursors:/var/lib/dfe-fetcher
    restart: "no"

  # Creates the directory dfe-receiver mounts out of the engine's volume, because
  # Docker refuses to start a container whose volume subpath is missing: an
  # engine too old to write it, no engine at all, or one that failed its sync.
  # The engine's image at the engine's mount path, so a first mount of an empty
  # volume gets the uid 1000 owner the engine itself would give it.
  bearer-tokens-init:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-bearer-tokens-init
    profiles: ["dfe"]
    deploy: *limits-sidecar
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      DFE_CONFIG_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}
    # A LIST with one element, for the reason dlq-init's command gives. Owner-only,
    # as the engine's secrets store creates its own directories.
    command:
      - umask 077 && mkdir -p "$$DFE_CONFIG_DIR/.secrets/ingest/bearer-tokens"
    volumes:
      - dfe-engine-config:${DFE_ENGINE_CONFIG_DIR:-/app/config}
    restart: "no"

  # ===========================================================================
  # contract-<app>
  # One one-shot per app, running that app's OWN pinned image: `config-schema`
  # writes the config schema and capability catalogue of the exact binary this
  # stack runs into dfe-engine-content, and the engine reads them back at
  # /contract/<app>. The Kubernetes tier does the same with one init container
  # per app (dfe-infra #305).
  #
  # An app that cannot emit must not wedge the engine. scalo exits non-zero when
  # it fails to WRITE, so the command wraps the call and logs instead, and the
  # engine's depends_on carries `required: false` on top of that.
  #
  # source.json names the ref that produced the directory: a contract is a
  # property of one digest and none of the four files says which.
  #
  # These stay on the registry pin in dev -- the committed override repoints the
  # app services and not these, so a local build's contract is the pin's.
  # ===========================================================================

  contract-dfe-archiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ARCHIVER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-contract-dfe-archiver
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      # The ref this contract came from. The image line above hard-fails on an
      # unset pin, so it never renders empty.
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:-}
    # A LIST with one element, for the reason dlq-init's command gives.
    command:
      - |
        if dfe-archiver config-schema --dir /app/content/contract/dfe-archiver; then
          printf '{"app":"dfe-archiver","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-archiver/source.json
        else
          echo "contract: dfe-archiver emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-fetcher:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-fetcher:${DFE_FETCHER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_FETCHER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-contract-dfe-fetcher
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-fetcher:${DFE_FETCHER_VERSION:-}
    command:
      - |
        if dfe-fetcher config-schema --dir /app/content/contract/dfe-fetcher; then
          printf '{"app":"dfe-fetcher","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-fetcher/source.json
        else
          echo "contract: dfe-fetcher emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-loader:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-loader:${DFE_LOADER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_LOADER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-contract-dfe-loader
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-loader:${DFE_LOADER_VERSION:-}
    command:
      - |
        if dfe-loader config-schema --dir /app/content/contract/dfe-loader; then
          printf '{"app":"dfe-loader","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-loader/source.json
        else
          echo "contract: dfe-loader emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-receiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-receiver:${DFE_RECEIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_RECEIVER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-contract-dfe-receiver
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-receiver:${DFE_RECEIVER_VERSION:-}
    command:
      - |
        if dfe-receiver config-schema --dir /app/content/contract/dfe-receiver; then
          printf '{"app":"dfe-receiver","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-receiver/source.json
        else
          echo "contract: dfe-receiver emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-transform-elastic:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-elastic:${DFE_TRANSFORM_ELASTIC_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_ELASTIC_VERSION}
