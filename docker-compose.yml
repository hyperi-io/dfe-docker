# Project:   dfe-docker
# File:      docker-compose.yml
# Purpose:   DFE 2.2 Docker Compose stack
# Language:  YAML
#
# License:   FSL-1.1-ALv2
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Usage:
#   docker compose --profile infra up -d          # Infrastructure only (bare-metal testing)
#   docker compose --profile full up -d           # Full stack (receiver + loader + infra)
#   docker compose --profile full --profile ui up -d  # Full stack + Redpanda Console
#
# Data flow:
#   curl/Vector -> dfe-receiver (:8080) -> Redpanda -> dfe-loader -> ClickHouse (dfe.*)

services:
  # ===========================================================================
  # Infrastructure (profile: infra)
  # ===========================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: dfe-clickhouse
    profiles: ["infra", "full"]
    ports:
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_DB: dfe
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init-dfe.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redpanda:
    image: redpandadata/redpanda:v24.2.1
    container_name: dfe-redpanda
    profiles: ["infra", "full"]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
    ports:
      - "19092:19092"
      - "18082:18082"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # DFE Services (profile: full)
  # ===========================================================================

  dfe-receiver:
    image: ghcr.io/hyperi-io/dfe-receiver:${DFE_RECEIVER_VERSION:-latest}
    container_name: dfe-receiver
    profiles: ["full"]
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./config/receiver-docker.yaml:/etc/dfe/receiver.yaml:ro
    environment:
      RECEIVER_LOG_LEVEL: "${LOG_LEVEL:-info}"
      RECEIVER_LOG_FORMAT: text

  dfe-loader:
    image: ghcr.io/hyperi-io/dfe-loader:${DFE_LOADER_VERSION:-latest}
    container_name: dfe-loader
    profiles: ["full"]
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "9091:9091"
    volumes:
      - ./config/loader-docker.yaml:/etc/dfe/loader.yaml:ro
    environment:
      LOADER_LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOADER_LOG_FORMAT: text

  # ===========================================================================
  # Optional: Redpanda Console (profile: ui)
  # ===========================================================================

  console:
    image: redpandadata/console:v2.7.0
    container_name: dfe-console
    profiles: ["ui"]
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  clickhouse-data:
  redpanda-data:
