# Project:   dfe-docker
# File:      docker-compose.yml
# Purpose:   DFE 2.2 Docker Compose stack
# Language:  YAML
#
# License:   FSL-1.1-ALv2
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Usage:
#   docker compose --profile infra up -d          # Infrastructure only (bare-metal testing)
#   docker compose --profile full up -d           # Full stack (receiver + loader + infra)
#   docker compose --profile full --profile ui up -d  # Full stack + Kafbat UI
#
# Data flow:
#   curl/Vector -> dfe-receiver (:8080) -> Kafka -> dfe-loader -> ClickHouse (dfe.*)

services:
  # ===========================================================================
  # Infrastructure (profile: infra)
  # ===========================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: dfe-clickhouse
    profiles: ["infra", "full"]
    ports:
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_DB: dfe
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init-dfe.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  kafka:
    image: apache/kafka:4.2.0
    container_name: dfe-kafka
    profiles: ["infra", "full"]
    environment:
      # KRaft combined mode (broker + controller in one node)
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      # Listeners: internal (containers), external (host), controller (raft)
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Single-node replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Cluster ID (static for reproducible dev environment)
      CLUSTER_ID: "dfe-docker-dev-cluster-01"
    ports:
      - "19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # DFE Services (profile: full)
  # ===========================================================================

  dfe-receiver:
    image: ghcr.io/hyperi-io/dfe-receiver:${DFE_RECEIVER_VERSION:-latest}
    container_name: dfe-receiver
    profiles: ["full"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./config/receiver-docker.yaml:/etc/dfe/receiver.yaml:ro
    environment:
      RECEIVER_LOG_LEVEL: "${LOG_LEVEL:-info}"
      RECEIVER_LOG_FORMAT: text

  dfe-loader:
    image: ghcr.io/hyperi-io/dfe-loader:${DFE_LOADER_VERSION:-latest}
    container_name: dfe-loader
    profiles: ["full"]
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "9091:9091"
    volumes:
      - ./config/loader-docker.yaml:/etc/dfe/loader.yaml:ro
    environment:
      LOADER_LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOADER_LOG_FORMAT: text

  # ===========================================================================
  # Optional: Kafbat UI (profile: ui)
  # ===========================================================================

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    container_name: dfe-kafka-ui
    profiles: ["ui"]
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "dfe-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  clickhouse-data:
  kafka-data:
