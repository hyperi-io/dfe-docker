# Project:   dfe-docker
# File:      docker-compose.yml
# Purpose:   DFE 2.2 Docker Compose stack
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Profile        | Services
# ---------------|----------------------------------------------
# clickhouse     | clickhouse
# kafka-apache   | kafka-apache, the Apache-2.0 broker
# kafka-redpanda | kafka-redpanda, the default broker
# kafka-ui       | kafka-ui
# otel           | otel-collector
# auth           | the three oauth2-proxy-* gates
# dfe            | the data-plane apps and their init one-shots
# core           | engine, hunt runner, UI, proxy and contracts
# hyperdx        | dfe-hyperdx and its store, proxy and dashboards

include:
  - path: compose/one-shots.yml
    project_directory: .

services:

  # ============================================================
  # ClickHouse
  # ============================================================

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin CLICKHOUSE_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-clickhouse
    hostname: clickhouse
    profiles: ["clickhouse"]
    restart: unless-stopped
    extends: {file: compose/limits.yml, service: limits-clickhouse}
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123
      - ${DFE_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      DFE_KEEPER_IDENTITY: dfe:${CLICKHOUSE_KEEPER_PASSWORD:?run 'make init' to mint CLICKHOUSE_KEEPER_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/server-custom.xml:/etc/clickhouse-server/config.d/dfe-custom.xml:ro
      - ./config/clickhouse/replication.xml:/etc/clickhouse-server/config.d/dfe-replication.xml:ro
      - ./config/clickhouse/listen.xml:/etc/clickhouse-server/config.d/docker_related_config.xml:ro
      - ./config/clickhouse/server-logger.xml:/etc/clickhouse-server/config.d/dfe-logger.xml:ro
      - ./config/clickhouse/system-logs.xml:/etc/clickhouse-server/config.d/dfe-system-logs.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1 FROM system.databases WHERE name = '\"$$CLICKHOUSE_DB\"'\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # Kafka
  # ============================================================

  kafka-apache:
    image: apache/kafka:${APACHE_KAFKA_VERSION:?run 'make stack VERSION=X.Y.Z' to pin APACHE_KAFKA_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-kafka-apache
    profiles: ["kafka-apache"]
    extends: {file: compose/kafka.yml, service: kafka}
    environment:
      CLUSTER_ID: dfe-docker-dev-cluster-01
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29092
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    volumes:
      - kafka-apache-data:/var/lib/kafka/data
      - kafka-apache-secrets:/etc/kafka/secrets
      - kafka-apache-config:/mnt/shared/config
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:?run 'make stack VERSION=X.Y.Z' to pin REDPANDA_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-kafka-redpanda
    profiles: ["kafka-redpanda"]
    extends: {file: compose/kafka.yml, service: kafka}
    entrypoint: ["/bin/bash", "/usr/local/bin/dfe-redpanda-start.sh"]
    environment:
      REDPANDA_MEMORY: ${REDPANDA_MEMORY:-1G}
    command:
      - redpanda
      - start
      - --mode=${REDPANDA_MODE:-dev-container}
      - --smp=${REDPANDA_SMP:-1}
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}
    volumes:
      - kafka-redpanda-data:/var/lib/redpanda/data
      - ./redpanda/start.sh:/usr/local/bin/dfe-redpanda-start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================
  # Kafka UI
  # ============================================================

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFBAT_VERSION:?run 'make stack VERSION=X.Y.Z' to pin KAFBAT_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-kafka-ui
    profiles: ["kafka-ui"]
    restart: unless-stopped
    extends: {file: compose/limits.yml, service: limits-service}
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${KAFBAT_PORT:-8081}:8080
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CLUSTERS_0_NAME: dfe-local

  # ============================================================
  # dfe-archiver
  # ============================================================

  dfe-archiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ARCHIVER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-archiver
    extends: {file: compose/dfe-app.yml, service: dfe-app}
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_ARCHIVER_PROMETHEUS_PORT:-9093}:9090
    env_file:
      - path: env/archiver.env
        required: false
      - path: env/dfe-archiver.custom.env
        required: false
    environment:
      DFE_ARCHIVER_KAFKA_BROKERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_ARCHIVER_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_ARCHIVER_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
      OTEL_SERVICE_NAME: dfe-archiver
    depends_on:
      config-check-dfe-archiver:
        condition: service_completed_successfully
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    command: ["--config", "${DFE_ARCHIVER_CONFIG_FILE:-/etc/dfe/archiver.yaml}"]
    volumes:
      - ./config/${DFE_ARCHIVER_CONFIG:-archiver/kafka.yaml}:/etc/dfe/archiver.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - archiver-data:/var/data/archive
      - dlq-spool:/var/spool/dfe

  # ============================================================
  # dfe-fetcher: only its per-source instances run
  # ============================================================

  dfe-fetcher:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-fetcher:${DFE_FETCHER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_FETCHER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-fetcher
    extends: {file: compose/dfe-app.yml, service: dfe-app}
    env_file:
      - path: env/fetcher.env
        required: false
      - path: env/dfe-fetcher.custom.env
        required: false
    environment:
      DFE_FETCHER_CURSOR__DIRECTORY: /var/lib/dfe-fetcher/dfe-fetcher
      DFE_FETCHER_KAFKA_BROKERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_FETCHER_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_FETCHER_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
      OTEL_SERVICE_NAME: dfe-fetcher
    depends_on:
      dfe-engine:
        condition: service_healthy
        required: false
      dfe-loader:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - dfe-app-config:/etc/dfe/apps:ro
      - dlq-spool:/var/spool/dfe
      - fetcher-cursors:/var/lib/dfe-fetcher

  # ============================================================
  # dfe-loader
  # ============================================================

  dfe-loader:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-loader:${DFE_LOADER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_LOADER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-loader
    extends: {file: compose/dfe-app.yml, service: dfe-app}
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_LOADER_PROMETHEUS_PORT:-9091}:9090
    env_file:
      - path: env/loader.env
        required: false
      - path: env/dfe-loader.custom.env
        required: false
    environment:
      DFE_LOADER_CLICKHOUSE_HOSTS: ${CLICKHOUSE_HOST:-clickhouse}:${CLICKHOUSE_EXTERNAL_HTTP_PORT:-8123}
      DFE_LOADER_CLICKHOUSE_PASSWORD: ${DFE_LOADER_CLICKHOUSE_PASSWORD:-}
      DFE_LOADER_CLICKHOUSE_USERNAME: dfe_loader
      DFE_LOADER_KAFKA_BROKERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_LOADER_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_LOADER_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
      OTEL_SERVICE_NAME: dfe-loader
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      config-check-dfe-loader:
        condition: service_completed_successfully
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    command: ["--config", "${DFE_LOADER_CONFIG_FILE:-/etc/dfe/loader.yaml}"]
    volumes:
      - ./config/${DFE_LOADER_CONFIG:-loader/kafka.yaml}:/etc/dfe/loader.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9090 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && read -r _ code _ <&3 && [ \"$$code\" = 200 ]"]

  # ============================================================
  # dfe-receiver
  # ============================================================

  dfe-receiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-receiver:${DFE_RECEIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_RECEIVER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-receiver
    extends: {file: compose/dfe-app.yml, service: dfe-app}
    ports:
      - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_HTTP_PORT:-8080}:8080
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_RECEIVER_PROMETHEUS_PORT:-9090}:9090
    env_file:
      - path: env/receiver.env
        required: false
      - path: env/dfe-receiver.custom.env
        required: false
    environment:
      DFE_RECEIVER_DLQ_MODE: ${DFE_RECEIVER_DLQ_MODE:-}
      DFE_RECEIVER_KAFKA_BROKERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_RECEIVER_MAX_BODY_SIZE: ${DFE_RECEIVER_MAX_BODY_SIZE:-8000000}
      DFE_RECEIVER_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_RECEIVER_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
      OTEL_SERVICE_NAME: dfe-receiver
    depends_on:
      bearer-tokens-init:
        condition: service_completed_successfully
      config-check-dfe-receiver:
        condition: service_completed_successfully
      dfe-engine:
        condition: service_healthy
        required: false
      dfe-loader:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    command: ["--config", "${DFE_RECEIVER_CONFIG_FILE:-/etc/dfe/receiver.yaml}"]
    volumes:
      - ./config/${DFE_RECEIVER_CONFIG:-receiver/kafka.yaml}:/etc/dfe/receiver.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - dlq-spool:/var/spool/dfe
      - type: volume
        source: dfe-engine-config
        target: /var/run/secrets/dfe/ingest-bearer-tokens
        read_only: true
        volume:
          subpath: .secrets/ingest/bearer-tokens

  # ============================================================
  # dfe-transform-elastic: one instance per source extends it
  # ============================================================

  dfe-transform-elastic:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-elastic:${DFE_TRANSFORM_ELASTIC_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_ELASTIC_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-transform-elastic
    extends: {file: compose/dfe-app.yml, service: dfe-app}
    env_file:
      - path: env/transform-elastic.env
        required: false
      - path: env/dfe-transform-elastic.custom.env
        required: false
    environment:
      DFE_TRANSFORM_ELASTIC_SOURCE_BROKERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_TRANSFORM_ELASTIC_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_TRANSFORM_ELASTIC_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
      OTEL_SERVICE_NAME: dfe-transform-elastic
    depends_on:
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - dfe-app-config:/etc/dfe/apps:ro
      - transform-elastic-geoip:/var/lib/dfe/geoip

  # ============================================================
  # dfe-transform-vector: one instance per source extends it
  # ============================================================

  dfe-transform-vector:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VECTOR_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-transform-vector
    extends: {file: compose/dfe-app.yml, service: dfe-app}
    stop_grace_period: 90s
    env_file:
      - path: env/transform-vector.env
        required: false
      - path: env/dfe-transform-vector.custom.env
        required: false
    environment:
      DFE_TRANSFORM_VECTOR_SINK_BROKERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_TRANSFORM_VECTOR_SOURCE_BROKERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_TRANSFORM_VECTOR_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_TRANSFORM_VECTOR_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
      OTEL_SERVICE_NAME: dfe-transform-vector
    depends_on:
      dfe-engine:
        condition: service_healthy
        required: false
    volumes:
      - ./resources/enrichment:/etc/dfe-transform-vector/data:ro
      - dfe-app-config:/etc/dfe/apps:ro

  # ============================================================
  # dfe-transform-vrl: one instance per source extends it
  # ============================================================

  dfe-transform-vrl:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VRL_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-transform-vrl
    extends: {file: compose/dfe-app.yml, service: dfe-app}
    env_file:
      - path: env/transform-vrl.env
        required: false
      - path: env/dfe-transform-vrl.custom.env
        required: false
    environment:
      DFE_TRANSFORM_VRL_SINK_BROKERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_TRANSFORM_VRL_SOURCE_BROKERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_TRANSFORM_VRL_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_TRANSFORM_VRL_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
      OTEL_SERVICE_NAME: dfe-transform-vrl
    depends_on:
      dfe-engine:
        condition: service_healthy
        required: false
    volumes:
      - dfe-app-config:/etc/dfe/apps:ro

  # ============================================================
  # dfe-engine
  # ============================================================

  dfe-engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-engine
    profiles: ["core"]
    restart: unless-stopped
    extends: {file: compose/limits.yml, service: limits-service}
    group_add:
      - "${DFE_DEV_GID:-1000}"
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_ENGINE_PORT:-8003}:8000
    env_file:
      - path: env/engine.env
        required: false
    environment:
      DFE_ENGINE_ADMIN_LINKS: ${DFE_ADMIN_LINKS_RESOLVED:-}
      DFE_ENGINE_API_JWT_SECRET: ${DFE_ENGINE_API_JWT_SECRET:-}
      DFE_ENGINE_APP_CONTRACT_DIR: ${DFE_ENGINE_CONTRACT_DIR-/app/content/contract}
      DFE_ENGINE_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-default}
      DFE_ENGINE_CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      DFE_ENGINE_CLICKHOUSE_HUNT_RUNNER_PASSWORD: ${DFE_HUNT_RUNNER_CLICKHOUSE_PASSWORD:-}
      DFE_ENGINE_CLICKHOUSE_LOADER_PASSWORD: ${DFE_LOADER_CLICKHOUSE_PASSWORD:-}
      DFE_ENGINE_CLICKHOUSE_OTEL_WRITER_PASSWORD: ${DFE_OTEL_WRITER_CLICKHOUSE_PASSWORD:-}
      DFE_ENGINE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      DFE_ENGINE_CLICKHOUSE_PORT: ${CLICKHOUSE_EXTERNAL_HTTP_PORT:-8123}
      DFE_ENGINE_CLICKHOUSE_QUERY_READER_PASSWORD: ${DFE_QUERY_READER_CLICKHOUSE_PASSWORD:-}
      DFE_ENGINE_CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      DFE_ENGINE_CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      DFE_ENGINE_DEPLOYMENT_APP_CONFIG_BASE_DIR: ${DFE_ENGINE_APP_CONFIG_BASE_DIR:-}
      DFE_ENGINE_DEPLOYMENT_APP_CONFIG_DIR: ${DFE_ENGINE_APP_CONFIG_DIR:-}
      DFE_ENGINE_DEPLOYMENT_APP_CONFIG_MOUNT: ${DFE_APP_CONFIG_MOUNT:-/etc/dfe/apps}
      DFE_ENGINE_DEPLOYMENT_APP_ENV_DIR: /app/app-env
      DFE_ENGINE_DEPLOYMENT_TARGET: docker
      DFE_ENGINE_ENV: ${DFE_ENGINE_ENV:-production}
      DFE_ENGINE_GITOPS_ENABLED: ${DFE_ENGINE_GITOPS_ENABLED:-true}
      DFE_ENGINE_GITOPS_LOCAL_PATH: /app/config/deploy-repo
      DFE_ENGINE_GITOPS_MODE: ${DFE_ENGINE_GITOPS_MODE:-solo}
      DFE_ENGINE_HUNTS_DIR: /app/config/deploy-repo/config/hunts
      DFE_ENGINE_HUNTS_RULES_DIR: /app/config/deploy-repo/config/rules
      DFE_ENGINE_HYPERDX_BASE_URL: ${DFE_HYPERDX_RESOLVED_BASE_URL:-}
      DFE_ENGINE_HYPERDX_ENABLED: ${DFE_HYPERDX_RESOLVED:-false}
      DFE_ENGINE_KAFKA_BOOTSTRAP_SERVERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      DFE_ENGINE_PROFILE: ${DFE_STACK_PROFILE:-docker-slim}
      DFE_ENGINE_SECRETS_PATH: /app/config/.secrets
      DFE_ENGINE_STACK_VERSION: ${DFE_STACK_VERSION:-}
      DFE_ENGINE_TRANSPORT_BUS_PRESENT: ${DFE_TRANSPORT_BUS_PRESENT:-false}
      DFE_ENGINE_TRANSPORT_DEFAULT: ${DFE_TRANSPORT_DEFAULT:-direct}
      DFE_ENGINE_UI_VERSION: ${DFE_UI_VERSION_TAG:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-engine
      VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
    volumes:
      - dfe-engine-config:/app/config
      - dfe-engine-schemas:/app/schemas
      - dfe-engine-content:/app/content
      - dfe-app-config:/app/app-config
      - ./env:/app/app-env
      - ./config/${DFE_ARCHIVER_CONFIG:-archiver/kafka.yaml}:/app/app-config-base/dfe-archiver.yaml:ro
      - ./config/${DFE_LOADER_CONFIG:-loader/kafka.yaml}:/app/app-config-base/dfe-loader.yaml:ro
      - ./config/${DFE_RECEIVER_CONFIG:-receiver/kafka.yaml}:/app/app-config-base/dfe-receiver.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      contract-dfe-archiver:
        condition: service_completed_successfully
        required: false
      contract-dfe-fetcher:
        condition: service_completed_successfully
        required: false
      contract-dfe-loader:
        condition: service_completed_successfully
        required: false
      contract-dfe-receiver:
        condition: service_completed_successfully
        required: false
      contract-dfe-transform-elastic:
        condition: service_completed_successfully
        required: false
      contract-dfe-transform-vector:
        condition: service_completed_successfully
        required: false
      contract-dfe-transform-vrl:
        condition: service_completed_successfully
        required: false
      kafka-apache:
        condition: service_healthy
        required: false
      kafka-redpanda:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 540s
      retries: 5

  # ============================================================
  # dfe-hunt-runner
  # ============================================================

  dfe-hunt-runner:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-hunt-runner
    profiles: ["core"]
    restart: unless-stopped
    extends: {file: compose/limits.yml, service: limits-service}
    entrypoint: ["dfe-hunt-runner"]
    command: ["run", "--reload-every", "1"]
    environment:
      DFE_ENGINE_API_JWT_SECRET: ${DFE_ENGINE_API_JWT_SECRET:-}
      DFE_ENGINE_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-default}
      DFE_ENGINE_CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      DFE_ENGINE_CLICKHOUSE_PASSWORD: ${DFE_HUNT_RUNNER_CLICKHOUSE_PASSWORD:-}
      DFE_ENGINE_CLICKHOUSE_PORT: ${CLICKHOUSE_EXTERNAL_HTTP_PORT:-8123}
      DFE_ENGINE_CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      DFE_ENGINE_CLICKHOUSE_USERNAME: dfe_hunt_runner
      DFE_ENGINE_ENV: ${DFE_ENGINE_ENV:-production}
      DFE_ENGINE_HUNTS_DIR: /app/config/deploy-repo/config/hunts
      DFE_ENGINE_HUNTS_RULES_DIR: /app/config/deploy-repo/config/rules
      DFE_ENGINE_SECRETS_PATH: /app/config/.secrets
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-hunt-runner
    volumes:
      # Only the alert destinations from the engine's file secrets backend, never the whole root.
      - type: volume
        source: dfe-engine-config
        target: /app/config/.secrets/alert-destinations
        read_only: true
        volume:
          subpath: .secrets/alert-destinations
      - type: volume
        source: dfe-engine-config
        target: /app/config/deploy-repo/config
        read_only: true
        volume:
          subpath: deploy-repo/config
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      dfe-engine:
        condition: service_healthy
    healthcheck:
      disable: true

  # ============================================================
  # dfe-ui
  # ============================================================

  dfe-ui:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-ui:${DFE_UI_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_UI_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-ui
    profiles: ["core"]
    restart: unless-stopped
    extends: {file: compose/limits.yml, service: limits-service}
    env_file:
      - path: env/ui.env
        required: false
    environment:
      HYPERDX_PORT: ${DFE_HYPERDX_EMBED_PORT:-8091}
      INTERNAL_API_URL: http://dfe-engine:8000
      NEXTAUTH_URL: ${DFE_EXTERNAL_ORIGIN:-http://localhost}:${DFE_UI_PORT:-3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_HTTP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/livez').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # ============================================================
  # dfe-proxy
  # ============================================================

  dfe-proxy:
    image: envoyproxy/envoy:${DFE_PROXY_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_PROXY_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-proxy
    profiles: ["core"]
    extends: {file: compose/envoy.yml, service: envoy}
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_UI_PORT:-3000}:8080
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_EMBED_PORT:-8091}:8091
    environment:
      DFE_HYPERDX_EMBED_ANCESTOR: http://localhost:${DFE_UI_PORT:-3000} http://127.0.0.1:${DFE_UI_PORT:-3000} ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_UI_PORT:-3000}
    volumes:
      - ./config/proxy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      dfe-engine:
        condition: service_healthy
        required: false
      dfe-ui:
        condition: service_healthy
        required: false

  # ============================================================
  # otel-collector
  # ============================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${DFE_OTEL_COLLECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_OTEL_COLLECTOR_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-otel-collector
    profiles: ["otel"]
    restart: unless-stopped
    extends: {file: compose/limits.yml, service: limits-sidecar}
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_OTEL_HEALTH_PORT:-13133}:13133
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_OTEL_FLUENT_PORT:-24224}:24224
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PASSWORD: ${DFE_OTEL_WRITER_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_PORT: ${CLICKHOUSE_EXTERNAL_NATIVE_PORT:-9000}
      CLICKHOUSE_USERNAME: dfe_otel_writer
      DFE_OTEL_COLLECTOR_LOG_LEVEL: ${DFE_OTEL_COLLECTOR_LOG_LEVEL:-warn}
      DFE_OTEL_DATABASE: ${DFE_OTEL_DATABASE:-dfe}
      DFE_USAGE_CPU_LIMITS: ${DFE_USAGE_CPU_LIMITS:-}
      DFE_USAGE_NODE_NAME: ${DFE_USAGE_NODE_NAME:-docker-host}
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - /proc:/hostfs/proc:ro
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      dfe-engine:
        condition: service_healthy
        required: false

  # ============================================================
  # HyperDX
  # ============================================================

  hyperdx-documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:${HYPERDX_DOCUMENTDB_VERSION:-pg18-1.0.0@sha256:03aef53ed72cd3007236f8ce1b4ef7a0c958dbbce1519074b85d8a3e10be89a5}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-hyperdx-documentdb
    profiles: ["hyperdx"]
    restart: unless-stopped
    extends: {file: compose/limits.yml, service: limits-service}
    environment:
      CERT_PATH: /etc/documentdb/tls/tls.crt
      DOCUMENTDB_USAGE_TELEMETRY: "false"
      KEY_FILE: /etc/documentdb/tls/tls.key
      PASSWORD: ${HYPERDX_DOCUMENTDB_PASSWORD:-hyperdx}
      TLS_MODE: requireTLS
      USERNAME: ${HYPERDX_DOCUMENTDB_USER:-hyperdx}
    volumes:
      - hyperdx-documentdb-data:/data
      - type: volume
        source: hyperdx-documentdb-tls
        target: /etc/documentdb/tls
        read_only: true
        volume:
          subpath: server
    depends_on:
      hyperdx-documentdb-tls:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/documentdb-healthcheck"]
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 10

  dfe-hyperdx:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-hyperdx:${DFE_HYPERDX_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_HYPERDX_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-hyperdx
    profiles: ["hyperdx"]
    restart: unless-stopped
    extends: {file: compose/limits.yml, service: limits-hyperdx}
    env_file:
      - path: env/hyperdx.env
        required: false
    environment:
      DASHBOARD_PROVISIONER_ALL_TEAMS: "true"
      DASHBOARD_PROVISIONER_DIR: /etc/hyperdx/dashboards
      DASHBOARD_PROVISIONER_REQUIRE_REFS: "true"
      DFE_AUTH_DEFAULT_TEAM: ${DFE_HYPERDX_TEAM:-dfe}
      DFE_AUTH_MODE: oidc-proxy
      DFE_ENGINE_JWKS_URL: http://dfe-engine:8000/.well-known/jwks.json
      FRONTEND_URL: ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_HYPERDX_APP_PORT:-8090}
      HYPERDX_API_PORT: 8000
      HYPERDX_APP_PORT: 8090
      HYPERDX_APP_URL: ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}
      MONGO_URI: mongodb://${HYPERDX_DOCUMENTDB_USER:-hyperdx}:${HYPERDX_DOCUMENTDB_PASSWORD:-hyperdx}@hyperdx-documentdb:10260/hyperdx?tls=true&tlsCAFile=/etc/dfe/documentdb-ca/ca.crt&authMechanism=SCRAM-SHA-256
      NEXT_PUBLIC_DFE_UI_BASE_URL: ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_UI_PORT:-3000}
      USAGE_STATS_ENABLED: ${USAGE_STATS_ENABLED:-false}
    volumes:
      - hyperdx-dashboards:/etc/hyperdx/dashboards:ro
      - type: volume
        source: hyperdx-documentdb-tls
        target: /etc/dfe/documentdb-ca
        read_only: true
        volume:
          subpath: ca
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      dfe-dashboards:
        condition: service_completed_successfully
        required: false
      hyperdx-documentdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  dfe-hyperdx-proxy:
    image: envoyproxy/envoy:${DFE_PROXY_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_PROXY_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-hyperdx-proxy
    profiles: ["hyperdx"]
    extends: {file: compose/envoy.yml, service: envoy}
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_APP_PORT:-8090}:8090
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_API_PORT:-8000}:8000
    volumes:
      - ./config/proxy/hyperdx.yaml:/etc/envoy/envoy.yaml:ro

  # ============================================================
  # oauth2-proxy
  # ============================================================

  oauth2-proxy-kafbat:
    image: quay.io/oauth2-proxy/oauth2-proxy:${DFE_OAUTH2_PROXY_VERSION:-v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-oauth2-proxy-kafbat
    extends: {file: compose/oauth2-proxy.yml, service: oauth2-proxy}
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${KAFBAT_PORT:-8081}:4180
    environment:
      OAUTH2_PROXY_REDIRECT_URL: ${DFE_OAUTH2_PROXY_EXTERNAL_ORIGIN:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${KAFBAT_PORT:-8081}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://kafka-ui:8080
    depends_on:
      kafka-ui:
        condition: service_started
        required: false

  oauth2-proxy-hyperdx:
    image: quay.io/oauth2-proxy/oauth2-proxy:${DFE_OAUTH2_PROXY_VERSION:-v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-oauth2-proxy-hyperdx
    extends: {file: compose/oauth2-proxy.yml, service: oauth2-proxy}
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_APP_PORT:-8090}:4180
    environment:
      OAUTH2_PROXY_REDIRECT_URL: ${DFE_OAUTH2_PROXY_EXTERNAL_ORIGIN:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_HYPERDX_APP_PORT:-8090}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://dfe-hyperdx:8090
    depends_on:
      dfe-hyperdx:
        condition: service_healthy
        required: false

  oauth2-proxy-hyperdx-api:
    image: quay.io/oauth2-proxy/oauth2-proxy:${DFE_OAUTH2_PROXY_VERSION:-v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-oauth2-proxy-hyperdx-api
    extends: {file: compose/oauth2-proxy.yml, service: oauth2-proxy}
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_API_PORT:-8000}:4180
    environment:
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"
      OAUTH2_PROXY_REDIRECT_URL: ${DFE_OAUTH2_PROXY_EXTERNAL_ORIGIN:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_HYPERDX_API_PORT:-8000}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://dfe-hyperdx:8000
    depends_on:
      dfe-hyperdx:
        condition: service_healthy
        required: false

volumes:
  archiver-data:
  clickhouse-data:
  dfe-app-config:
  dfe-engine-config:
  dfe-engine-content:
  dfe-engine-schemas:
  dlq-spool:
  fetcher-cursors:
  hyperdx-dashboards:
  hyperdx-documentdb-data:
  hyperdx-documentdb-tls:
  kafka-apache-config:
  kafka-apache-data:
  kafka-apache-secrets:
  kafka-redpanda-data:
  transform-elastic-geoip:
