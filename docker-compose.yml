        else
          echo "contract: dfe-transform-vrl emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  # ===========================================================================
  # dfe-archiver
  # Reads the landing topics off the broker (config/archiver/kafka.yaml). No gRPC profile runs it.
  # ===========================================================================

  dfe-archiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ARCHIVER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-archiver
    profiles: ["dfe"]
    restart: unless-stopped
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_ARCHIVER_PROMETHEUS_PORT:-9093}:9090
    env_file:
      - path: env/archiver.env
        required: false
      # The custom keys the engine writes for this app, AFTER the file above so
      # a custom key wins. Compose reads env_file at up-time, so a write needs
      # `docker compose up -d dfe-archiver` and a restart keeps the old values.
      - path: env/dfe-archiver.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Empty exports nothing -- scalo's own rule, and the stack default.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-archiver
      # The archiver's cascade prefix is ARCHIVER, not DFE_ARCHIVER.
      ARCHIVER_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      ARCHIVER_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
      KAFKA_BROKERS: *kafka-brokers
    depends_on:
      # The writer of the rendered config below, so it must have written before
      # this container reads. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    working_dir: /home/appuser
    # The engine renders this app's config from the sources on the tiers that run
    # it; everywhere else the committed file below is what it reads.
    command: ["--config", "${DFE_ARCHIVER_CONFIG_FILE:-/etc/dfe/archiver.yaml}"]
    volumes:
      - ./config/${DFE_ARCHIVER_CONFIG:-archiver/kafka.yaml}:/etc/dfe/archiver.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - archiver-data:/var/data/archive
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-fetcher
  # No profile starts this service: each per-source instance scripts/instances.py generates extends it and names its own rendered config.
  # ===========================================================================

  dfe-fetcher:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-fetcher:${DFE_FETCHER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_FETCHER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-fetcher
    profiles: ["dfe"]
    restart: unless-stopped
    deploy: *limits-service
    ports:
      - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_FETCHER_INGEST_PORT:-8082}:8080
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_FETCHER_PROMETHEUS_PORT:-9094}:9090
    env_file:
      - path: env/fetcher.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-fetcher.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-fetcher
      DFE_FETCHER_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_FETCHER_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
      # One directory per fetcher service; scripts/instances.py sets each instance's.
      DFE_FETCHER_CURSOR__DIRECTORY: /var/lib/dfe-fetcher/dfe-fetcher
      # The broker the fetcher produces to, because the config the engine renders names none
      DFE_FETCHER_KAFKA_BROKERS: *kafka-brokers
    depends_on:
      dfe-loader:
        condition: service_healthy
        required: false
      # The writer of the rendered config, so it must have written before this container reads. `required: false` for the tiers that run no engine
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - dfe-app-config:/etc/dfe/apps:ro
      - dlq-spool:/var/spool/dfe
      - fetcher-cursors:/var/lib/dfe-fetcher
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-loader
  # Defined before dfe-receiver so receiver can depend_on loader (gRPC path).
  # ===========================================================================

  dfe-loader:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-loader:${DFE_LOADER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_LOADER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-loader
    profiles: ["dfe"]
    restart: unless-stopped
    deploy: *limits-service
    ports:
      # 6000 is the INTERNAL DfeTransport/Push surface (receiver -> loader), not
      # a client-facing one -- operators only, so it binds DFE_BIND_HOST.
      # It publishes on 50051, leaving host port 6000 to the receiver's opt-in Vector protocol.
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_LOADER_PROMETHEUS_PORT:-9091}:9090
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_LOADER_GRPC_PORT:-50051}:6000
    env_file:
      - path: env/loader.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-loader.custom.env
        required: false
    environment:
      # The ClickHouse dfe-engine dials, container port included (#75)
      DFE_LOADER_CLICKHOUSE_HOSTS: ${CLICKHOUSE_HOST:-clickhouse}:${CLICKHOUSE_EXTERNAL_HTTP_PORT:-8123}
      # Its own user, not the admin account: dfe_loader inserts into the data
      # database and reads its schema, nothing else. The engine names the user.
      DFE_LOADER_CLICKHOUSE_PASSWORD: ${DFE_LOADER_CLICKHOUSE_PASSWORD:-}
      DFE_LOADER_CLICKHOUSE_USERNAME: dfe_loader
      DFE_LOADER_KAFKA_BROKERS: *kafka-brokers
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-loader
      DFE_LOADER_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_LOADER_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      # The schema authority: dfe-engine applies every table and every bootstrap
      # topic at its own startup and reports healthy only once that pass
      # converged. A loader started first holds every message pending-schema and
      # dead-letters it, which reads as data loss and is really start ordering.
      # docs/troubleshooting.md#events-are-accepted-but-nothing-lands
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    # The engine renders this app's config from the sources on the tiers that run
    # it; everywhere else the committed file below is what it reads.
    command: ["--config", "${DFE_LOADER_CONFIG_FILE:-/etc/dfe/loader.yaml}"]
    volumes:
      - ./config/${DFE_LOADER_CONFIG:-loader/kafka.yaml}:/etc/dfe/loader.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-receiver
  # ===========================================================================

  dfe-receiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-receiver:${DFE_RECEIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_RECEIVER_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-receiver
    profiles: ["dfe"]
    restart: unless-stopped
    deploy: *limits-service
    ports:
      # 8080 (HTTP) is the ingest port external clients push to, so it binds DFE_INGRESS_BIND_HOST. 9090 is for operators.
      - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_HTTP_PORT:-8080}:8080
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_RECEIVER_PROMETHEUS_PORT:-9090}:9090
      # Uncomment to expose additional ingest protocols. The Vector protocol on 6000 also listens only with DFE_RECEIVER_GRPC__ENABLED=true:
      # - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_GRPC_PORT:-6000}:6000
      # - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_BEATS_PORT:-5044}:5044
      # - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_HEC_PORT:-8088}:8088
      # - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_OTLP_GRPC_PORT:-4317}:4317
      # - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_OTLP_HTTP_PORT:-4318}:4318
    env_file:
      - path: env/receiver.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-receiver.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-receiver
      # The DFE-wide record cap, under every broker's 8 MiB message limit.
      DFE_RECEIVER_MAX_BODY_SIZE: ${DFE_RECEIVER_MAX_BODY_SIZE:-8000000}
      DFE_RECEIVER_KAFKA_BROKERS: *kafka-brokers
      DFE_RECEIVER_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_RECEIVER_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
    depends_on:
      dfe-loader:
        condition: service_healthy
        required: false
      # The writer of the rendered config below, so it must have written before
      # this container reads. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
      # The bearer-token mount below cannot start without its directory.
      bearer-tokens-init:
        condition: service_completed_successfully
    # The engine renders this app's config from the sources on the tiers that run
    # it; everywhere else the committed file below is what it reads.
    command: ["--config", "${DFE_RECEIVER_CONFIG_FILE:-/etc/dfe-receiver/config.yaml}"]
    volumes:
      - ./config/${DFE_RECEIVER_CONFIG:-receiver/kafka.yaml}:/etc/dfe-receiver/config.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - dlq-spool:/var/spool/dfe
      # The one directory of the engine's secrets the receiver reads: the bearer
      # tokens the engine writes per listener, which each listener's file:
      # secret_source names. A directory, so a rewrite reaches the running receiver.
      - type: volume
        source: dfe-engine-config
        target: /var/run/secrets/dfe/ingest-bearer-tokens
        read_only: true
        volume:
          subpath: .secrets/ingest/bearer-tokens
      # Uncomment to enable TLS on gRPC inbound (:6000):
      # - ./certs/dev/receiver.crt:/etc/ssl/receiver.crt:ro
      # - ./certs/dev/receiver.key:/etc/ssl/receiver.key:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-elastic
  # Beats and Elastic Agent JSON in, DFE-normalised events out. It selects ONE
  # compiled-in transform by `source.name`, or in agentless mode detects one per
  # event, and reads no authored program files, so it has nothing to mount beside
  # its config -- no transforms directory and no enrichment tables.
  #
  # dfe-engine starts one instance per source, each extending this service.
  # ===========================================================================

  dfe-transform-elastic:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-elastic:${DFE_TRANSFORM_ELASTIC_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_ELASTIC_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-transform-elastic
    profiles: ["dfe"]
    restart: unless-stopped
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_ELASTIC_PROMETHEUS_PORT:-9099}:9090
    env_file:
      - path: env/transform-elastic.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-transform-elastic.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-transform-elastic
      DFE_TRANSFORM_ELASTIC_SOURCE_BROKERS: *kafka-brokers
      DFE_TRANSFORM_ELASTIC_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_TRANSFORM_ELASTIC_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
    depends_on:
      # No dlq-init here: this service does not mount dlq-spool.
      # The writer of the rendered config, so it must have written before this
      # container reads. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
    volumes:
      - dfe-app-config:/etc/dfe/apps:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vector
  #
  # One metrics port: 9090 carries the scalo surface AND the `vector_*` series,
  # which the wrapper scrapes off the `prometheus_exporter` sink and merges into
  # the scalo registry (dfe-transform-vector#70). The sink still listens on 9598,
  # loopback-only inside the container, and is published nowhere.
  #
  # dfe-engine starts one instance per source, each extending this service.
  # ===========================================================================

  dfe-transform-vector:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VECTOR_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-transform-vector
    profiles: ["dfe"]
    restart: unless-stopped
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_VECTOR_PROMETHEUS_PORT:-9095}:9090
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_VECTOR_API_PORT:-8686}:8686
    env_file:
      - path: env/transform-vector.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-transform-vector.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-transform-vector
      DFE_TRANSFORM_SINK_BROKERS: *kafka-brokers
      DFE_TRANSFORM_SOURCE_BROKERS: *kafka-brokers
      # Vector and vrl share the prefix DFE_TRANSFORM, and elastic has its own.
      DFE_TRANSFORM_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_TRANSFORM_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
    depends_on:
      # No dlq-init here: this service does not mount dlq-spool.
      # The writer of the rendered config and the topic authority: dfe-engine creates the declared topic set at its own startup, so a transform started first subscribes to nothing. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
    volumes:
      # The bundled pipeline names its enrichment table by an absolute path (dfe-transform-vector pipelines/filebeat/README.md), so the table has to be mounted there. A pipeline that cannot open it fails `vector validate` with exit 78 and an empty stderr
      - ./resources/enrichment:/etc/dfe-transform-vector/data:ro
      - dfe-app-config:/etc/dfe/apps:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vrl
  # dfe-engine starts one instance per source, each extending this service. It uploads the enrichment tables its programs read.
  # ===========================================================================

  dfe-transform-vrl:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VRL_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-transform-vrl
    profiles: ["dfe"]
    restart: unless-stopped
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_VRL_PROMETHEUS_PORT:-9096}:9090
    env_file:
      - path: env/transform-vrl.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-transform-vrl.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-transform-vrl
      DFE_TRANSFORM_SINK_BROKERS: *kafka-brokers
      DFE_TRANSFORM_SOURCE_BROKERS: *kafka-brokers
      DFE_TRANSFORM_VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      DFE_TRANSFORM_VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
    depends_on:
      # No dlq-init here: this service does not mount dlq-spool.
      # The writer of the rendered config, so it must have written before this container reads. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
    volumes:
      - dfe-app-config:/etc/dfe/apps:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-engine
  # dfe-schemas rides INSIDE this image: /app/schemas is baked into dfe-engine
  # (pinned by DFE_ENGINE_VERSION) and seeds the dfe-engine-schemas named volume
  # on first run; the engine auto-creates the CH objects at startup. So a pinned
  # stack needs no separate dfe-schemas docker pin -- DFE_ENGINE_VERSION covers it.
  # ===========================================================================

  dfe-engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-engine
    profiles: ["core"]
    restart: unless-stopped
    deploy: *limits-service
    # The engine runs as UID 1000 and ./env belongs to the operator, so it writes
    # there through the operator's group; `make` exports DFE_DEV_GID.
    group_add:
      - "${DFE_DEV_GID:-1000}"
    ports:
      # dfe-proxy reaches the engine over the docker network; this host mapping
      # is for direct API work. PRODUCT class -- it is the API the UI consumes --
      # so it binds DFE_UI_BIND_HOST and only DFE_ENGINE_API_EXTERNAL=false takes
      # it dark, never the infra kill switch.
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_ENGINE_PORT:-8003}:8000
    env_file:
      - path: env/engine.env
        required: false
    environment:
      # The engine refuses to start at `production` without real auth, which is
      # what an unset DFE_ENV should get: `make init` mints a password, so the
      # refusal only ever catches a stack that has no credential to speak of.
      # `make dev` writes DFE_ENV=dev for a tyre-kick that logs in on the shipped
      # default until the stack replaces it.
      # docs/operating.md#only-the-console-authenticates----everything-else-is-bounded-by-that
      DFE_ENV: ${DFE_ENV:-production}
      # The dfe-ui Playwright suite's /api/e2e routes, mounted only when this is true. `make e2e-posture` sets it.
      DFE_E2E_SERVER: ${DFE_E2E_SERVER:-false}
      # A Compose stack is one operator with no forge: a hunt or rule written at
      # production+team lands on a review branch nothing can merge, and the
      # engine then 404s on the object it just accepted. solo commits to main.
      DFE_GITOPS_MODE: ${DFE_GITOPS_MODE:-solo}
      # Names the fetch command the engine puts on the login page: `make creds`.
      DFE_DEPLOYMENT_TARGET: docker
      # The tier this stack runs, by the manifest's name: the engine seeds the
      # profile's default app instances from it and reports it as its profile.
      DFE_PROFILE: ${DFE_STACK_PROFILE:-docker-slim}
      # The certified stack `make stack` pinned this deployment from. Compose has
      # no deploy repo for the engine to read pins out of, so this is the only
      # thing /system/deployment can tell the console footer.
      DFE_STACK_VERSION: ${DFE_STACK_VERSION:-}
      # The console version /system/version reports. resolve_profile strips the
      # digest off the ui pin, because a container reference is not a version.
      DFE_UI_VERSION: ${DFE_UI_VERSION_TAG:-}
      # The transport the tier's stages are bound to, which resolve_profile exports
      # from the profile. The defaults are slim-grpc's.
      DFE_TRANSPORT_DEFAULT: ${DFE_TRANSPORT_DEFAULT:-direct}
      DFE_TRANSPORT_BUS_PRESENT: ${DFE_TRANSPORT_BUS_PRESENT:-false}
      # The receiver's routing.source_org_id where the engine renders its config.
      # allow keeps the `_org_id` the detection tests and `make post` send, as the
      # committed receiver configs do. disallow strips every sender's.
      DFE_INGEST_SOURCE_ORG_ID: ${DFE_INGEST_SOURCE_ORG_ID:-allow}
      # The broker the engine creates a source's topics on: the in-stack one on a
      # kafka tier unless .env names another, and nothing on a direct tier.
      DFE_KAFKA_BOOTSTRAP_SERVERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      # The everyday admin, issued with a forced change at first login, which
      # `make post` makes and records in .env. A changed value is a rotation the
      # next boot issues the same way. A value the engine last issued, or the
      # account's current password, re-issues nothing. The engine refuses to start
      # on an empty value or the shipped default unless DFE_ENV is a dev posture.
      DFE_AUTH_LOCAL_ADMIN_NAME: ${DFE_AUTH_LOCAL_ADMIN_NAME:-admin}
      DFE_AUTH_LOCAL_ADMIN_PASSWORD: ${DFE_AUTH_LOCAL_ADMIN_PASSWORD:-}
      # The recovery admin. Mint-once: the engine hashes it into the deploy repo
      # on the first boot with no hash committed, and ignores it from then on.
      DFE_AUTH_BREAKGLASS_PASSWORD: ${DFE_AUTH_BREAKGLASS_PASSWORD:-}
      # Keys the OIDC session cookie. The engine ships a known placeholder and
      # refuses to start on it outside a dev posture, the same as the admin
      # password above, so `make init` mints this one too.
      DFE_API_JWT_SECRET: ${DFE_API_JWT_SECRET:-}
      # The deploy repo the break-glass hash and the governance settings live in.
      # Local-only here: no repo_url, so nothing is pushed anywhere. It sits inside
      # the config volume because a volume mounted on a path the image does not own
      # lands root-owned and the engine runs as UID 1000.
      DFE_GITOPS_ENABLED: ${DFE_GITOPS_ENABLED:-true}
      DFE_GITOPS_LOCAL_PATH: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/deploy-repo
      # HyperDX's control surface: the engine fans the sources it deploys onto
      # every HyperDX team. Both follow the resolved footprint
      # (scripts/resolve_profile.py), so one DFE_HYPERDX_ENABLED governs the
      # HyperDX containers and the engine that drives them.
      DFE_HYPERDX_ENABLED: ${DFE_HYPERDX_RESOLVED:-false}
      DFE_HYPERDX_BASE_URL: ${DFE_HYPERDX_RESOLVED_BASE_URL:-}
      # The infra UIs this stack runs and publishes, as the console's admin links.
      # resolve_profile.py builds the list from the footprint and the exposure
      # dials, so a UI the dials take off the host is not offered.
      DFE_ADMIN_LINKS: ${DFE_ADMIN_LINKS_RESOLVED:-}
      DFE_CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      # The bundled ClickHouse listens on 8123/9000 whatever its host publish is,
      # so only an external CLICKHOUSE_HOST sets these ports (#75).
      DFE_CLICKHOUSE_PORT: ${CLICKHOUSE_EXTERNAL_HTTP_PORT:-8123}
      DFE_CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_EXTERNAL_NATIVE_PORT:-9000}
      DFE_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-default}
      DFE_CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      DFE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      DFE_CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      # The passwords the engine gives each app's own user: the same values each
      # app below connects with, minted by `make init`. Only the engine holds the
      # admin password above.
      DFE_CLICKHOUSE_HUNT_RUNNER_PASSWORD: ${DFE_HUNT_RUNNER_CLICKHOUSE_PASSWORD:-}
      DFE_CLICKHOUSE_LOADER_PASSWORD: ${DFE_LOADER_CLICKHOUSE_PASSWORD:-}
      DFE_CLICKHOUSE_QUERY_READER_PASSWORD: ${DFE_QUERY_READER_CLICKHOUSE_PASSWORD:-}
      DFE_CLICKHOUSE_OTEL_WRITER_PASSWORD: ${DFE_OTEL_WRITER_CLICKHOUSE_PASSWORD:-}
      # Default TTL for every time-series table; 0 = none; a source or a
      # dfe-schemas TTL overrides it.
      DFE_CLICKHOUSE_DEFAULT_TTL_DAYS: ${DFE_CLICKHOUSE_DEFAULT_TTL_DAYS:-90}
      # Where the engine renders each app's own config, which is the Compose
      # stand-in for the ConfigMap an app's chart renders on Kubernetes. Empty
      # turns the writer off, which is every tier whose apps read a committed
      # config instead. The apps mount the same volume read-only, at their own
      # path, which is what the MOUNT value names.
      DFE_DEPLOYMENT_APP_CONFIG_DIR: ${DFE_ENGINE_APP_CONFIG_DIR:-}
      DFE_DEPLOYMENT_APP_CONFIG_BASE_DIR: ${DFE_ENGINE_APP_CONFIG_BASE_DIR:-}
      DFE_DEPLOYMENT_APP_CONFIG_MOUNT: ${DFE_APP_CONFIG_MOUNT:-/etc/dfe/apps}
      DFE_CONFIG_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}
      # Onto the config VOLUME, because the engine mints its ES384 JWT signing
      # key here on first use: left on the container filesystem it is remade on
      # every recreate, and every session issued before it stops verifying.
      DFE_SECRETS_PATH: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/.secrets
      DFE_SCHEMAS_DIR: ${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
      # Transform templates another repo ships, which the engine seeds its
      # library from at startup. Nothing writes it on Compose
      # yet -- the contract one-shots fill the sibling directory, not this one --
      # and an empty directory is a no-op.
      DFE_LIBRARY_SEED_DIR: ${DFE_ENGINE_CONTENT_DIR:-/app/content}/library
      # Where the contract one-shots write, one directory per app, on the same
      # volume. resolve_profile.py sets it EMPTY on a tier the engine renders no
      # app config for; unset (compose run without make) keeps the volume's path.
      DFE_APP_CONTRACT_DIR: ${DFE_ENGINE_CONTRACT_DIR-${DFE_ENGINE_CONTENT_DIR:-/app/content}/contract}
      # Where the engine writes env/<service>.custom.env, the sibling of the app
      # config directory above. A literal, because it names the bind mount below
      # and the two have to stay the same path -- and that path is the host tree,
      # so a write here changes the operator's checkout.
      DFE_DEPLOYMENT_APP_ENV_DIR: /app/app-env
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-engine
      # scalo's CLI falls back to the prometheus backend, so the endpoint alone
      # exports nothing. `opentelemetry` is dual -- OTLP push AND /metrics.
      DFE_API_METRICS_BACKEND: ${DFE_ENGINE_METRICS_BACKEND:-prometheus}
      # scalo-py reads the key bare, whatever the process prefix (DFE_API) is.
      VERSION_CHECK__ENABLED: ${DFE_VERSION_CHECK_ENABLED:-true}
      VERSION_CHECK__SEND_INSTANCE_ID: ${DFE_VERSION_CHECK_SEND_INSTANCE_ID:-true}
    volumes:
      - dfe-engine-config:${DFE_ENGINE_CONFIG_DIR:-/app/config}
      - dfe-engine-schemas:${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
      - dfe-engine-content:${DFE_ENGINE_CONTENT_DIR:-/app/content}
      # The only writer of this volume; every app mounts it read-only.
      - dfe-app-config:/app/app-config
      # The per-service env files, READ-WRITE: the engine writes a service's
      # custom keys to env/<service>.custom.env, and compose reads env_file off
      # the host tree rather than a volume. It is the operator's checkout being
      # written.
      - ./env:/app/app-env
      # Each app's base config, as THIS tier committed it. The instance overlay
      # is merged over it, so the broker, the warehouse credentials and the spool
      # stay with the deployment rather than being written into the deploy repo.
      - ./config/${DFE_ARCHIVER_CONFIG:-archiver/kafka.yaml}:/app/app-config-base/dfe-archiver.yaml:ro
      - ./config/${DFE_LOADER_CONFIG:-loader/kafka.yaml}:/app/app-config-base/dfe-loader.yaml:ro
      - ./config/${DFE_RECEIVER_CONFIG:-receiver/kafka.yaml}:/app/app-config-base/dfe-receiver.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      # The engine creates the declared bootstrap topics at its own startup, so
      # it is the only service that needs the broker before it runs. One of the
      # two is enabled by compose profile and the other is absent, which is what
      # `required: false` is for -- as is the grpc tier, which runs neither.
      # This edge is also what pulls the broker up at all: it is not in
      # ACTIVE_SERVICES, so it starts as somebody's dependency or not at all.
      kafka-redpanda:
        condition: service_healthy
        required: false
      kafka-apache:
        condition: service_healthy
        required: false
      # Each app's contract, emitted before the engine reads it. `required:
      # false` for the tiers that run no such app, and a FAILED emit only warns.
      contract-dfe-archiver:
        condition: service_completed_successfully
        required: false
      contract-dfe-fetcher:
        condition: service_completed_successfully
        required: false
      contract-dfe-loader:
        condition: service_completed_successfully
        required: false
      contract-dfe-receiver:
        condition: service_completed_successfully
        required: false
      contract-dfe-transform-elastic:
        condition: service_completed_successfully
        required: false
      contract-dfe-transform-vector:
        condition: service_completed_successfully
        required: false
      contract-dfe-transform-vrl:
        condition: service_completed_successfully
        required: false
    working_dir: /home/appuser
    healthcheck:
      # Readiness, same reasoning as the header: depends_on gates on it.
      test: ["CMD", "curl", "-sf", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 3s
      # A removed engine's schema lease (twice the 180 s bootstrap wait) plus a first start's table creation.
      start_period: 540s
      retries: 5

  # ===========================================================================
  # dfe-hunt-runner -- the pull-based hunt executor (engine image, own process).
  # One instance per stack, the same shape the Kubernetes chart runs. It reads
  # the hunt and rule YAML the engine governs off the engine's config volume,
  # so a hunt created through the UI is picked up on the next poll.
  # ===========================================================================

  dfe-hunt-runner:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-hunt-runner
    profiles: ["core"]
    restart: unless-stopped
    deploy: *limits-service
    # The image's entrypoint is the engine CLI; the runner is its own console script.
    entrypoint: ["dfe-hunt-runner"]
    # --reload-every 1 is what makes "picked up on the next poll" true: the default
    # re-reads the hunt dir every 20 ticks, which is five minutes at this poll.
    command: ["run", "--poll", "15", "--cap", "8", "--reload-every", "1"]
    env_file:
      - path: env/engine.env
        required: false
    environment:
      DFE_ENV: ${DFE_ENV:-production}
      # The runner builds the same DFESettings the API does, so it hits the same
      # start-up refusal without this.
      DFE_API_JWT_SECRET: ${DFE_API_JWT_SECRET:-}
      # Container ports whatever the host publish is, as for dfe-engine (#75).
      DFE_CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      DFE_CLICKHOUSE_PORT: ${CLICKHOUSE_EXTERNAL_HTTP_PORT:-8123}
      DFE_CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_EXTERNAL_NATIVE_PORT:-9000}
      DFE_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-default}
      # Its own user, not the admin account: the worker runs INSERT ... SELECT
      # built from rule text, and dfe_hunt_runner can reach nothing but the data
      # database. The engine names the user, so it is not a dial.
      DFE_CLICKHOUSE_USERNAME: dfe_hunt_runner
      DFE_CLICKHOUSE_PASSWORD: ${DFE_HUNT_RUNNER_CLICKHOUSE_PASSWORD:-}
      DFE_CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      DFE_CONFIG_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}
      # Same volume as the API's, so both read the one signing key.
      DFE_SECRETS_PATH: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/.secrets
      # The engine governs hunts and rules in the deploy repo it clones into the
      # shared config volume, so the runner reads that working tree; a runner
      # pointed at the bare config dir polls a directory nothing writes.
      DFE_HUNTS_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/deploy-repo/config/hunts
      DFE_HUNTS_RULES_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/deploy-repo/config/rules
      DFE_SCHEMAS_DIR: ${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-hunt-runner
    volumes:
      - dfe-engine-config:${DFE_ENGINE_CONFIG_DIR:-/app/config}
      - dfe-engine-schemas:${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
    depends_on:
      dfe-engine:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
        required: false
    # The runner has no HTTP listener, so the engine image's HEALTHCHECK (:9090/livez)
    # can never pass here. Liveness is the ClickHouse lease the runner renews.
    healthcheck:
      disable: true
    working_dir: /home/appuser

  # ===========================================================================
  # dfe-ui
  # ===========================================================================

  dfe-ui:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-ui:${DFE_UI_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_UI_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-ui
    profiles: ["core"]
    restart: unless-stopped
    deploy: *limits-service
    env_file:
      - path: env/ui.env
        required: false
    environment:
      HYPERDX_PORT: ${DFE_HYPERDX_EMBED_PORT:-8091}
      NODE_ENV: ${DFE_UI_NODE_ENV:-production}
      # `make init` generates this. NOT a `:?` hard-fail -- that would abort even
      # `make down` for everyone. The sentinel is what makes a missing one loud.
      NEXTAUTH_SECRET: ${DFE_UI_NEXTAUTH_SECRET:-RUN-make-init-TO-GENERATE-A-REAL-SECRET}
      # Every absolute URL next-auth builds, the post-logout redirect included.
      # Unset, it resolves to a hardcoded http://localhost:3000 and every logout
      # leaves the origin the browser arrived on -- so this always carries a
      # value, and DFE_EXTERNAL_ORIGIN is what an operator moves.
      NEXTAUTH_URL: ${DFE_EXTERNAL_ORIGIN:-http://localhost}:${DFE_UI_PORT:-3000}
      # The UI's exporter has no gRPC transport, so it takes the collector's HTTP port.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_HTTP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: dfe-ui
    healthcheck:
      # The image ships no curl; node's own fetch does it. `/livez` is a real
      # endpoint here -- an unknown path returns the 200 app shell, so probing
      # `/` proved only that Node was listening.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/livez').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # ===========================================================================
  # dfe-proxy
  #
  # THE product entrypoint. Its oauth2/jwt_authn filters chain in when dfe-engine
  # becomes the OIDC provider -- opt-in, scoped to this origin, and no profile may
  # require an issuer to start.
  # docs/operating.md#only-the-console-authenticates----everything-else-is-bounded-by-that
  # ===========================================================================

  dfe-proxy:
    image: envoyproxy/envoy:${DFE_PROXY_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_PROXY_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-proxy
    profiles: ["core"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      # The DFE UI -- this is the one users reach. PRODUCT class: it binds
      # DFE_UI_BIND_HOST (the DFE_BIND_SCOPE dial) and the infra kill switch
      # never covers it, so only DFE_UI_EXTERNAL=false takes it dark.
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_UI_PORT:-3000}:8080
      # HyperDX, re-served with frame-ancestors rewritten so the UI can iframe
      # it. The app's own port stays infra class on the hyperdx service.
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_EMBED_PORT:-8091}:8091
    environment:
      # Every origin the console may be framed from, space-separated for the
      # frame-ancestors source list in config/proxy/envoy.yaml. An operator on the
      # box reads the console on loopback whatever the deployment publishes it as,
      # so both loopback forms stay in the list alongside the external origin. A
      # repeated entry is inert -- a source list is a set.
      DFE_HYPERDX_EMBED_ANCESTOR: http://localhost:${DFE_UI_PORT:-3000} http://127.0.0.1:${DFE_UI_PORT:-3000} ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_UI_PORT:-3000}
    volumes:
      - ./config/proxy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      dfe-ui:
        condition: service_healthy
        required: false
      dfe-engine:
        condition: service_healthy
        required: false
    healthcheck:
      # The image ships no curl/wget; drive the local admin /ready over
      # bash's /dev/tcp (admin binds 127.0.0.1 only, never published).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # ===========================================================================
  # otel-collector
  # The stack's own telemetry, opt-in via DFE_OTEL_ENABLED. Its OTLP ports are
  # NOT published: self-monitoring stays on the compose network, and 4317/4318
  # on the host belong to dfe-receiver's ingest. docs/operating.md#self-monitoring
  # ===========================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${DFE_OTEL_COLLECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_OTEL_COLLECTOR_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-otel-collector
    profiles: ["otel"]
    restart: unless-stopped
    deploy: *limits-sidecar
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      # The health_check extension. Operator surface, and the only way in: the
      # image is distroless, so a HEALTHCHECK has no client to probe it with.
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_OTEL_HEALTH_PORT:-13133}:13133
      # Container stdout, in. Published because the DOCKER DAEMON connects to it,
      # and the daemon is on the host rather than on the compose network.
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_OTEL_FLUENT_PORT:-24224}:24224
    environment:
      # Container port whatever the host publish is, as for dfe-engine (#75).
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_EXTERNAL_NATIVE_PORT:-9000}
      # Its own user, not the admin account: dfe_otel_writer writes the otel
      # tables and reads server health. The engine names the user.
      CLICKHOUSE_USERNAME: dfe_otel_writer
      CLICKHOUSE_PASSWORD: ${DFE_OTEL_WRITER_CLICKHOUSE_PASSWORD:-}
      DFE_OTEL_DATABASE: ${DFE_OTEL_DATABASE:-dfe}
      DFE_OTEL_COLLECTOR_LOG_LEVEL: ${DFE_OTEL_COLLECTOR_LOG_LEVEL:-warn}
      # Resolved by `make` for the usage rollup (scripts/usage_cores.py), and cores deployed reads as not measured without them.
      DFE_USAGE_CPU_LIMITS: ${DFE_USAGE_CPU_LIMITS:-}
      DFE_USAGE_NODE_NAME: ${DFE_USAGE_NODE_NAME:-docker-host}
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      # host_metrics counts the docker host's CPUs through its /proc, the one host path the cpu scraper reads.
      - /proc:/hostfs/proc:ro
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      # The exporter runs with create_schema=false, so the otel tables have to
      # exist before it sends its first batch. dfe-engine applies them at its own
      # startup and reports healthy only once that pass converged.
      dfe-engine:
        condition: service_healthy
        required: false
    # No HEALTHCHECK: the image is distroless (no shell, no curl, no wget), so
    # there is nothing in it to probe :13133 with. Nothing gates on the
    # collector, so an always-passing probe would only look like cover.

  # ===========================================================================
  # HyperDX (observability UI)
  # Opt-in via DFE_HYPERDX_ENABLED
  # ===========================================================================

  # dfe-engine is the SSoT for the dashboard CONTENT; this copies it out of the
  # engine image into a volume HyperDX's own provisioner reads, so there is one
  # copy of a dashboard in the product and bumping the engine pin ships new ones.
  # The k8s hyperdx chart runs the identical command as an init container.
  dfe-dashboards:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-dashboards
    profiles: ["hyperdx"]
    deploy: *limits-sidecar
    # A fresh named volume mounted at a path the image does not create is owned by
    # root, and the engine image runs as uid 1000 -- so this one-shot writes as
    # root. It reaches no network and no host path, and exits after seven files.
    user: "0:0"
    # Overriding the entrypoint bypasses `dfe-engine run`, so no config, no
    # secrets store and no database is touched.
    entrypoint: ["python"]
    command: ["-m", "dfe_engine.hyperdx.dashboards", "--out", "/etc/hyperdx/dashboards"]
    volumes:
      - hyperdx-dashboards:/etc/hyperdx/dashboards
    restart: "no"

  # The CA and the certificate hyperdx-documentdb serves, so HyperDX verifies the
  # gateway rather than trusting whatever answers. Minted once into their own
  # volume. The engine image is here only for its openssl.
  hyperdx-documentdb-tls:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-hyperdx-documentdb-tls
    profiles: ["hyperdx"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image creates.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # A LIST with one element, for the reason dlq-init's command gives. A pair
    # with 30 days left is kept, so a restart never moves the CA under HyperDX.
    # The CA key is discarded: a pair that needs replacing gets a new CA with it.
    # Modes are set on every run, so a run cut short is repaired by the next.
    command:
      - |
        set -eu
        umask 077
        cd /tls
        if ! { [ -s ca/ca.crt ] && [ -s server/tls.key ] && [ -s server/tls.crt ] \
            && openssl x509 -checkend 2592000 -noout -in server/tls.crt >/dev/null; }; then
          rm -rf ca server ca.key ca.srl server.csr server.ext
          mkdir ca server
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-384 -nodes -sha384 -days 3650 \
            -subj /CN=dfe-hyperdx-documentdb-ca \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign \
            -keyout ca.key -out ca/ca.crt
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-384 -nodes -sha384 \
            -subj /CN=hyperdx-documentdb -keyout server/tls.key -out server.csr
          printf '%s\n' basicConstraints=critical,CA:FALSE keyUsage=critical,digitalSignature \
            extendedKeyUsage=serverAuth subjectAltName=DNS:hyperdx-documentdb > server.ext
          openssl x509 -req -in server.csr -CA ca/ca.crt -CAkey ca.key -CAcreateserial -CAserial ca.srl \
            -days 3650 -sha384 -extfile server.ext -out server/tls.crt
          rm -f ca.key ca.srl server.csr server.ext
        fi
        # HyperDX (uid 1000) reads the CA, and documentdb-local (uid 1000) the pair.
        chmod 0755 ca
        chmod 0644 ca/ca.crt
        chown -R 1000:1000 server
    volumes:
      - hyperdx-documentdb-tls:/tls
    restart: "no"

  # HyperDX's document store: PostgreSQL with the DocumentDB extensions and the
  # Mongo-wire gateway HyperDX talks to, in one container.
  hyperdx-documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:${HYPERDX_DOCUMENTDB_VERSION:-pg18-1.0.0@sha256:03aef53ed72cd3007236f8ce1b4ef7a0c958dbbce1519074b85d8a3e10be89a5}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-hyperdx-documentdb
    profiles: ["hyperdx"]
    restart: unless-stopped
    # The image exposes no PostgreSQL memory settings, so initdb's 128MB
    # shared_buffers, 4MB work_mem and 100 connections run inside this limit.
    deploy: *limits-service
    environment:
      USERNAME: ${HYPERDX_POSTGRES_USER:-hyperdx}
      # `make init` generates this. Not a `:?` hard-fail -- see NEXTAUTH_SECRET.
      PASSWORD: ${HYPERDX_POSTGRES_PASSWORD:-hyperdx}
      # The gateway refuses plain connections and serves the minted certificate.
      TLS_MODE: requireTLS
      CERT_PATH: /etc/documentdb/tls/tls.crt
      KEY_FILE: /etc/documentdb/tls/tls.key
      # On by default upstream: it reports to a third party at start and hourly.
      DOCUMENTDB_USAGE_TELEMETRY: "false"
    volumes:
      # The image's VOLUME. A fresh volume takes the cluster the image ships
      # pre-initialised, so the first start skips initdb.
      - hyperdx-documentdb-data:/data
      - type: volume
        source: hyperdx-documentdb-tls
        target: /etc/documentdb/tls
        read_only: true
        volume:
          subpath: server
    depends_on:
      hyperdx-documentdb-tls:
        condition: service_completed_successfully
    healthcheck:
      # The image's own probe: startup finished, PostgreSQL answering and a TLS
      # handshake on the gateway. We only retune its 30s interval and 600s start
      # period, which are far too slow to gate startup on.
      test: ["CMD", "/usr/local/bin/documentdb-healthcheck"]
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 10

  hyperdx:
    # Pinned from the stack SSoT like every other image: the fork now publishes,
    # so `make stack` renders DFE_HYPERDX_VERSION from versions.yaml
    # (content.dfe-hyperdx). Fail-loud `:?` -- no floating `latest`.
    # Same image name the k8s chart pulls; ghcr.io/hyperi-io/hyperi-hyperdx does not exist.
    # Digest-pinned like the rest: versions.yaml carries digests.dfe-hyperdx, which
    # the render appends as tag@sha256.
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-hyperdx:${DFE_HYPERDX_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_HYPERDX_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-hyperdx
    profiles: ["hyperdx"]
    restart: unless-stopped
    deploy: *limits-hyperdx
    # No published ports: dfe-hyperdx-proxy carries both origins, so the infra
    # exposure dials and the `auth` profile govern one service.
    env_file:
      - path: env/hyperdx.env
        required: false
    environment:
      # The engine is the issuer here as it is on Kubernetes: HyperDX verifies its ES384 token against the engine's JWKS, taking it from a Bearer header or the dfe_token cookie the console mirrors. It asks the engine for each team's ClickHouse connection
      DFE_AUTH_MODE: oidc-proxy
      DFE_ENGINE_JWKS_URL: ${DFE_ENGINE_JWKS_URL:-http://dfe-engine:8000/.well-known/jwks.json}
      # The team a token carrying no group claim lands in.
      DFE_AUTH_DEFAULT_TEAM: ${DFE_HYPERDX_TEAM:-dfe}
      # Upstream's usage-stats task reports to a third party, and reads each
      # connection without its password, so it fails ClickHouse auth on every API
      # start. Off unless the deployer opts in, the same default as the k8s chart.
      USAGE_STATS_ENABLED: ${DFE_HYPERDX_USAGE_STATS_ENABLED:-false}
      # Setting the directory is what starts the provisioner: entry.prod.sh
      # launches the provision-dashboards task only when it is present. It then
      # re-runs on a one-minute cron, which is how a team created after startup
      # still gets its dashboards.
      DASHBOARD_PROVISIONER_DIR: /etc/hyperdx/dashboards
      DASHBOARD_PROVISIONER_ALL_TEAMS: "true"
      # Skip a dashboard whose source the team does not hold, rather than writing
      # it with dead tiles.
      DASHBOARD_PROVISIONER_REQUIRE_REFS: "true"
      HYPERDX_API_PORT: 8000
      # Container ports, both constants, because dfe-proxy dials them by name on
      # the compose network. DFE_HYPERDX_APP_PORT is the HOST binding only, so
      # moving it no longer moves the port the proxy has to find (#32).
      HYPERDX_APP_PORT: 8090
      HYPERDX_APP_URL: ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}
      FRONTEND_URL: ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_HYPERDX_APP_PORT:-8090}
      # Link-back origin so the embedded HyperDX opens a created rule in the DFE
      # UI (served by dfe-proxy on DFE_UI_PORT), not the HyperDX origin. Matches
      # the k8s hyperdx chart. next-runtime-env reads it per request.
      NEXT_PUBLIC_DFE_UI_BASE_URL: ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_UI_PORT:-3000}
      # HyperDX talks Mongo wire protocol to DocumentDB's gateway, over TLS checked
      # against the minted CA and with a SCRAM-SHA-256 login.
      MONGO_URI: mongodb://${HYPERDX_POSTGRES_USER:-hyperdx}:${HYPERDX_POSTGRES_PASSWORD:-hyperdx}@hyperdx-documentdb:10260/hyperdx?tls=true&tlsCAFile=/etc/dfe/documentdb-ca/ca.crt&authMechanism=SCRAM-SHA-256
      # Unset, HyperDX signs sessions with a key published upstream, so `make init`
      # generates one. Not a `:?` hard-fail -- see NEXTAUTH_SECRET.
      EXPRESS_SESSION_SECRET: ${HYPERDX_EXPRESS_SESSION_SECRET:-RUN-make-init-TO-GENERATE-A-REAL-SECRET}
      # Encrypts stored third-party tokens; `make init` generates 64 hex chars. The
      # fallback is empty (plain text), not a sentinel: HyperDX refuses to start on
      # a malformed key.
      TOKEN_ENCRYPTION_KEY: ${HYPERDX_TOKEN_ENCRYPTION_KEY:-}
      NEXT_PUBLIC_THEME: ${HYPERDX_THEME:-dfe}
    volumes:
      - hyperdx-dashboards:/etc/hyperdx/dashboards:ro
      # The CA alone, never the gateway's key beside it.
      - type: volume
        source: hyperdx-documentdb-tls
        target: /etc/dfe/documentdb-ca
        read_only: true
        volume:
          subpath: ca
    depends_on:
      hyperdx-documentdb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
        required: false
      # The provisioner reads the directory on startup, so the engine has to have
      # written it first. Not `required` -- a stack without the engine image still
      # starts HyperDX, it just provisions nothing.
      dfe-dashboards:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # HyperDX's edge. It carries the two HyperDX host ports (config/proxy/hyperdx.yaml)
  # so that one service answers to the infra exposure dials and the `auth` profile.
  dfe-hyperdx-proxy:
    image: envoyproxy/envoy:${DFE_PROXY_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_PROXY_VERSION}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-hyperdx-proxy
    profiles: ["hyperdx"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      # INFRA class, both origins: DFE_INFRA_UIS_EXTERNAL=false unpublishes them.
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_APP_PORT:-8090}:8090
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_API_PORT:-8000}:8000
    volumes:
      - ./config/proxy/hyperdx.yaml:/etc/envoy/envoy.yaml:ro
    healthcheck:
      # The image ships no curl/wget; drive the local admin /ready over
      # bash's /dev/tcp (admin binds 127.0.0.1 only, never published).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # ===========================================================================
  # oauth2-proxy -- edge OIDC + group check for the INFRA UIs
  #
  # The docker half of the dual-mode auth seam: k8s gates infra routes at the
  # Envoy edge, compose has no Gateway, so each infra UI gets a proxy in front
  # of it. OFF by default and behind its own `auth` profile, because no dfe-docker
  # profile may require an OIDC issuer to exist.
  #
  # With the profile armed the Makefile chains the kafbat and hyperdx unpublish
  # fragments, so those UIs stop reaching the host directly and these take over
  # their ports -- same port numbers, a gate in front. Turn the infra class off
  # and the PROXIES go dark with the UIs: a gated door is still a door.
  #
  # It gates PAGE ACCESS ONLY. Neither UI learns who signed in here: HyperDX identifies a caller by the engine token.
  # docs/operating.md#gating-the-infra-uis-with-oidc
  # ===========================================================================

  oauth2-proxy-kafbat:
    image: quay.io/oauth2-proxy/oauth2-proxy:${DFE_OAUTH2_PROXY_VERSION:-v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-oauth2-proxy-kafbat
    profiles: ["auth"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${KAFBAT_PORT:-8081}:4180
    environment:
      <<: *oauth2-proxy-env
      OAUTH2_PROXY_UPSTREAMS: http://kafka-ui:8080
      OAUTH2_PROXY_REDIRECT_URL: ${DFE_OAUTH2_PROXY_EXTERNAL_ORIGIN:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${KAFBAT_PORT:-8081}/oauth2/callback
    depends_on:
      kafka-ui:
        condition: service_started
        required: false

  oauth2-proxy-hyperdx:
    image: quay.io/oauth2-proxy/oauth2-proxy:${DFE_OAUTH2_PROXY_VERSION:-v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-oauth2-proxy-hyperdx
    profiles: ["auth"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_APP_PORT:-8090}:4180
    environment:
      <<: *oauth2-proxy-env
      OAUTH2_PROXY_UPSTREAMS: http://hyperdx:8090
      OAUTH2_PROXY_REDIRECT_URL: ${DFE_OAUTH2_PROXY_EXTERNAL_ORIGIN:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_HYPERDX_APP_PORT:-8090}/oauth2/callback
    depends_on:
      hyperdx:
        condition: service_healthy
        required: false

  # The SECOND HyperDX origin, and an OPERATOR one: the browser calls the API at
  # a relative /api/* under the app, which the Next.js server proxies on container
  # loopback, so nothing in the page depends on this port. It is gated all the
  # same because the API answers the same questions the app does. One oauth2-proxy
  # serves exactly one --http-address, hence a second service. Same cookie secret
  # and name as the app proxy above, and cookies are not port-scoped, so signing
  # in at the app authorises this one too.
  oauth2-proxy-hyperdx-api:
    image: quay.io/oauth2-proxy/oauth2-proxy:${DFE_OAUTH2_PROXY_VERSION:-v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916}
    container_name: ${DFE_CONTAINER_PREFIX:-}dfe-oauth2-proxy-hyperdx-api
    profiles: ["auth"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_API_PORT:-8000}:4180
    environment:
      <<: *oauth2-proxy-env
      OAUTH2_PROXY_UPSTREAMS: http://hyperdx:8000
      OAUTH2_PROXY_REDIRECT_URL: ${DFE_OAUTH2_PROXY_EXTERNAL_ORIGIN:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_HYPERDX_API_PORT:-8000}/oauth2/callback
      # Host header and every upstream response header pass through untouched
      # (--pass-host-header defaults true), so HyperDX's own CORS headers reach
      # the browser exactly as the API sent them.
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"
    depends_on:
      hyperdx:
        condition: service_healthy
        required: false

# Every path an image declares as a VOLUME is mounted from one of these: an
# unmounted one gets a fresh anonymous volume per container, which `make down`
# strands and `make clean` cannot reach. check_compose.py holds the list.
volumes:
  clickhouse-data:
  kafka-redpanda-data:
  kafka-apache-data:
  kafka-apache-secrets:
  kafka-apache-config:
  archiver-data:
  dlq-spool:
  fetcher-cursors:
  dfe-engine-config:
  dfe-engine-schemas:
  dfe-engine-content:
  # What the engine renders each app's own config into, one directory per app.
  # Its own volume rather than a corner of dfe-engine-config, which also holds
  # the engine's JWT signing key and the deploy repo -- neither of which a
  # data-plane container has any business reading.
  dfe-app-config:
  hyperdx-dashboards:
  hyperdx-documentdb-data:
  hyperdx-documentdb-tls:
