# Project:   dfe-docker
# File:      docker-compose.yml
# Purpose:   DFE 2.2 Docker Compose stack
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Profile        | Services                            | Notes                                     |
# ---------------|-------------------------------------|-------------------------------------------|
# clickhouse     | clickhouse                          |                                           |
# kafka-redpanda | kafka-redpanda                      | Redpanda (default); BSL -- see README      |
# kafka-apache   | kafka-apache                        | Apache Kafka (opt-in); Apache-2.0 only     |
# kafka-ui       | kafka-ui                            |                                           |
# otel           | otel-collector                      | self-monitoring; opt-in                   |
# auth           | oauth2-proxy-* (3)                  | edge OIDC + group check; opt-in           |
#
# The kafka-* profiles are mutually exclusive: all three share the network alias `kafka`, and downstream
# configs always address `kafka:9092`.
#
# Topics and ClickHouse objects are NOT created here. dfe-schemas declares them and dfe-engine applies
# them at its own startup, reporting healthy only once that pass converged -- which is what every
# `depends_on: dfe-engine: service_healthy` below is waiting for.
#
# DFE services carry profiles too -- `dfe`, `core`, `hyperdx`, `otel`. WHICH of them start is a second,
# independent selection made by service_profiles.yaml, which also sets their config paths.
#
# Three host-binding variables, split by audience: DFE_INGRESS_BIND_HOST (ingest, 0.0.0.0), DFE_UI_BIND_HOST
# (every web UI, from the DFE_BIND_SCOPE dial, 127.0.0.1) and DFE_BIND_HOST (operators, 127.0.0.1).
# docs/operating.md#port-exposure-is-split-by-audience.
#
# Every DFE service serves `/livez`, `/readyz` and `/metrics` and nothing else -- the retired aliases 404.
# A HEALTHCHECK uses `/livez` EXCEPT where a `depends_on` gates on it, which is why dfe-loader and
# dfe-engine use `/readyz`. docs/troubleshooting.md#which-path-each-healthcheck-uses-and-why-it-differs.
#
# Every service declares deploy.resources.limits, in four tiers. `make limits` prints the resolved numbers;
# docs/operating.md#resource-limits-four-tiers-ceilings-not-reservations explains the sizing.
#
# Quick start:
#   make dev                         # Uses active_profile from service_profiles.yaml
#   DFE_PROFILE=grpc-full make dev   # Override profile
#   KAFKA_BACKEND=apache make dev    # Override Kafka backend
#
# Dev build from source (requires docker-compose.override.yml - auto-loaded):
#   make dev
#
# CI / registry images only (skip override):
#   docker compose -f docker-compose.yml --profile clickhouse --profile kafka-redpanda up -d dfe-loader

# =============================================================================
# Resource limit tiers
# Anchors, not services -- the `x-` prefix keeps Compose from treating them as one.
# =============================================================================

# Sized for a 16 GB box running the DEFAULT profile. No totals written down here
# -- `make limits` computes them from the resolved config and cannot drift.
x-limits-clickhouse: &limits-clickhouse
  resources:
    limits:
      cpus: "${DFE_CLICKHOUSE_CPUS:-2.0}"
      memory: ${DFE_CLICKHOUSE_MEMORY:-3G}

# Redpanda subtracts the HOST's vm.min_free_kbytes from this limit before it
# checks --memory. redpanda/start.sh lowers --memory to what fits, and this
# headroom keeps the full 1G on any host whose reserve is under 1536M.
x-limits-broker: &limits-broker
  resources:
    limits:
      cpus: "${DFE_BROKER_CPUS:-1.5}"
      memory: ${DFE_BROKER_MEMORY:-2560M}

# 2.0 CPUs is a FLOOR, not a sizing estimate. Below it Tokio gives a scalo service
# one worker thread, the Kafka poll loop owns it, and the whole observability port
# goes dark while the data path keeps working. `make check-compose` enforces it.
# docs/operating.md#dfe_service_cpus-has-a-floor-of-20-and-it-is-not-about-speed
x-limits-service: &limits-service
  resources:
    limits:
      cpus: "${DFE_SERVICE_CPUS:-2.0}"
      memory: ${DFE_SERVICE_MEMORY:-768M}

# 512M rather than less: a sidecar's whole job is to exit cleanly, and a tighter
# cap risks an OOM kill on one.
x-limits-sidecar: &limits-sidecar
  resources:
    limits:
      cpus: "${DFE_SIDECAR_CPUS:-0.5}"
      memory: ${DFE_SIDECAR_MEMORY:-512M}

# =============================================================================
# Stop grace for the data-plane apps
# A stage holding its source acknowledgements drains on SIGTERM: scalo's 5 s
# pre-stop, then up to 20 s to deliver what it holds. Docker's 10 s default
# SIGKILLs it mid-drain, so its sources send those records again. The Kubernetes
# tier gives the same apps the same figures. dfe-transform-vector gives its
# Vector child 55 s to exit, then drains its bridge for up to 15 s, and the rest
# covers the telemetry flush and exit. `make check-compose` asserts both.
# =============================================================================
x-stop-grace-app: &stop-grace-app 45s
x-stop-grace-vector: &stop-grace-vector 90s

# =============================================================================
# oauth2-proxy shared settings (the opt-in `auth` profile)
#
# One OIDC identity and one cookie secret across every infra-UI proxy, so a
# single sign-in covers all of them. They gate on the SAME groups, so sharing a
# session is the intent rather than a leak. Cookies ignore PORT, which is what
# lets the HyperDX app and its API sit on one session across two origins.
#
# EVERY key here takes a default and none of them is a hard-fail, which is
# load-bearing: compose interpolates the whole file BEFORE it filters by profile,
# so a hard-fail key inside a profiled service aborts a stack that never asked
# for that profile. dfe-docker may not require an OIDC issuer to start, so the
# "issuer is missing" check lives in resolve_profile.py, which runs only when the
# auth footprint actually resolves ON.
# =============================================================================
x-oauth2-proxy-env: &oauth2-proxy-env
  OAUTH2_PROXY_PROVIDER: oidc
  OAUTH2_PROXY_OIDC_ISSUER_URL: ${DFE_OIDC_ISSUER_URL:-}
  OAUTH2_PROXY_CLIENT_ID: ${DFE_OIDC_CLIENT_ID:-}
  OAUTH2_PROXY_CLIENT_SECRET: ${DFE_OIDC_CLIENT_SECRET:-}
  # The group check, not authn alone. Plural env name because --allowed-group is
  # a list flag. Setting it makes the generic OIDC provider request the `groups`
  # scope implicitly, so there is no separate scope dial to keep in step.
  OAUTH2_PROXY_ALLOWED_GROUPS: ${DFE_OIDC_ALLOWED_GROUPS:-dfe-infra,dfe-admin}
  # `*` because the group check is the gate. Narrowing by email domain as well
  # is a deployment's choice, not a default.
  OAUTH2_PROXY_EMAIL_DOMAINS: ${DFE_OIDC_EMAIL_DOMAINS:-*}
  OAUTH2_PROXY_COOKIE_SECRET: ${DFE_OAUTH2_PROXY_COOKIE_SECRET:-}
  # Blank = a host-only cookie, which is what shares one session across the
  # infra UIs on a single box. Name it only for a real multi-host deployment.
  OAUTH2_PROXY_COOKIE_DOMAINS: ${DFE_OAUTH2_PROXY_COOKIE_DOMAIN:-}
  # Compose serves plain HTTP, so a Secure cookie would never be sent back and
  # every sign-in would loop. Behind real TLS, set this true.
  OAUTH2_PROXY_COOKIE_SECURE: ${DFE_OAUTH2_PROXY_COOKIE_SECURE:-false}
  OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

services:

  # ===========================================================================
  # ClickHouse
  # Set CLICKHOUSE_HOST in .env to use an external instance.
  # Ports bind DFE_BIND_HOST (loopback by default): an unauthenticated analytics
  # database on 0.0.0.0 is fine on a laptop and an open database anywhere else.
  # ===========================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin CLICKHOUSE_VERSION}
    container_name: dfe-clickhouse
    profiles: ["clickhouse"]
    restart: unless-stopped
    deploy: *limits-clickhouse
    # The HOST side only. CLICKHOUSE_HTTP_PORT and CLICKHOUSE_NATIVE_PORT are also
    # the ports the other services dial in-network, so a second stack moves these.
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_HTTP_HOST_PORT:-${CLICKHOUSE_HTTP_PORT:-8123}}:8123
      - ${DFE_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_NATIVE_HOST_PORT:-${CLICKHOUSE_NATIVE_PORT:-9000}}:9000
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/default-user.xml:/etc/clickhouse-server/users.d/default-custom.xml:ro
      # Server config, not users config: access_control_improvements is only read
      # from config.d.
      - ./clickhouse/server-custom.xml:/etc/clickhouse-server/config.d/dfe-custom.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1 FROM system.databases WHERE name = '\"$$CLICKHOUSE_DB\"'\""]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ===========================================================================
  # Kafka (Redpanda)
  # Default Kafka-API broker (mutually exclusive with other kafka-* services)
  #
  # LICENCE: the core is BSL, not OSS. Set KAFKA_BACKEND=apache if a
  # per-deployment check does not come back clean.
  # docs/operating.md#kafka-backend-licensing-is-a-human-decision
  #
  # `--mode=dev-container` is Redpanda's DEVELOPER mode, not a production one.
  # docs/operating.md#redpanda-ships-in-developer-mode
  # ===========================================================================

  kafka-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:?run 'make stack VERSION=X.Y.Z' to pin REDPANDA_VERSION}
    container_name: dfe-kafka-redpanda
    profiles: ["kafka-redpanda"]
    restart: unless-stopped
    deploy: *limits-broker
    networks:
      default:
        aliases:
          - kafka
    # redpanda/start.sh appends --memory: REDPANDA_MEMORY, lowered to what the
    # container limit holds once this host's kernel reserve is taken off.
    entrypoint: ["/bin/bash", "/usr/local/bin/dfe-redpanda-start.sh"]
    environment:
      REDPANDA_MEMORY: ${REDPANDA_MEMORY:-1G}
    command:
      - redpanda
      - start
      - --mode=${REDPANDA_MODE:-dev-container}
      - --smp=${REDPANDA_SMP:-1}
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${KAFKA_PLAINTEXT_PORT:-9092}:9092
      - ${DFE_BIND_HOST:-127.0.0.1}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}:19092
    volumes:
      - kafka-redpanda-data:/var/lib/redpanda/data
      - ./redpanda/start.sh:/usr/local/bin/dfe-redpanda-start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # Apache Kafka
  # Opt-in Kafka alternative (mutually exclusive with other kafka-* services)
  # ===========================================================================

  kafka-apache:
    image: apache/kafka:${APACHE_KAFKA_VERSION:?run 'make stack VERSION=X.Y.Z' to pin APACHE_KAFKA_VERSION}
    container_name: dfe-kafka-apache
    profiles: ["kafka-apache"]
    restart: unless-stopped
    deploy: *limits-broker
    networks:
      default:
        aliases:
          - kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-dfe-docker-dev-cluster-01}
      # KAFKA_ADVERTISED_HOST / KAFKA_PLAINTEXT_HOST_PORT are threaded through here
      # too, so the .env.example guidance about advertising a reachable name works
      # on BOTH backends. Previously this hardcoded localhost:19092 while the
      # Redpanda service honoured the variables -- so following the documentation
      # on the Apache backend silently did nothing.
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:29092}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:29092}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${KAFKA_PLAINTEXT_PORT:-9092}:9092
      - ${DFE_BIND_HOST:-127.0.0.1}:${KAFKA_PLAINTEXT_HOST_PORT:-19092}:19092
    volumes:
      - kafka-apache-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # Kafka UI
  # Opt-in UI for Kafka cluster.
  # ===========================================================================

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFBAT_VERSION:?run 'make stack VERSION=X.Y.Z' to pin KAFBAT_VERSION}
    container_name: dfe-kafka-ui
    profiles: ["kafka-ui"]
    restart: unless-stopped
    # Service tier, not sidecar: kafbat is a Spring Boot JVM, and the JVM sizes its
    # heap as a percentage of the container limit. On the 512M sidecar tier that
    # leaves roughly 128M of heap, and an OOM kill under `restart: unless-stopped`
    # becomes a restart loop rather than a clean failure.
    deploy: *limits-service
    ports:
      # A web UI, so it binds DFE_UI_BIND_HOST (the DFE_BIND_SCOPE dial), and it
      # is INFRA class -- DFE_INFRA_UIS_EXTERNAL=false unpublishes it along with
      # HyperDX. docs/operating.md#port-exposure-is-split-by-audience
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${KAFBAT_PORT:-8081}:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: ${KAFBAT_DYNAMIC_CONFIG_ENABLED:-true}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFBAT_KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS:-kafka:9092}
      KAFKA_CLUSTERS_0_NAME: ${KAFBAT_KAFKA_CLUSTERS_0_NAME:-dfe-local}

  # ===========================================================================
  # dlq-init
  # Makes the shared DLQ spool and the archive volume writable by the services
  # that use them: Docker creates both mountpoints root-owned and every consumer
  # runs as uid 1000, so without this dfe-archiver crash-loops on its eager DLQ
  # writer and fails every archive write.
  #
  # Three sharp edges -- `required: false` means a FAILED dlq-init only warns,
  # uid 1000 is hard-coded, and no profile names this service, so dev mode builds
  # the archiver for it. docs/troubleshooting.md#the-dlq-spool
  # ===========================================================================

  dlq-init:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ARCHIVER_VERSION}
    container_name: dfe-dlq-init
    profiles: ["dfe"]
    deploy: *limits-sidecar
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # A LIST with one element, not a bare scalar. Compose splits a scalar command
    # into argv, so `sh -c` would receive only `chown` and the rest would land in
    # $0/$1/$2 -- which fails with "chown: missing operand".
    command:
      - chown -R 1000:1000 /var/spool/dfe /var/data/archive
    volumes:
      - dlq-spool:/var/spool/dfe
      - archiver-data:/var/data/archive
    restart: "no"

  # ===========================================================================
  # contract-<app>
  # One one-shot per app, running that app's OWN pinned image: `config-schema`
  # writes the config schema and capability catalogue of the exact binary this
  # stack runs into dfe-engine-content, and the engine reads them back at
  # /contract/<app>. The Kubernetes tier does the same with one init container
  # per app (dfe-infra #305).
  #
  # An app that cannot emit must not wedge the engine. scalo exits non-zero when
  # it fails to WRITE, so the command wraps the call and logs instead, and the
  # engine's depends_on carries `required: false` on top of that.
  #
  # source.json names the ref that produced the directory: a contract is a
  # property of one digest and none of the four files says which.
  #
  # These stay on the registry pin in dev -- the committed override repoints the
  # app services and not these, so a local build's contract is the pin's.
  # ===========================================================================

  contract-dfe-archiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ARCHIVER_VERSION}
    container_name: dfe-contract-dfe-archiver
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      # The ref this contract came from. The image line above hard-fails on an
      # unset pin, so it never renders empty.
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:-}
    # A LIST with one element, for the reason dlq-init's command gives.
    command:
      - |
        if dfe-archiver config-schema --dir /app/content/contract/dfe-archiver; then
          printf '{"app":"dfe-archiver","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-archiver/source.json
        else
          echo "contract: dfe-archiver emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-fetcher:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-fetcher:${DFE_FETCHER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_FETCHER_VERSION}
    container_name: dfe-contract-dfe-fetcher
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-fetcher:${DFE_FETCHER_VERSION:-}
    command:
      - |
        if dfe-fetcher config-schema --dir /app/content/contract/dfe-fetcher; then
          printf '{"app":"dfe-fetcher","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-fetcher/source.json
        else
          echo "contract: dfe-fetcher emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-loader:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-loader:${DFE_LOADER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_LOADER_VERSION}
    container_name: dfe-contract-dfe-loader
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-loader:${DFE_LOADER_VERSION:-}
    command:
      - |
        if dfe-loader config-schema --dir /app/content/contract/dfe-loader; then
          printf '{"app":"dfe-loader","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-loader/source.json
        else
          echo "contract: dfe-loader emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-receiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-receiver:${DFE_RECEIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_RECEIVER_VERSION}
    container_name: dfe-contract-dfe-receiver
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-receiver:${DFE_RECEIVER_VERSION:-}
    command:
      - |
        if dfe-receiver config-schema --dir /app/content/contract/dfe-receiver; then
          printf '{"app":"dfe-receiver","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-receiver/source.json
        else
          echo "contract: dfe-receiver emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-transform-vector:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VECTOR_VERSION}
    container_name: dfe-contract-dfe-transform-vector
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:-}
    command:
      - |
        if dfe-transform-vector config-schema --dir /app/content/contract/dfe-transform-vector; then
          printf '{"app":"dfe-transform-vector","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-transform-vector/source.json
        else
          echo "contract: dfe-transform-vector emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  contract-dfe-transform-vrl:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VRL_VERSION}
    container_name: dfe-contract-dfe-transform-vrl
    profiles: ["core"]
    deploy: *limits-sidecar
    # Root because an empty named volume lands root-owned at a path no image
    # creates, and the engine only ever reads this directory.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      CONTRACT_REF: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:-}
    command:
      - |
        if dfe-transform-vrl config-schema --dir /app/content/contract/dfe-transform-vrl; then
          printf '{"app":"dfe-transform-vrl","ref":"%s","emitted_at":"%s"}\n' \
            "$$CONTRACT_REF" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /app/content/contract/dfe-transform-vrl/source.json
        else
          echo "contract: dfe-transform-vrl emitted nothing, so the engine reports its contract absent" >&2
        fi
    volumes:
      - dfe-engine-content:/app/content
    restart: "no"

  # ===========================================================================
  # dfe-archiver
  # Reads the landing topics off the broker, or receives on its scalo Push
  # listener where the profile has no broker (config/archiver/<transport>.yaml).
  # ===========================================================================

  dfe-archiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ARCHIVER_VERSION}
    container_name: dfe-archiver
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-app
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_ARCHIVER_PROMETHEUS_PORT:-9093}:9090
    env_file:
      - path: env/archiver.env
        required: false
      # The custom keys the engine writes for this app, AFTER the file above so
      # a custom key wins. Compose reads env_file at up-time, so a write needs
      # `docker compose up -d dfe-archiver` and a restart keeps the old values.
      - path: env/dfe-archiver.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Empty exports nothing -- scalo's own rule, and the stack default.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-archiver
    depends_on:
      # The writer of the rendered config below, so it must have written before
      # this container reads. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    working_dir: /home/appuser
    # The engine renders this app's config from the sources on the tiers that run
    # it; everywhere else the committed file below is what it reads.
    command: ["--config", "${DFE_ARCHIVER_CONFIG_FILE:-/etc/dfe/archiver.yaml}"]
    volumes:
      - ./config/${DFE_ARCHIVER_CONFIG:-archiver/kafka.yaml}:/etc/dfe/archiver.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - archiver-data:/var/data/archive
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-fetcher
  # ===========================================================================

  dfe-fetcher:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-fetcher:${DFE_FETCHER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_FETCHER_VERSION}
    container_name: dfe-fetcher
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-app
    deploy: *limits-service
    ports:
      - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_FETCHER_INGEST_PORT:-8082}:8080
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_FETCHER_PROMETHEUS_PORT:-9094}:9090
    env_file:
      - path: env/fetcher.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-fetcher.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-fetcher
    depends_on:
      dfe-loader:
        condition: service_healthy
        required: false
      # The writer of the rendered config below, so it must have written before
      # this container reads. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    # The engine renders this app's config from the sources on the tiers that run
    # it; everywhere else the committed file below is what it reads.
    command: ["--config", "${DFE_FETCHER_CONFIG_FILE:-/etc/dfe/fetcher.yaml}"]
    volumes:
      - ./config/${DFE_FETCHER_CONFIG:-fetcher/kafka.yaml}:/etc/dfe/fetcher.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-loader
  # Defined before dfe-receiver so receiver can depend_on loader (gRPC path).
  # ===========================================================================

  dfe-loader:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-loader:${DFE_LOADER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_LOADER_VERSION}
    container_name: dfe-loader
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-app
    deploy: *limits-service
    ports:
      # 6000 in the container is the INTERNAL DfeTransport/Push surface (receiver
      # -> loader), not a client-facing one -- operators only, so it binds
      # DFE_BIND_HOST, on host port 50051 because the receiver's ingest owns 6000.
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_LOADER_PROMETHEUS_PORT:-9091}:9090
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_LOADER_GRPC_PORT:-50051}:6000
    env_file:
      - path: env/loader.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-loader.custom.env
        required: false
    environment:
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-loader
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      # The schema authority: dfe-engine applies every table and every bootstrap
      # topic at its own startup and reports healthy only once that pass
      # converged. A loader started first holds every message pending-schema and
      # dead-letters it, which reads as data loss and is really start ordering.
      # docs/troubleshooting.md#events-are-accepted-but-nothing-lands
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    # The engine renders this app's config from the sources on the tiers that run
    # it; everywhere else the committed file below is what it reads.
    command: ["--config", "${DFE_LOADER_CONFIG_FILE:-/etc/dfe/loader.yaml}"]
    volumes:
      - ./config/${DFE_LOADER_CONFIG:-loader/kafka.yaml}:/etc/dfe/loader.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-receiver
  # ===========================================================================

  dfe-receiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-receiver:${DFE_RECEIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_RECEIVER_VERSION}
    container_name: dfe-receiver
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-app
    deploy: *limits-service
    ports:
      # 6000 (Vector protocol) and 8080 (HTTP) are the INGEST surfaces external
      # clients push to, so they bind DFE_INGRESS_BIND_HOST. 9090 is operators.
      # The loader also listens on 6000 in its own container, published on 50051,
      # but speaks DfeTransport/Push, a different protocol.
      - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_GRPC_PORT:-6000}:6000
      - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_HTTP_PORT:-8080}:8080
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_RECEIVER_PROMETHEUS_PORT:-9090}:9090
      # Uncomment to expose additional ingest protocols:
      # - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_BEATS_PORT:-5044}:5044
      # - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_HEC_PORT:-8088}:8088
      # - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_OTLP_GRPC_PORT:-4317}:4317
      # - ${DFE_INGRESS_BIND_HOST:-0.0.0.0}:${DFE_RECEIVER_OTLP_HTTP_PORT:-4318}:4318
    env_file:
      - path: env/receiver.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-receiver.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-receiver
    depends_on:
      dfe-loader:
        condition: service_healthy
        required: false
      # The writer of the rendered config below, so it must have written before
      # this container reads. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
      dlq-init:
        condition: service_completed_successfully
        required: false
    # The engine renders this app's config from the sources on the tiers that run
    # it; everywhere else the committed file below is what it reads.
    command: ["--config", "${DFE_RECEIVER_CONFIG_FILE:-/etc/dfe-receiver/config.yaml}"]
    volumes:
      - ./config/${DFE_RECEIVER_CONFIG:-receiver/kafka.yaml}:/etc/dfe-receiver/config.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
      - dlq-spool:/var/spool/dfe
      # Uncomment to enable TLS on gRPC inbound (:6000):
      # - ./certs/dev/receiver.crt:/etc/ssl/receiver.crt:ro
      # - ./certs/dev/receiver.key:/etc/ssl/receiver.key:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-elastic
  # Beats and Elastic Agent JSON in, DFE-normalised events out. It selects ONE
  # compiled-in transform by `source.name` and reads no authored program files,
  # so it has nothing to mount beside its config -- no transforms directory and
  # no enrichment tables.
  #
  # The single tier starts it idle: an empty `source.name` or `source.topics`
  # parks it Ready with no consumer group, which is what lets a tier carry a
  # transform ready for its first source rather than none until one is written.
  # ===========================================================================

  dfe-transform-elastic:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-elastic:${DFE_TRANSFORM_ELASTIC_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_ELASTIC_VERSION}
    container_name: dfe-transform-elastic
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-app
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_ELASTIC_PROMETHEUS_PORT:-9099}:9090
    env_file:
      - path: env/transform-elastic.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-transform-elastic.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-transform-elastic
    depends_on:
      # No dlq-init here: this service does not mount dlq-spool.
      # The writer of the rendered config, so it must have written before this
      # container reads. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
    # The committed file below, on every tier: the engine's bundled catalogue
    # does not offer this app yet, so nothing renders a config for it
    # (dfe-engine#389). The mount and the wait above are what it reads once the
    # catalogue catches up. The path matches the image's own CMD.
    command: ["--config", "${DFE_TRANSFORM_ELASTIC_CONFIG_FILE:-/etc/dfe-transform-elastic/config.yaml}"]
    volumes:
      - ./config/${DFE_TRANSFORM_ELASTIC_CONFIG:-transform-elastic/kafka.yaml}:/etc/dfe-transform-elastic/config.yaml:ro
      - dfe-app-config:/etc/dfe/apps:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-elastic-cisco-ios
  # A SECOND instance of the same image, for the cisco-ios source alone -- the
  # per-source shape dfe-transform-vrl-filebeat carries on the VRL side. The
  # receiver routes _source=cisco-ios to cisco-ios_land, this instance is the
  # only consumer of it, and its output topic names the table dfe-loader writes.
  #
  # `source.name` in the config is the whole difference between two instances of
  # this app: the transform is compiled in, so a second source adds a block like
  # this one and nothing else.
  # ===========================================================================

  dfe-transform-elastic-cisco-ios:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-elastic:${DFE_TRANSFORM_ELASTIC_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_ELASTIC_VERSION}
    container_name: dfe-transform-elastic-cisco-ios
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-app
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_ELASTIC_CISCO_IOS_PROMETHEUS_PORT:-9089}:9090
    env_file:
      - path: env/transform-elastic-cisco-ios.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-transform-elastic-cisco-ios.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-transform-elastic-cisco-ios
    depends_on:
      # No dlq-init here: this service does not mount dlq-spool. dfe-engine
      # creates the topics it reads and writes, so it waits on that instead.
      dfe-engine:
        condition: service_healthy
        required: false
    volumes:
      - ./config/${DFE_TRANSFORM_ELASTIC_CISCO_IOS_CONFIG:-transform-elastic/cisco-ios.yaml}:/etc/dfe-transform-elastic/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vector
  #
  # One metrics port: 9090 carries the scalo surface AND the `vector_*` series,
  # which the wrapper scrapes off the `prometheus_exporter` sink and merges into
  # the scalo registry (dfe-transform-vector#70). The sink still listens on 9598,
  # loopback-only inside the container, and is published nowhere.
  # ===========================================================================

  dfe-transform-vector:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VECTOR_VERSION}
    container_name: dfe-transform-vector
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-vector
    deploy: *limits-service
    # Vector's API binds loopback inside the container, so it has no host port.
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_VECTOR_PROMETHEUS_PORT:-9095}:9090
    env_file:
      - path: env/transform-vector.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-transform-vector.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-transform-vector
    depends_on:
      # No dlq-init here: this service does not mount dlq-spool.
      # The writer of the rendered config below, and the topic authority:
      # dfe-engine creates the declared topic set at its own startup, so a
      # transform started first subscribes to nothing. `required: false` for the
      # tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
    # The engine renders this app's config and its transform programs from the
    # source it is given, on the tiers that run it; everywhere else the committed
    # file below is what it reads.
    command: ["--config", "${DFE_TRANSFORM_VECTOR_CONFIG_FILE:-/etc/dfe-transform-vector/config.yaml}"]
    volumes:
      - ./config/${DFE_TRANSFORM_VECTOR_CONFIG:-transform-vector/kafka.yaml}:/etc/dfe-transform-vector/config.yaml:ro
      # The bundled pipeline names its enrichment table by an absolute path
      # (dfe-transform-vector pipelines/filebeat/README.md), so the table has to
      # be mounted there whichever config the app reads. A pipeline that cannot
      # open it fails `vector validate` with exit 78 and an empty stderr.
      - ./config/transform-vrl/data:/etc/dfe-transform-vector/data:ro
      - dfe-app-config:/etc/dfe/apps:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vector-filebeat
  # A SECOND instance of the same image, for the filebeat source alone -- the
  # dfe-transform-vector half of the shape dfe-transform-vrl-filebeat carries
  # below. The receiver routes _source=filebeat-vector to filebeat-vector_land,
  # this instance is the only consumer of it, and its output topic names the
  # table dfe-loader writes. The two transform apps stay on separate topics and
  # separate tables, so one deployment can run both and compare them.
  #
  # The pipeline is pre-canned: the transforms directory holds the bundled
  # filebeat program and the timezone table it looks up is mounted from the
  # filebeat pipeline's own data directory, shared with the VRL instance rather
  # than copied.
  # ===========================================================================

  dfe-transform-vector-filebeat:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VECTOR_VERSION}
    container_name: dfe-transform-vector-filebeat
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-vector
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_VECTOR_FILEBEAT_PROMETHEUS_PORT:-9098}:9090
    env_file:
      - path: env/transform-vector-filebeat.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-transform-vector-filebeat.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-transform-vector-filebeat
    depends_on:
      # No dlq-init here: this service does not mount dlq-spool.
      # The topic authority: dfe-engine creates the declared topic set at its own
      # startup, so a transform started first subscribes to nothing.
      # `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
    volumes:
      - ./config/${DFE_TRANSFORM_VECTOR_FILEBEAT_CONFIG:-transform-vector/filebeat.yaml}:/etc/dfe-transform-vector/config.yaml:ro
      - ./config/transform-vector/transforms-filebeat:/etc/dfe-transform-vector/transforms:ro
      - ./config/transform-vrl/data:/etc/dfe-transform-vector/data:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vrl
  # ===========================================================================

  dfe-transform-vrl:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VRL_VERSION}
    container_name: dfe-transform-vrl
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-app
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_VRL_PROMETHEUS_PORT:-9096}:9090
    env_file:
      - path: env/transform-vrl.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-transform-vrl.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-transform-vrl
    depends_on:
      # No dlq-init here: this service does not mount dlq-spool.
      # The writer of the rendered config below, so it must have written before
      # this container reads. `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
    # The engine renders this app's config, its programs and its enrichment
    # tables from the source it is given, on the tiers that run it; everywhere
    # else the committed files below are what it reads.
    command: ["--config", "${DFE_TRANSFORM_VRL_CONFIG_FILE:-/etc/dfe-transform-vrl/config.yaml}"]
    volumes:
      - ./config/${DFE_TRANSFORM_VRL_CONFIG:-transform-vrl/kafka.yaml}:/etc/dfe-transform-vrl/config.yaml:ro
      - ./config/transform-vrl/transforms:/etc/dfe-transform-vrl/transforms:ro
      - dfe-app-config:/etc/dfe/apps:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vrl-filebeat
  # A SECOND instance of the same image, for the filebeat source alone. The
  # Kubernetes tier deploys one transform per source and this is that shape on
  # one box: the receiver routes _source=filebeat to filebeat_land, this
  # instance is the only consumer of it, and its output topic names the table
  # dfe-loader writes. Adding another source means another block like this
  # one, its own config and its own program directory -- nothing here is shared
  # with the passthrough instance except the image.
  # ===========================================================================

  dfe-transform-vrl-filebeat:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VRL_VERSION}
    container_name: dfe-transform-vrl-filebeat
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: *stop-grace-app
    deploy: *limits-service
    ports:
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_TRANSFORM_VRL_FILEBEAT_PROMETHEUS_PORT:-9097}:9090
    env_file:
      - path: env/transform-vrl-filebeat.env
        required: false
      # The custom keys the engine writes for this app; an up -d applies them,
      # a restart keeps the environment the container already has.
      - path: env/dfe-transform-vrl-filebeat.custom.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-transform-vrl-filebeat
    depends_on:
      # No dlq-init here: this service does not mount dlq-spool.
      # The topic authority: dfe-engine creates the declared topic set at its own
      # startup, so a transform started first subscribes to nothing.
      # `required: false` for the tiers that run no engine.
      dfe-engine:
        condition: service_healthy
        required: false
    volumes:
      - ./config/${DFE_TRANSFORM_VRL_FILEBEAT_CONFIG:-transform-vrl/filebeat.yaml}:/etc/dfe-transform-vrl/config.yaml:ro
      - ./config/transform-vrl/transforms-filebeat:/etc/dfe-transform-vrl/transforms:ro
      # Enrichment tables mount beside the program directory, never inside it.
      - ./config/transform-vrl/data:/etc/dfe-transform-vrl/data:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-engine
  # dfe-schemas rides INSIDE this image: /app/schemas is baked into dfe-engine
  # (pinned by DFE_ENGINE_VERSION) and seeds the dfe-engine-schemas named volume
  # on first run; the engine auto-creates the CH objects at startup. So a pinned
  # stack needs no separate dfe-schemas docker pin -- DFE_ENGINE_VERSION covers it.
  # ===========================================================================

  dfe-engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: dfe-engine
    profiles: ["core"]
    restart: unless-stopped
    deploy: *limits-service
    # The engine runs as UID 1000 and ./env belongs to the operator, so it writes
    # there through the operator's group; `make` exports DFE_DEV_GID.
    group_add:
      - "${DFE_DEV_GID:-1000}"
    ports:
      # dfe-proxy reaches the engine over the docker network; this host mapping
      # is for direct API work. PRODUCT class -- it is the API the UI consumes --
      # so it binds DFE_UI_BIND_HOST and only DFE_ENGINE_API_EXTERNAL=false takes
      # it dark, never the infra kill switch.
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_ENGINE_PORT:-8003}:8000
    env_file:
      - path: env/engine.env
        required: false
    environment:
      # The engine refuses to start at `production` without real auth, which is
      # what an unset DFE_ENV should get: `make init` mints a password, so the
      # refusal only ever catches a stack that has no credential to speak of.
      # `make dev` writes DFE_ENV=dev for a tyre-kick that logs in on the shipped
      # default. docs/operating.md#there-is-no-authentication
      DFE_ENV: ${DFE_ENV:-production}
      # The unauthenticated /api/e2e seeding routes the dfe-ui Playwright suite
      # drives. The engine refuses them in a production posture; `make e2e-posture`
      # turns them on beside DFE_ENV=test.
      DFE_E2E_SERVER: ${DFE_E2E_SERVER:-false}
      # A Compose stack is one operator with no forge: a hunt or rule written at
      # production+team lands on a review branch nothing can merge, and the
      # engine then 404s on the object it just accepted. solo commits to main.
      DFE_GITOPS_MODE: ${DFE_GITOPS_MODE:-solo}
      # Names the fetch command the engine puts on the login page: `make creds`.
      DFE_DEPLOYMENT_TARGET: docker
      # The tier this stack runs, by the manifest's name: the engine seeds the
      # profile's default app instances from it and reports it as its profile.
      DFE_PROFILE: ${DFE_STACK_PROFILE:-docker-slim}
      # The certified stack `make stack` pinned this deployment from. Compose has
      # no deploy repo for the engine to read pins out of, so this is the only
      # thing /system/deployment can tell the console footer.
      DFE_STACK_VERSION: ${DFE_STACK_VERSION:-}
      # The console version /system/version reports. resolve_profile strips the
      # digest off the ui pin, because a container reference is not a version.
      DFE_UI_VERSION: ${DFE_UI_VERSION_TAG:-}
      # The transport the tier's stages are bound to (resolve_profile exports it
      # from the profile); the defaults are the slim tier's.
      DFE_TRANSPORT_DEFAULT: ${DFE_TRANSPORT_DEFAULT:-direct}
      DFE_TRANSPORT_BUS_PRESENT: ${DFE_TRANSPORT_BUS_PRESENT:-false}
      # The broker the engine creates a source's topics on: the in-stack one on a
      # kafka tier unless .env names another, and nothing on a direct tier.
      DFE_KAFKA_BOOTSTRAP_SERVERS: ${DFE_KAFKA_BOOTSTRAP_SERVERS:-}
      # The everyday admin, reasserted from .env on every boot. The engine refuses
      # to start on an empty or "changeme" value unless DFE_ENV is a dev posture.
      DFE_AUTH_LOCAL_ADMIN_NAME: ${DFE_AUTH_LOCAL_ADMIN_NAME:-admin}
      DFE_AUTH_LOCAL_ADMIN_PASSWORD: ${DFE_AUTH_LOCAL_ADMIN_PASSWORD:-}
      # The recovery admin. Mint-once: the engine hashes it into the deploy repo
      # on the first boot with no hash committed, and ignores it from then on.
      DFE_AUTH_BREAKGLASS_PASSWORD: ${DFE_AUTH_BREAKGLASS_PASSWORD:-}
      # Keys the OIDC session cookie. The engine ships a known placeholder and
      # refuses to start on it outside a dev posture, the same as the admin
      # password above, so `make init` mints this one too.
      DFE_API_JWT_SECRET: ${DFE_API_JWT_SECRET:-}
      # The deploy repo the break-glass hash and the governance settings live in.
      # Local-only here: no repo_url, so nothing is pushed anywhere. It sits inside
      # the config volume because a volume mounted on a path the image does not own
      # lands root-owned and the engine runs as UID 1000.
      DFE_GITOPS_ENABLED: ${DFE_GITOPS_ENABLED:-true}
      DFE_GITOPS_LOCAL_PATH: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/deploy-repo
      # HyperDX's control surface: the engine confirms the fork's default team and
      # seeds its connections and sources. Both follow the resolved footprint
      # (scripts/resolve_profile.py), so one DFE_HYPERDX_ENABLED governs the
      # HyperDX containers and the engine that drives them.
      DFE_HYPERDX_ENABLED: ${DFE_HYPERDX_RESOLVED:-false}
      DFE_HYPERDX_BASE_URL: ${DFE_HYPERDX_RESOLVED_BASE_URL:-}
      DFE_CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      DFE_CLICKHOUSE_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      DFE_CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:-9000}
      DFE_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-default}
      DFE_CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      DFE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      DFE_CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      # Default TTL for every time-series table; 0 = none; a source or a
      # dfe-schemas TTL overrides it.
      DFE_CLICKHOUSE_DEFAULT_TTL_DAYS: ${DFE_CLICKHOUSE_DEFAULT_TTL_DAYS:-90}
      # Where the engine renders each app's own config, which is the Compose
      # stand-in for the ConfigMap an app's chart renders on Kubernetes. Empty
      # turns the writer off, which is every tier whose apps read a committed
      # config instead. The apps mount the same volume read-only, at their own
      # path, which is what the MOUNT value names.
      DFE_DEPLOYMENT_APP_CONFIG_DIR: ${DFE_ENGINE_APP_CONFIG_DIR:-}
      DFE_DEPLOYMENT_APP_CONFIG_BASE_DIR: ${DFE_ENGINE_APP_CONFIG_BASE_DIR:-}
      DFE_DEPLOYMENT_APP_CONFIG_MOUNT: ${DFE_APP_CONFIG_MOUNT:-/etc/dfe/apps}
      DFE_CONFIG_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}
      # Onto the config VOLUME, because the engine mints its ES384 JWT signing
      # key here on first use: left on the container filesystem it is remade on
      # every recreate, and every session issued before it stops verifying.
      DFE_SECRETS_PATH: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/.secrets
      DFE_SCHEMAS_DIR: ${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
      # Content another repo ships (transform templates, a source catalogue); the
      # engine seeds its library from it at startup. Nothing writes it on Compose
      # yet -- the contract one-shots fill the sibling directory, not this one --
      # and an empty directory is a no-op.
      DFE_LIBRARY_SEED_DIR: ${DFE_ENGINE_CONTENT_DIR:-/app/content}/library
      # Where the contract one-shots write, one directory per app, on the same
      # volume. resolve_profile.py sets it EMPTY on a tier the engine renders no
      # app config for; unset (compose run without make) keeps the volume's path.
      DFE_APP_CONTRACT_DIR: ${DFE_ENGINE_CONTRACT_DIR-${DFE_ENGINE_CONTENT_DIR:-/app/content}/contract}
      # Where the engine writes env/<service>.custom.env, one per compose service
      # (a per-source instance included), the sibling of the app config
      # directory above. A literal, because it names the bind mount below
      # and the two have to stay the same path -- and that path is the host tree,
      # so a write here changes the operator's checkout.
      DFE_DEPLOYMENT_APP_ENV_DIR: /app/app-env
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-engine
      # scalo's CLI falls back to the prometheus backend, so the endpoint alone
      # exports nothing. `opentelemetry` is dual -- OTLP push AND /metrics.
      DFE_API_METRICS_BACKEND: ${DFE_ENGINE_METRICS_BACKEND:-prometheus}
    volumes:
      - dfe-engine-config:${DFE_ENGINE_CONFIG_DIR:-/app/config}
      - dfe-engine-schemas:${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
      - dfe-engine-content:${DFE_ENGINE_CONTENT_DIR:-/app/content}
      # The only writer of this volume; every app mounts it read-only.
      - dfe-app-config:/app/app-config
      # The per-service env files, READ-WRITE: the engine writes a service's custom
      # keys to env/<service>.custom.env, and compose reads env_file off the host
      # tree rather than a volume. It is the operator's checkout being written.
      - ./env:/app/app-env
      # Each app's base config, as THIS tier committed it. The instance overlay
      # is merged over it, so the broker, the warehouse credentials and the spool
      # stay with the deployment rather than being written into the deploy repo.
      - ./config/${DFE_ARCHIVER_CONFIG:-archiver/kafka.yaml}:/app/app-config-base/dfe-archiver.yaml:ro
      - ./config/${DFE_FETCHER_CONFIG:-fetcher/kafka.yaml}:/app/app-config-base/dfe-fetcher.yaml:ro
      - ./config/${DFE_LOADER_CONFIG:-loader/kafka.yaml}:/app/app-config-base/dfe-loader.yaml:ro
      - ./config/${DFE_RECEIVER_CONFIG:-receiver/kafka.yaml}:/app/app-config-base/dfe-receiver.yaml:ro
      - ./config/${DFE_TRANSFORM_ELASTIC_CONFIG:-transform-elastic/kafka.yaml}:/app/app-config-base/dfe-transform-elastic.yaml:ro
      - ./config/${DFE_TRANSFORM_VRL_CONFIG:-transform-vrl/kafka.yaml}:/app/app-config-base/dfe-transform-vrl.yaml:ro
      - ./config/${DFE_TRANSFORM_VECTOR_CONFIG:-transform-vector/kafka.yaml}:/app/app-config-base/dfe-transform-vector.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      # The engine creates the declared bootstrap topics at its own startup, so
      # it is the only service that needs the broker before it runs. One of the
      # two is enabled by compose profile and the other is absent, which is what
      # `required: false` is for -- as is the grpc tier, which runs neither.
      # This edge is also what pulls the broker up at all: it is not in
      # ACTIVE_SERVICES, so it starts as somebody's dependency or not at all.
      kafka-redpanda:
        condition: service_healthy
        required: false
      kafka-apache:
        condition: service_healthy
        required: false
      # Each app's contract, emitted before the engine reads it. `required:
      # false` for the tiers that run no such app, and a FAILED emit only warns.
      contract-dfe-archiver:
        condition: service_completed_successfully
        required: false
      contract-dfe-fetcher:
        condition: service_completed_successfully
        required: false
      contract-dfe-loader:
        condition: service_completed_successfully
        required: false
      contract-dfe-receiver:
        condition: service_completed_successfully
        required: false
      contract-dfe-transform-vector:
        condition: service_completed_successfully
        required: false
      contract-dfe-transform-vrl:
        condition: service_completed_successfully
        required: false
    working_dir: /home/appuser
    healthcheck:
      # Readiness, same reasoning as the header: depends_on gates on it.
      test: ["CMD", "curl", "-sf", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # ===========================================================================
  # dfe-hunt-runner -- the pull-based hunt executor (engine image, own process).
  # One instance per stack, the same shape the Kubernetes chart runs. It reads
  # the hunt and rule YAML the engine governs off the engine's config volume,
  # so a hunt created through the UI is picked up on the next poll.
  # ===========================================================================

  dfe-hunt-runner:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: dfe-hunt-runner
    profiles: ["core"]
    restart: unless-stopped
    deploy: *limits-service
    # The image's entrypoint is the engine CLI; the runner is its own console script.
    entrypoint: ["dfe-hunt-runner"]
    # --reload-every 1 is what makes "picked up on the next poll" true: the default
    # re-reads the hunt dir every 20 ticks, which is five minutes at this poll.
    command: ["run", "--poll", "15", "--cap", "8", "--reload-every", "1"]
    env_file:
      - path: env/engine.env
        required: false
    environment:
      DFE_ENV: ${DFE_ENV:-production}
      # The runner builds the same DFESettings the API does, so it hits the same
      # start-up refusal without this.
      DFE_API_JWT_SECRET: ${DFE_API_JWT_SECRET:-}
      DFE_CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      DFE_CLICKHOUSE_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      DFE_CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:-9000}
      DFE_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-default}
      DFE_CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      DFE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      DFE_CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      DFE_CONFIG_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}
      # Same volume as the API's, so both read the one signing key.
      DFE_SECRETS_PATH: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/.secrets
      # The engine governs hunts and rules in the deploy repo it clones into the
      # shared config volume, so the runner reads that working tree; a runner
      # pointed at the bare config dir polls a directory nothing writes.
      DFE_HUNTS_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/deploy-repo/config/hunts
      DFE_HUNTS_RULES_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}/deploy-repo/config/rules
      DFE_SCHEMAS_DIR: ${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-hunt-runner
    volumes:
      - dfe-engine-config:${DFE_ENGINE_CONFIG_DIR:-/app/config}
      - dfe-engine-schemas:${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
    depends_on:
      dfe-engine:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
        required: false
    # The runner has no HTTP listener, so the engine image's HEALTHCHECK (:9090/livez)
    # can never pass here. Liveness is the ClickHouse lease the runner renews.
    healthcheck:
      disable: true
    working_dir: /home/appuser

  # ===========================================================================
  # dfe-ui
  # ===========================================================================

  dfe-ui:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-ui:${DFE_UI_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_UI_VERSION}
    container_name: dfe-ui
    profiles: ["core"]
    restart: unless-stopped
    deploy: *limits-service
    env_file:
      - path: env/ui.env
        required: false
    environment:
      HYPERDX_PORT: ${DFE_HYPERDX_EMBED_PORT:-8091}
      NODE_ENV: ${DFE_UI_NODE_ENV:-production}
      # `make init` generates this. NOT a `:?` hard-fail -- that would abort even
      # `make down` for everyone. The sentinel is what makes a missing one loud.
      NEXTAUTH_SECRET: ${DFE_UI_NEXTAUTH_SECRET:-RUN-make-init-TO-GENERATE-A-REAL-SECRET}
      # Every absolute URL next-auth builds, the post-logout redirect included.
      # Unset, it resolves to a hardcoded http://localhost:3000 and every logout
      # leaves the origin the browser arrived on -- so this always carries a
      # value, and DFE_EXTERNAL_ORIGIN is what an operator moves.
      NEXTAUTH_URL: ${DFE_EXTERNAL_ORIGIN:-http://localhost}:${DFE_UI_PORT:-3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
      OTEL_SERVICE_NAME: dfe-ui
    healthcheck:
      # The image ships no curl; node's own fetch does it. `/livez` is a real
      # endpoint here -- an unknown path returns the 200 app shell, so probing
      # `/` proved only that Node was listening.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/livez').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # ===========================================================================
  # dfe-proxy
  #
  # THE product entrypoint. Its oauth2/jwt_authn filters chain in when dfe-engine
  # becomes the OIDC provider -- opt-in, scoped to this origin, and no profile may
  # require an issuer to start. docs/operating.md#there-is-no-authentication
  # ===========================================================================

  dfe-proxy:
    image: envoyproxy/envoy:${DFE_PROXY_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_PROXY_VERSION}
    container_name: dfe-proxy
    profiles: ["core"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      # The DFE UI -- this is the one users reach. PRODUCT class: it binds
      # DFE_UI_BIND_HOST (the DFE_BIND_SCOPE dial) and the infra kill switch
      # never covers it, so only DFE_UI_EXTERNAL=false takes it dark.
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_UI_PORT:-3000}:8080
      # HyperDX, re-served with frame-ancestors rewritten so the UI can iframe
      # it. The app's own port stays infra class on the hyperdx service.
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_EMBED_PORT:-8091}:8091
    environment:
      # Every origin the console may be framed from, space-separated for the
      # frame-ancestors source list in config/proxy/envoy.yaml. An operator on the
      # box reads the console on loopback whatever the deployment publishes it as,
      # so both loopback forms stay in the list alongside the external origin. A
      # repeated entry is inert -- a source list is a set.
      DFE_HYPERDX_EMBED_ANCESTOR: http://localhost:${DFE_UI_PORT:-3000} http://127.0.0.1:${DFE_UI_PORT:-3000} ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_UI_PORT:-3000}
    volumes:
      - ./config/proxy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      dfe-ui:
        condition: service_healthy
        required: false
      dfe-engine:
        condition: service_healthy
        required: false
    healthcheck:
      # The image ships no curl/wget; drive the local admin /ready over
      # bash's /dev/tcp (admin binds 127.0.0.1 only, never published).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # ===========================================================================
  # otel-collector
  # The stack's own telemetry, opt-in via DFE_OTEL_ENABLED. Its OTLP ports are
  # NOT published: self-monitoring stays on the compose network, and 4317/4318
  # on the host belong to dfe-receiver's ingest. docs/operating.md#self-monitoring
  # ===========================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${DFE_OTEL_COLLECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_OTEL_COLLECTOR_VERSION}
    container_name: dfe-otel-collector
    profiles: ["otel"]
    restart: unless-stopped
    deploy: *limits-sidecar
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      # The health_check extension. Operator surface, and the only way in: the
      # image is distroless, so a HEALTHCHECK has no client to probe it with.
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_OTEL_HEALTH_PORT:-13133}:13133
      # Container stdout, in. Published because the DOCKER DAEMON connects to it,
      # and the daemon is on the host rather than on the compose network.
      - ${DFE_BIND_HOST:-127.0.0.1}:${DFE_OTEL_FLUENT_PORT:-24224}:24224
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:-9000}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      DFE_OTEL_DATABASE: ${DFE_OTEL_DATABASE:-dfe}
      DFE_OTEL_COLLECTOR_LOG_LEVEL: ${DFE_OTEL_COLLECTOR_LOG_LEVEL:-warn}
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      # The exporter runs with create_schema=false, so the otel tables have to
      # exist before it sends its first batch. dfe-engine applies them at its own
      # startup and reports healthy only once that pass converged.
      dfe-engine:
        condition: service_healthy
        required: false
    # No HEALTHCHECK: the image is distroless (no shell, no curl, no wget), so
    # there is nothing in it to probe :13133 with. Nothing gates on the
    # collector, so an always-passing probe would only look like cover.

  # ===========================================================================
  # HyperDX (observability UI)
  # Opt-in via DFE_HYPERDX_ENABLED
  # ===========================================================================

  # dfe-engine is the SSoT for the dashboard CONTENT; this copies it out of the
  # engine image into a volume HyperDX's own provisioner reads, so there is one
  # copy of a dashboard in the product and bumping the engine pin ships new ones.
  # The k8s hyperdx chart runs the identical command as an init container.
  dfe-dashboards:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: dfe-dashboards
    profiles: ["hyperdx"]
    deploy: *limits-sidecar
    # A fresh named volume mounted at a path the image does not create is owned by
    # root, and the engine image runs as uid 1000 -- so this one-shot writes as
    # root. It reaches no network and no host path, and exits after seven files.
    user: "0:0"
    # Overriding the entrypoint bypasses `dfe-engine run`, so no config, no
    # secrets store and no database is touched.
    entrypoint: ["python"]
    command: ["-m", "dfe_engine.hyperdx.dashboards", "--out", "/etc/hyperdx/dashboards"]
    volumes:
      - hyperdx-dashboards:/etc/hyperdx/dashboards
    restart: "no"

  hyperdx-postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:${HYPERDX_POSTGRES_VERSION:?run 'make stack VERSION=X.Y.Z' to pin HYPERDX_POSTGRES_VERSION}
    container_name: dfe-hyperdx-postgres
    profiles: ["hyperdx"]
    restart: unless-stopped
    deploy: *limits-service
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${HYPERDX_POSTGRES_USER:-hyperdx}
      # `make init` generates this. Not a `:?` hard-fail -- see NEXTAUTH_SECRET.
      POSTGRES_PASSWORD: ${HYPERDX_POSTGRES_PASSWORD:-hyperdx}
    volumes:
      - hyperdx-pg-data:/var/lib/postgresql/data
    healthcheck:
      # -d names the real database: without it libpq dials one named after the user.
      test: ["CMD-SHELL", "pg_isready -U ${HYPERDX_POSTGRES_USER:-hyperdx} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  hyperdx-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:${HYPERDX_FERRETDB_VERSION:?run 'make stack VERSION=X.Y.Z' to pin HYPERDX_FERRETDB_VERSION}
    container_name: dfe-hyperdx-ferretdb
    profiles: ["hyperdx"]
    restart: unless-stopped
    deploy: *limits-service
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${HYPERDX_POSTGRES_USER:-hyperdx}:${HYPERDX_POSTGRES_PASSWORD:-hyperdx}@hyperdx-postgres:5432/postgres
    depends_on:
      hyperdx-postgres:
        condition: service_healthy
    healthcheck:
      # Distroless, so no CMD-SHELL and no HTTP probe. `ping` dials the wire
      # listener. The image declares this too -- we only retune its 60s/1-retry
      # timings, which are far too slow to gate startup on.
      test: ["CMD", "/ferretdb", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  hyperdx:
    # Pinned from the stack SSoT like every other image: the fork now publishes,
    # so `make stack` renders DFE_HYPERDX_VERSION from versions.yaml
    # (content.dfe-hyperdx). Fail-loud `:?` -- no floating `latest`.
    # Same image name the k8s chart pulls; ghcr.io/hyperi-io/hyperi-hyperdx does not exist.
    # Digest-pinned like the rest: versions.yaml carries digests.dfe-hyperdx, which
    # the render appends as tag@sha256.
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-hyperdx:${DFE_HYPERDX_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_HYPERDX_VERSION}
    container_name: dfe-hyperdx
    profiles: ["hyperdx"]
    restart: unless-stopped
    deploy: *limits-service
    # No published ports: dfe-hyperdx-proxy carries both origins, so the infra
    # exposure dials and the `auth` profile govern one service.
    env_file:
      - path: env/hyperdx.env
        required: false
    environment:
      # Seeded server-side onto each team as it is created (setupTeamDefaults), so
      # connections, sources, dashboards and saved searches live in FerretDB and
      # survive a browser change. Host resolves in-container -- queries go through
      # HyperDX's own /clickhouse-proxy, so the credential never leaves the stack.
      # The name must be `platform`: the shipped dashboards reference their
      # connection by that name and are skipped for a team that has no match.
      # 8123 is the container port and a constant; CLICKHOUSE_HTTP_PORT is the
      # host binding, so dialling it in-network breaks a moved port (#32).
      DEFAULT_CONNECTIONS: '[{"name":"platform","host":"http://clickhouse:8123","username":"${CLICKHOUSE_USERNAME:-default}","password":"${CLICKHOUSE_PASSWORD:-}"}]'
      DEFAULT_SOURCES_FILE: /etc/hyperdx/default-sources.json
      # The engine is the issuer here as it is on Kubernetes: HyperDX verifies its
      # ES384 token against the engine's JWKS, taking it from a Bearer header or
      # the dfe_token cookie the console mirrors. DFE_HYPERDX_AUTH_MODE=header-dev
      # runs it off request headers instead, for a stack with no engine.
      DFE_AUTH_MODE: ${DFE_HYPERDX_AUTH_MODE:-oidc-proxy}
      DFE_ENGINE_JWKS_URL: ${DFE_ENGINE_JWKS_URL:-http://dfe-engine:8000/.well-known/jwks.json}
      # The team a token carrying no group claim lands in.
      DFE_AUTH_DEFAULT_TEAM: ${DFE_HYPERDX_TEAM:-dfe}
      # Setting the directory is what starts the provisioner: entry.prod.sh
      # launches the provision-dashboards task only when it is present. It then
      # re-runs on a one-minute cron, which is how a team created after startup
      # still gets its dashboards.
      DASHBOARD_PROVISIONER_DIR: /etc/hyperdx/dashboards
      DASHBOARD_PROVISIONER_ALL_TEAMS: "true"
      # Skip a dashboard whose source the team does not hold, rather than writing
      # it with dead tiles.
      DASHBOARD_PROVISIONER_REQUIRE_REFS: "true"
      HYPERDX_API_PORT: 8000
      # Container ports, both constants, because dfe-proxy dials them by name on
      # the compose network. DFE_HYPERDX_APP_PORT is the HOST binding only, so
      # moving it no longer moves the port the proxy has to find (#32).
      HYPERDX_APP_PORT: 8090
      HYPERDX_APP_URL: ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}
      FRONTEND_URL: ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_HYPERDX_APP_PORT:-8090}
      # Link-back origin so the embedded HyperDX opens a created rule in the DFE
      # UI (served by dfe-proxy on DFE_UI_PORT), not the HyperDX origin. Matches
      # the k8s hyperdx chart. next-runtime-env reads it per request.
      NEXT_PUBLIC_DFE_UI_BASE_URL: ${DFE_HYPERDX_APP_URL:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_UI_PORT:-3000}
      # HyperDX talks Mongo wire protocol; FerretDB serves it over Postgres.
      MONGO_URI: mongodb://${HYPERDX_POSTGRES_USER:-hyperdx}:${HYPERDX_POSTGRES_PASSWORD:-hyperdx}@hyperdx-ferretdb:27017/hyperdx?authSource=admin
      NEXT_PUBLIC_THEME: ${HYPERDX_THEME:-dfe}
    volumes:
      - ./config/hyperdx/default-sources.json:/etc/hyperdx/default-sources.json:ro
      - hyperdx-dashboards:/etc/hyperdx/dashboards:ro
    depends_on:
      hyperdx-ferretdb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
        required: false
      # The provisioner reads the directory on startup, so the engine has to have
      # written it first. Not `required` -- a stack without the engine image still
      # starts HyperDX, it just provisions nothing.
      dfe-dashboards:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # HyperDX's edge. It carries the two HyperDX host ports (config/proxy/hyperdx.yaml)
  # so that one service answers to the infra exposure dials and the `auth` profile.
  dfe-hyperdx-proxy:
    image: envoyproxy/envoy:${DFE_PROXY_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_PROXY_VERSION}
    container_name: dfe-hyperdx-proxy
    profiles: ["hyperdx"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      # INFRA class, both origins: DFE_INFRA_UIS_EXTERNAL=false unpublishes them.
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_APP_PORT:-8090}:8090
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_API_PORT:-8000}:8000
    volumes:
      - ./config/proxy/hyperdx.yaml:/etc/envoy/envoy.yaml:ro
    healthcheck:
      # The image ships no curl/wget; drive the local admin /ready over
      # bash's /dev/tcp (admin binds 127.0.0.1 only, never published).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # ===========================================================================
  # oauth2-proxy -- edge OIDC + group check for the INFRA UIs
  #
  # The docker half of the dual-mode auth seam: k8s gates infra routes at the
  # Envoy edge, compose has no Gateway, so each infra UI gets a proxy in front
  # of it. OFF by default and behind its own `auth` profile, because no dfe-docker
  # profile may require an OIDC issuer to exist.
  #
  # With the profile armed the Makefile chains the kafbat and hyperdx unpublish
  # fragments, so those UIs stop reaching the host directly and these take over
  # their ports -- same port numbers, a gate in front. Turn the infra class off
  # and the PROXIES go dark with the UIs: a gated door is still a door.
  #
  # It gates PAGE ACCESS ONLY. Neither UI learns who signed in, and neither has
  # a session of its own. docs/operating.md#gating-the-infra-uis-with-oidc
  # ===========================================================================

  oauth2-proxy-kafbat:
    image: quay.io/oauth2-proxy/oauth2-proxy:${DFE_OAUTH2_PROXY_VERSION:-v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded}
    container_name: dfe-oauth2-proxy-kafbat
    profiles: ["auth"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${KAFBAT_PORT:-8081}:4180
    environment:
      <<: *oauth2-proxy-env
      OAUTH2_PROXY_UPSTREAMS: http://kafka-ui:8080
      OAUTH2_PROXY_REDIRECT_URL: ${DFE_OAUTH2_PROXY_EXTERNAL_ORIGIN:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${KAFBAT_PORT:-8081}/oauth2/callback
    depends_on:
      kafka-ui:
        condition: service_started
        required: false

  oauth2-proxy-hyperdx:
    image: quay.io/oauth2-proxy/oauth2-proxy:${DFE_OAUTH2_PROXY_VERSION:-v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded}
    container_name: dfe-oauth2-proxy-hyperdx
    profiles: ["auth"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_APP_PORT:-8090}:4180
    environment:
      <<: *oauth2-proxy-env
      # dfe-hyperdx-proxy, not hyperdx: HyperDX takes its identity from the headers
      # that proxy injects, so a gate in front of anything else reaches it
      # unidentified.
      OAUTH2_PROXY_UPSTREAMS: http://dfe-hyperdx-proxy:8090
      OAUTH2_PROXY_REDIRECT_URL: ${DFE_OAUTH2_PROXY_EXTERNAL_ORIGIN:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_HYPERDX_APP_PORT:-8090}/oauth2/callback
    depends_on:
      hyperdx:
        condition: service_healthy
        required: false

  # The SECOND HyperDX origin, and an OPERATOR one: the browser calls the API at
  # a relative /api/* under the app, which the Next.js server proxies on container
  # loopback, so nothing in the page depends on this port. It is gated all the
  # same because the API answers the same questions the app does. One oauth2-proxy
  # serves exactly one --http-address, hence a second service. Same cookie secret
  # and name as the app proxy above, and cookies are not port-scoped, so signing
  # in at the app authorises this one too.
  oauth2-proxy-hyperdx-api:
    image: quay.io/oauth2-proxy/oauth2-proxy:${DFE_OAUTH2_PROXY_VERSION:-v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded}
    container_name: dfe-oauth2-proxy-hyperdx-api
    profiles: ["auth"]
    restart: unless-stopped
    deploy: *limits-sidecar
    ports:
      - ${DFE_UI_BIND_HOST:-127.0.0.1}:${DFE_HYPERDX_API_PORT:-8000}:4180
    environment:
      <<: *oauth2-proxy-env
      OAUTH2_PROXY_UPSTREAMS: http://dfe-hyperdx-proxy:8000
      OAUTH2_PROXY_REDIRECT_URL: ${DFE_OAUTH2_PROXY_EXTERNAL_ORIGIN:-${DFE_EXTERNAL_ORIGIN:-http://localhost}}:${DFE_HYPERDX_API_PORT:-8000}/oauth2/callback
      # Host header and every upstream response header pass through untouched
      # (--pass-host-header defaults true), so HyperDX's own CORS headers reach
      # the browser exactly as the API sent them.
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"
    depends_on:
      hyperdx:
        condition: service_healthy
        required: false

volumes:
  clickhouse-data:
  kafka-redpanda-data:
  kafka-apache-data:
  archiver-data:
  dlq-spool:
  dfe-engine-config:
  dfe-engine-schemas:
  dfe-engine-content:
  # What the engine renders each app's own config into, one directory per app.
  # Its own volume rather than a corner of dfe-engine-config, which also holds
  # the engine's JWT signing key and the deploy repo -- neither of which a
  # data-plane container has any business reading.
  dfe-app-config:
  hyperdx-dashboards:
  hyperdx-pg-data:
