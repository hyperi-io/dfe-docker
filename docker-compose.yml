# Project:   dfe-docker
# File:      docker-compose.yml
# Purpose:   DFE 2.2 Docker Compose stack
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Profile        | Services                   | Notes                                      |
# ---------------|----------------------------|--------------------------------------------|
# clickhouse     | clickhouse                 |                                            |
# kafka-redpanda | kafka-redpanda, kafka-init | Redpanda (default); fits 4 GB CI runners   |
# kafka-apache   | kafka-apache, kafka-init   | Apache Kafka (opt-in); compat + safety net |
# ui             | kafka-ui                   |                                            |
#
# The kafka-* profiles are mutually exclusive. All expose the network alias `kafka` on the same host ports, so only one can be active at a time.
# Downstream services and configs always address `kafka:9092` and work with either backend.
#
# DFE services have no profile and are started by name. Which ones run is controlled by service_profiles.yaml at the repo root. Config paths are also set there.
#
# Quick start:
#   make dev                         # Uses active_profile from service_profiles.yaml
#   DFE_PROFILE=grpc-full make dev   # Override profile
#   KAFKA_BACKEND=apache make dev    # Override Kafka backend
#
# Dev build from source (requires docker-compose.override.yml - auto-loaded):
#   make dev
#
# CI / registry images only (skip override):
#   docker compose -f docker-compose.yml --profile clickhouse --profile kafka-redpanda up -d dfe-loader

services:

  # ===========================================================================
  # ClickHouse
  # Set CLICKHOUSE_HOST in .env to use an external instance.
  # ===========================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin CLICKHOUSE_VERSION}
    container_name: dfe-clickhouse
    profiles: ["clickhouse"]
    ports:
      - ${CLICKHOUSE_HTTP_PORT:-8123}:8123
      - ${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/default-user.xml:/etc/clickhouse-server/users.d/default-custom.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1 FROM system.databases WHERE name = '\"$$CLICKHOUSE_DB\"'\""]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ===========================================================================
  # Kafka (Redpanda)
  # Default Kafka-API broker (mutually exclusive with other kafka-* services)
  # ===========================================================================

  kafka-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:?run 'make stack VERSION=X.Y.Z' to pin REDPANDA_VERSION}
    container_name: dfe-kafka-redpanda
    profiles: ["kafka-redpanda"]
    networks:
      default:
        aliases:
          - kafka
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=${REDPANDA_MEMORY:-1G}
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
    ports:
      - ${KAFKA_PLAINTEXT_PORT:-9092}:9092
      - ${KAFKA_PLAINTEXT_HOST_PORT:-19092}:19092
    volumes:
      - kafka-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # Apache Kafka
  # Opt-in Kafka alternative (mutually exclusive with other kafka-* services)
  # ===========================================================================

  kafka-apache:
    image: apache/kafka:${APACHE_KAFKA_VERSION:?run 'make stack VERSION=X.Y.Z' to pin APACHE_KAFKA_VERSION}
    container_name: dfe-kafka-apache
    profiles: ["kafka-apache"]
    networks:
      default:
        aliases:
          - kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-dfe-docker-dev-cluster-01}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:29092}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:29092}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
    ports:
      - ${KAFKA_PLAINTEXT_PORT:-9092}:9092
      - ${KAFKA_PLAINTEXT_HOST_PORT:-19092}:19092
    volumes:
      - kafka-apache-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # Kafka Init
  # Pre-creates default topics so consumers don't fail on an empty broker.
  # ===========================================================================

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:?run 'make stack VERSION=X.Y.Z' to pin REDPANDA_VERSION}
    container_name: dfe-kafka-init
    profiles: ["kafka-apache", "kafka-redpanda"]
    depends_on:
      kafka-apache:
        condition: service_healthy
        required: false
      kafka-redpanda:
        condition: service_healthy
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          rpk topic describe default_land -X brokers=kafka:9092 >/dev/null 2>&1 && exit 0
          rpk topic create default_land --partitions 1 --replicas 1 -X brokers=kafka:9092 2>&1 || true
          sleep 1
        done
        echo "FAILED: default_land topic not created after 30s" >&2
        exit 1
    restart: "no"

  # ===========================================================================
  # Kafka UI
  # Opt-in UI for Kafka cluster.
  # ===========================================================================

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFBAT_VERSION:?run 'make stack VERSION=X.Y.Z' to pin KAFBAT_VERSION}
    container_name: dfe-kafka-ui
    profiles: ["kafka-ui"]
    ports:
      - ${KAFBAT_PORT:-8081}:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: ${KAFBAT_DYNAMIC_CONFIG_ENABLED:-true}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFBAT_KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS:-kafka:9092}
      KAFKA_CLUSTERS_0_NAME: ${KAFBAT_KAFKA_CLUSTERS_0_NAME:-dfe-local}

  # ===========================================================================
  # dfe-archiver
  # Only supports Kafka input transport.
  # ===========================================================================

  dfe-archiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-archiver:${DFE_ARCHIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ARCHIVER_VERSION}
    container_name: dfe-archiver
    profiles: ["dfe"]
    ports:
      - ${DFE_ARCHIVER_PROMETHEUS_PORT:-9093}:9090
    env_file:
      - path: env/archiver.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
        required: false
    working_dir: /home/appuser
    volumes:
      - ./config/${DFE_ARCHIVER_CONFIG:-archiver/kafka.yaml}:/etc/dfe/archiver.yaml:ro
      - archiver-data:/var/data/archive
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-fetcher
  # ===========================================================================

  dfe-fetcher:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-fetcher:${DFE_FETCHER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_FETCHER_VERSION}
    container_name: dfe-fetcher
    profiles: ["dfe"]
    ports:
      - ${DFE_FETCHER_INGEST_PORT:-8082}:8080
      - ${DFE_FETCHER_PROMETHEUS_PORT:-9094}:9090
    env_file:
      - path: env/fetcher.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      dfe-loader:
        condition: service_healthy
        required: false
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_FETCHER_CONFIG:-fetcher/aws-kafka.yaml}:/etc/dfe/fetcher.yaml:ro
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-loader
  # Defined before dfe-receiver so receiver can depend_on loader (gRPC path).
  # ===========================================================================

  dfe-loader:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-loader:${DFE_LOADER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_LOADER_VERSION}
    container_name: dfe-loader
    profiles: ["dfe"]
    ports:
      - ${DFE_LOADER_PROMETHEUS_PORT:-9091}:9090
      - ${DFE_LOADER_GRPC_PORT:-50051}:50051
    env_file:
      - path: env/loader.env
        required: false
    environment:
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_LOADER_CONFIG:-loader/kafka.yaml}:/etc/dfe/loader.yaml:ro
      - dlq-spool:/var/spool/dfe
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-receiver
  # ===========================================================================

  dfe-receiver:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-receiver:${DFE_RECEIVER_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_RECEIVER_VERSION}
    container_name: dfe-receiver
    profiles: ["dfe"]
    ports:
      - ${DFE_RECEIVER_GRPC_PORT:-6000}:6000
      - ${DFE_RECEIVER_HTTP_PORT:-8080}:8080
      - ${DFE_RECEIVER_PROMETHEUS_PORT:-9090}:9090
      # Uncomment to expose additional ingest protocols:
      # - ${DFE_RECEIVER_BEATS_PORT:-5044}:5044
      # - ${DFE_RECEIVER_HEC_PORT:-8088}:8088
      # - ${DFE_RECEIVER_OTLP_GRPC_PORT:-4317}:4317
      # - ${DFE_RECEIVER_OTLP_HTTP_PORT:-4318}:4318
    env_file:
      - path: env/receiver.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      dfe-loader:
        condition: service_healthy
        required: false
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_RECEIVER_CONFIG:-receiver/kafka.yaml}:/etc/dfe-receiver/config.yaml:ro
      - dlq-spool:/var/spool/dfe
      # Uncomment to enable TLS on gRPC inbound (:6000):
      # - ./certs/dev/receiver.crt:/etc/ssl/receiver.crt:ro
      # - ./certs/dev/receiver.key:/etc/ssl/receiver.key:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vector
  # ===========================================================================

  dfe-transform-vector:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vector:${DFE_TRANSFORM_VECTOR_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VECTOR_VERSION}
    container_name: dfe-transform-vector
    profiles: ["dfe"]
    ports:
      - ${DFE_TRANSFORM_VECTOR_PROMETHEUS_PORT:-9095}:9090
      - ${DFE_TRANSFORM_VECTOR_API_PORT:-8686}:8686
    env_file:
      - path: env/transform-vector.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_TRANSFORM_VECTOR_CONFIG:-transform-vector/kafka.yaml}:/etc/dfe-transform-vector/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-transform-vrl
  # ===========================================================================

  dfe-transform-vrl:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-transform-vrl:${DFE_TRANSFORM_VRL_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_TRANSFORM_VRL_VERSION}
    container_name: dfe-transform-vrl
    profiles: ["dfe"]
    ports:
      - ${DFE_TRANSFORM_VRL_PROMETHEUS_PORT:-9096}:9090
    env_file:
      - path: env/transform-vrl.env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./config/${DFE_TRANSFORM_VRL_CONFIG:-transform-vrl/kafka.yaml}:/etc/dfe-transform-vrl/config.yaml:ro
      - ./config/transform-vrl/transforms:/etc/dfe-transform-vrl/transforms:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # dfe-engine
  # dfe-schemas rides INSIDE this image: /app/schemas is baked into dfe-engine
  # (pinned by DFE_ENGINE_VERSION) and seeds the dfe-engine-schemas named volume
  # on first run; the engine auto-creates the CH objects at startup. So a pinned
  # stack needs no separate dfe-schemas docker pin -- DFE_ENGINE_VERSION covers it.
  # ===========================================================================

  dfe-engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-engine:${DFE_ENGINE_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_ENGINE_VERSION}
    container_name: dfe-engine
    profiles: ["core"]
    ports:
      - ${DFE_ENGINE_PORT:-8003}:8000
    env_file:
      - path: env/engine.env
        required: false
    environment:
      DFE_CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      DFE_CLICKHOUSE_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      DFE_CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:-9000}
      DFE_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-default}
      DFE_CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      DFE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      DFE_CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      DFE_CONFIG_DIR: ${DFE_ENGINE_CONFIG_DIR:-/app/config}
      DFE_SCHEMAS_DIR: ${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
    volumes:
      - dfe-engine-config:${DFE_ENGINE_CONFIG_DIR:-/app/config}
      - dfe-engine-schemas:${DFE_ENGINE_SCHEMAS_DIR:-/app/schemas}
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
    working_dir: /home/appuser
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # ===========================================================================
  # dfe-ui
  # ===========================================================================

  dfe-ui:
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/dfe-ui:${DFE_UI_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_UI_VERSION}
    container_name: dfe-ui
    profiles: ["core"]
    env_file:
      - path: env/ui.env
        required: false
    environment:
      HYPERDX_PORT: ${DFE_HYPERDX_APP_PORT:-8090}
      NODE_ENV: ${DFE_UI_NODE_ENV:-production}
      NEXTAUTH_SECRET: ${DFE_UI_NEXTAUTH_SECRET:-secret}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # ===========================================================================
  # dfe-proxy
  # ===========================================================================

  dfe-proxy:
    image: nginx:${DFE_PROXY_VERSION:?run 'make stack VERSION=X.Y.Z' to pin DFE_PROXY_VERSION}
    container_name: dfe-proxy
    profiles: ["core"]
    ports:
      - ${DFE_UI_PORT:-3000}:80
    volumes:
      - ./config/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dfe-ui:
        condition: service_healthy
        required: false
      dfe-engine:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # ===========================================================================
  # HyperDX (observability UI)
  # Opt-in via DFE_HYPERDX_ENABLED
  # ===========================================================================

  hyperdx-postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:${HYPERDX_POSTGRES_VERSION:?run 'make stack VERSION=X.Y.Z' to pin HYPERDX_POSTGRES_VERSION}
    container_name: dfe-hyperdx-postgres
    profiles: ["hyperdx"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${HYPERDX_POSTGRES_USER:-hyperdx}
      POSTGRES_PASSWORD: ${HYPERDX_POSTGRES_PASSWORD:-hyperdx}
    volumes:
      - hyperdx-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HYPERDX_POSTGRES_USER:-hyperdx}"]
      interval: 5s
      timeout: 3s
      retries: 10

  hyperdx-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:${HYPERDX_FERRETDB_VERSION:?run 'make stack VERSION=X.Y.Z' to pin HYPERDX_FERRETDB_VERSION}
    container_name: dfe-hyperdx-ferretdb
    profiles: ["hyperdx"]
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${HYPERDX_POSTGRES_USER:-hyperdx}:${HYPERDX_POSTGRES_PASSWORD:-hyperdx}@hyperdx-postgres:5432/postgres
    depends_on:
      hyperdx-postgres:
        condition: service_healthy
    restart: on-failure

  hyperdx:
    # The dfe-hyperdx fork is not yet published, so the DFE stack SSoT emits
    # DFE_HYPERDX_VERSION as a comment, not a value -- `make stack` cannot pin
    # it. Compose interpolates every service (profiles do not gate it), so a
    # `:?` hard-fail here would abort even the default non-hyperdx path. This is
    # the ONE DFE-owned image still on a soft default; flip it to
    # `:?run 'make stack VERSION=X.Y.Z' to pin DFE_HYPERDX_VERSION` once the
    # fork publishes and versions.yaml gains content.dfe-hyperdx.
    image: ${IMAGE_REGISTRY:-ghcr.io/hyperi-io}/hyperi-hyperdx:${DFE_HYPERDX_VERSION:-latest}
    container_name: dfe-hyperdx
    profiles: ["hyperdx"]
    ports:
      - ${DFE_HYPERDX_API_PORT:-8000}:8000
      - ${DFE_HYPERDX_APP_PORT:-8090}:${DFE_HYPERDX_APP_PORT:-8090}
    env_file:
      - path: env/hyperdx.env
        required: false
    environment:
      HYPERDX_API_PORT: 8000
      HYPERDX_APP_PORT: ${DFE_HYPERDX_APP_PORT:-8090}
      HYPERDX_APP_URL: ${DFE_HYPERDX_APP_URL:-http://localhost}
      FRONTEND_URL: ${DFE_HYPERDX_APP_URL:-http://localhost}:${DFE_HYPERDX_APP_PORT:-8090}
      MONGO_URI: mongodb://${HYPERDX_POSTGRES_USER:-hyperdx}:${HYPERDX_POSTGRES_PASSWORD:-hyperdx}@hyperdx-ferretdb:27017/hyperdx?authSource=adminThe source mapping is read from the mounted file below.
      NEXT_PUBLIC_IS_LOCAL_MODE: "true"
      NEXT_PUBLIC_HDX_LOCAL_DEFAULT_CONNECTIONS: '[{"id":"local","name":"ClickHouse","host":"${DFE_HYPERDX_APP_URL:-http://localhost}:${CLICKHOUSE_HTTP_PORT:-8123}","username":"${CLICKHOUSE_USERNAME:-default}","password":"${CLICKHOUSE_PASSWORD:-}"}]'
      NEXT_PUBLIC_HDX_LOCAL_DEFAULT_SOURCES_FILE: /etc/hyperdx/default-sources.json
      NEXT_PUBLIC_THEME: ${HYPERDX_THEME:-dfe}
    volumes:
      - ./config/hyperdx/default-sources.json:/etc/hyperdx/default-sources.json:ro
    depends_on:
      hyperdx-ferretdb:
        condition: service_started
      clickhouse:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

volumes:
  clickhouse-data:
  kafka-redpanda-data:
  kafka-apache-data:
  archiver-data:
  dlq-spool:
  dfe-engine-config:
  dfe-engine-schemas:
  hyperdx-pg-data:
