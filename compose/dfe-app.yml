services:
  dfe-app:
    extends: {file: limits.yml, service: limits-service}
    profiles: ["dfe"]
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DFE_OTEL_EXPORTER_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9090 && printf 'GET /livez HTTP/1.0\\r\\n\\r\\n' >&3 && read -r _ code _ <&3 && [ \"$$code\" = 200 ]"]
      interval: 10s
      timeout: 3s
      retries: 5
