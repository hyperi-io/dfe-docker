services:
  dfe-app:
    extends: {file: limits.yml, service: limits-service}
    profiles: ["dfe"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 10s
      timeout: 3s
      retries: 5
