# Project:   dfe-docker
# File:      compose/container-logs.yml
# Purpose:   Ship DFE container stdout to the collector via Docker's fluentd driver
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

# Chained by make when self-monitoring resolves on and DFE_CONTAINER_LOGS_ENABLED is not false. Reading the daemon's log files needs root and a data-root that differs by host, while this driver needs neither and tags each line with the container name
x-container-logs: &container-logs
  driver: fluentd
  options:
    # The collector's published host address, so a second stack that moved DFE_OTEL_FLUENT_PORT or DFE_BIND_HOST ships its logs to its own collector
    fluentd-address: ${DFE_CONTAINER_LOG_ADDRESS:-tcp://${DFE_BIND_HOST:-127.0.0.1}:${DFE_OTEL_FLUENT_PORT:-24224}}
    # Queues lines while the collector starts, because Docker refuses to create a container whose log endpoint is unreachable
    fluentd-async: "true"
    # Resends until the collector acks, because Docker's port proxy accepts and drops the lines sent before the collector listens
    fluentd-request-ack: "true"
    # The container name, which every DFE service sets explicitly
    tag: "{{.Name}}"

# DFE's own services only, per-source instances included because scripts/instances.py copies the block above into each. Docker's dual logging keeps `docker compose logs` reading them
services:
  dfe-archiver:
    logging: *container-logs
  dfe-engine:
    logging: *container-logs
  dfe-fetcher:
    logging: *container-logs
  dfe-hunt-runner:
    logging: *container-logs
  dfe-loader:
    logging: *container-logs
  dfe-receiver:
    logging: *container-logs
  dfe-transform-elastic:
    logging: *container-logs
  dfe-transform-vector:
    logging: *container-logs
  dfe-transform-vrl:
    logging: *container-logs
  dfe-ui:
    logging: *container-logs
