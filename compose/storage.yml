# Project:   dfe-docker
# File:      compose/storage.yml
# Purpose:   Rehome every stateful volume onto DFE_DATA_ROOT, a disk you chose instead of /var/lib/docker
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

# Chained by make when DFE_DATA_ROOT is set. Switching migrates no data and `make clean` removes the volume objects while the directories keep their contents
volumes:
  archiver-data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${DFE_DATA_ROOT}/archiver"}
  clickhouse-data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${DFE_DATA_ROOT}/clickhouse"}
  dfe-engine-config:
    driver: local
    driver_opts: {type: none, o: bind, device: "${DFE_DATA_ROOT}/engine-config"}
  dfe-engine-schemas:
    driver: local
    driver_opts: {type: none, o: bind, device: "${DFE_DATA_ROOT}/engine-schemas"}
  dlq-spool:
    driver: local
    driver_opts: {type: none, o: bind, device: "${DFE_DATA_ROOT}/dlq-spool"}
  fetcher-cursors:
    driver: local
    driver_opts: {type: none, o: bind, device: "${DFE_DATA_ROOT}/fetcher-cursors"}
  hyperdx-documentdb-data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${DFE_DATA_ROOT}/hyperdx-documentdb"}
  kafka-apache-data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${DFE_DATA_ROOT}/kafka-apache"}
  kafka-redpanda-data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${DFE_DATA_ROOT}/kafka-redpanda"}
  transform-elastic-geoip:
    driver: local
    driver_opts: {device: "${DFE_DATA_ROOT}/transform-elastic-geoip", o: bind, type: none}
