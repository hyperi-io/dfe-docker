# Project:   dfe-docker
# File:      ruff.toml
# Purpose:   Ruff configuration for the repo's Python helper scripts
# Language:  TOML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# The HyperI Python standard's ruff config. `ruff format` owns line breaking, so E501
# is off, and select stays at ruff's default because these are scripts, not a package.

line-length = 88
cache-dir = ".tmp/ruff"

[lint]
ignore = ["E501"]

# Repeated per file, because a `--select E` on the command line outranks a config ignore.
[lint.per-file-ignores]
"*.py" = ["E501"]
