#
# NOT auto-loaded. The Makefile chains it when DFE_HYPERDX_UI_EXTERNAL=false or
# when the kill switch DFE_INFRA_UIS_EXTERNAL=false covers every infra UI. See
# docker-compose.unpublish-dfe-ui.yml for why an opt-out is a `!reset` fragment.
#
# Both ports go together: they are one UI across two origins, and the API answers
# the same questions the app does.
#
# The ports sit on dfe-hyperdx-proxy, not on hyperdx: HyperDX takes its identity
# from the headers that proxy injects, so it is never published directly.

services:
  dfe-hyperdx-proxy:
    ports: !reset []
