# Project:   dfe-docker
# File:      tests/e2e/config/transform-vrl-grpc-acks-off.yaml
# Purpose:   dfe-transform-vrl e2e config - config/transform-vrl/grpc.yaml with acknowledgements off
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Each Push is answered once received rather than once its transformed records
# reached the loader, so a kill loses what was answered. The `*-acks-off` outage
# tests run this to record that loss.

source:
  transport: direct
  listen: 0.0.0.0:6000
  acknowledgements:
    enabled: false

transforms:
  dir: /etc/dfe-transform-vrl/transforms

sink:
  transport: direct
  endpoint: http://dfe-loader:6000
