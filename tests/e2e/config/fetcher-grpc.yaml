# simple-fetcher-to-loader posts its events to the ingest endpoint and nothing
# polls an upstream, so the only source is the suite's own POSTs.

output:
  type: grpc
  grpc:
    endpoint: http://dfe-loader:50051

ingest:
  enabled: true
