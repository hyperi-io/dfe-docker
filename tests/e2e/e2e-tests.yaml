# Project:   dfe-docker
# File:      tests/e2e/e2e-tests.yaml
# Purpose:   Declarative e2e test definitions for the DFE Docker stack
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

# Each test references a profile from service_profiles.yaml. The profile declares
# which DFE services run and their config paths. The runner adds infra
# automatically: ClickHouse + dfe-engine (the schema authority -- it provisions the
# landing tables and registers the schemas the loader needs) always, plus the
# selected Kafka backend profile + kafka-ui when transport is kafka.
#
# Verification, the two default DFE acceptances. INGEST: dfe-engine owns the
# schema and the loader drops unmapped fields, so the runner asserts the row-count
# DELTA plus this run's marker in the engine-provisioned landing table
# (dfe.main). SELF-MONITORING: on a profile declaring `otel`, that the stack's
# own telemetry is landing FRESH in the otel database.
#
# Per-service config overrides can be set via `config_overrides`, keyed by
# service name (e.g. dfe-loader: config/custom.yaml).
#
# An `outage` block replaces the one-shot send with steady load, stops the named
# service (`kafka` is whichever broker KAFKA_BACKEND selects) for `seconds`, and
# starts it again. It asserts no other DFE service exits or restarts, the
# receiver answers every request (a refusal is backpressure and passes), every
# accepted record lands, and on Kafka every consumer group catches up.
# `sources` maps each `_source` the load sends to its data file, defaulting to
# the test's table and `data_file`. `method` is `stop` (the default, a graceful
# stop that lets the service drain) or `kill` (SIGKILL, no drain). A kill test
# also fails when the kill caught nothing in flight: no request out the instant
# the service died or, for a Kafka consumer, nothing its group had left
# uncommitted just before. `workers` and `interval` set the load, by default 4
# workers each waiting 0.5s between requests. When the service is the one the
# load posts to, a request overlapping its outage may go unanswered. Outage
# tests run only under `make test-resilience`, never in the default
# `make test-e2e`.
#
# `pause: {service, seconds}` freezes a service first, so the one taken down
# dies holding records. The signal lands at the end of the pause and the thaw
# follows. Under a pause a graceful stop sends SIGTERM before the thaw, so the
# drain meets the paused service coming back. An outage with a `pause` and no
# `service` only freezes: `expect_refusals: true` then fails unless a request was
# refused while it ran.
#
# `loss` says what an accepted record that never lands means. `forbidden`, the
# default, fails on one. `required` fails a control that lost nothing, `unreliable`
# reports that as non-discriminating, and `tolerated` only records the count.
# Duplicates are counted per phase and reported, never failed.
#
# `spool: {service, path, must_stay_empty, must_replay}` reads a service's disk
# spool before the load, at the signal and at the end. `must_replay` fails unless
# every record on the spool at the signal lands after the restart.
#
# `poison: {data_file, every, limit}` sends a record the sink refuses, one in every
# `every` once the outage begins, `limit` at most. `dead_letters: {service, path}`
# requires each accepted one named in that file dead-letter queue. A
# `dead_letters` with no `path` counts the drop metric instead and needs `limit: 1`,
# because the metric names no record.
#
# `archive: {services, path}` requires every accepted record in an archived file,
# duplicates allowed. The archivers are stopped gracefully first when the archive
# is short, which closes every open file.
#
# Acknowledgements. The tests that kill a hop prove no record the stack answered
# 2xx is lost while every hop holds its acknowledgement until delivery
# (`acknowledgements.enabled`, the default). Their `-acks-off` twins run the same
# outage with every hop between the load and ClickHouse answering at receipt, and
# must lose records: a control that cannot fail proves nothing. The `-sigterm-`
# twins stop the same hop gracefully instead.
#
# `known_issue: <issue>` marks a test that fails on that issue today. Its failures are
# reported as a skip citing the issue, and a clean run fails so the key gets removed.
#
# A test whose archiver subscribes to its landing topic and archives to a
# file:// destination also asserts the archiver wrote a file during the test.
#
# A `detection` block replaces the one-shot send with the rules-and-hunts flow:
# a rule and a one-minute hunt created through the engine API, the events in
# `matching` and `other` sent under one marker, a queued run, and the hunt's rows
# in dfe.detection asserted to be exactly the landed `matching` events. `where` is
# the rule's detection logic over the landing table, and the suite holds it to
# this run's rows by the marker. It needs dfe-hunt-runner, so it skips on a
# profile with the core footprint off.
#
# A `from_search` block inside `detection` replaces `where`: the rule comes from a
# HyperDX search in the console, `search` in the search bar and `filter` picked in
# the side panel, and the hunt is added and triggered from the console. It adds
# HyperDX to the stack and needs Playwright and Chrome.
#
# A `sources` block makes each source through the dfe-engine API the way the console does, once the stack is healthy: a create, a deploy and an upload of each fixture its `files` lists by file set, from tests/e2e/ only. A source is created on the meta/syslog schema unless its `schema` names the settings its transform's output needs. The instance dfe-engine then declares for it, `dfe-transform-<engine>-<name>`, starts in the test's own compose project. The load waits until it is ready, on Kafka until its consumer group has joined as well. The profile has to run each named transform app per source. The receiver reads the config dfe-engine renders, which sends each source's `_source` label to its transform. A record whose label no source matches skips every transform, so `table` and each key of an outage's `sources` must name a source the test makes. On Kafka each source's `<name>_land` and `<name>_load` join `expected_topics` while its instance's consumer group joins the consumer checks. An outage `service` may name a source's instance. A program the table's source uploads sets `_tags.e2e_transform` to its engine's name on every record, which each row the test lands must carry. The sources are deleted after the test. Their tables keep the rows it wrote. Names are lowercase letters and digits, free of the `-` a ClickHouse identifier would need quoted.

global:
  data_file: tests/e2e/data/events.jsonl
  mode: ci
  # Data-path tests skip the self-monitoring collector. A test that asserts on it sets otel: true
  otel: false
  # Only ClickHouse persists between tests (schema + accumulated rows; the
  # count-delta verify baselines per test). Kafka, kafbat and the DFE services
  # recreate fresh each test so a test always runs its own config and a stale
  # broker cannot fail the next test's health gate.
  persistent_services:
    - clickhouse

tests:
  - name: simple-receiver-to-loader-grpc
    profile: slim

  - name: simple-receiver-to-loader-kafka-with-archiver
    profile: single
    expected_topics:
      - main_land
      - simple_receiver_to_loader_kafka_with_archiver_land

  # The complete single-node stack: receiver, loader and archiver over Kafka, with the engine, UI and proxy in front. The HTTP checks assert the single-origin contract dfe-proxy exists for: UI and engine API on ONE origin. DFE_UI_URL is the console URL the suite resolves: localhost on DFE_UI_PORT or https at DFE_EXTERNAL_ORIGIN's host under console TLS
  - name: complete-single-node-stack
    profile: single
    otel: true
    expected_topics:
      - main_land
      - complete_single_node_stack_land
    expected_http:
      - url: ${DFE_UI_URL}/livez
        status: 200
        contains: "ok"
      - url: ${DFE_UI_URL}/
        status: 200
      - url: ${DFE_UI_URL}/api/v1/auth/setup-status
        status: 200
        contains: "initial_setup"

  # Failed root logins are the detection; a failure for another user, a root
  # success and an unrelated API event are the near misses it must leave alone.
  - name: rules-and-hunts
    profile: slim
    config_overrides:
      dfe-receiver: tests/e2e/configs/receiver-e2e-org.yaml
    detection:
      where: "toString(_json.event_type) = 'login_failure' AND toString(_json.user_name) = 'root'"
      matching: tests/e2e/data/detection-matching.jsonl
      other: tests/e2e/data/detection-other.jsonl

  # The same detection made in the console: a search for failed logins, the side
  # panel narrowed to root, Create Rule, then a hunt added and triggered from the
  # console's form. Each filter alone lets a near miss through.
  - name: search-rule-hunt
    profile: slim
    config_overrides:
      dfe-receiver: tests/e2e/configs/receiver-e2e-org.yaml
    detection:
      matching: tests/e2e/data/detection-matching.jsonl
      other: tests/e2e/data/detection-other.jsonl
      from_search:
        search: "toString(_json.event_type) = 'login_failure'"
        filter:
          path: user_name
          value: root

  # ClickHouse down under load on the core data path: dfe-loader has to hold or
  # refuse what it cannot write, and deliver it once ClickHouse is back.
  - name: clickhouse-outage
    profile: slim
    outage:
      service: clickhouse
      seconds: 60

  # A direct gRPC destination pulled from under its sender and returned. Every
  # app upstream of the stopped one has to hold or refuse, never exit.
  - name: loader-outage-grpc
    profile: slim
    outage:
      service: dfe-loader
      seconds: 60

  # The Kafka chain through the vrl transform dfe-engine starts for a source made through its API, with dfe-loader stopped under it. dfe-engine runs no transform for a source on direct gRPC
  - name: loader-outage-kafka-transform-vrl
    profile: single
    # The archiver commits only when it rolls a file, every 300s by default
    config_overrides:
      dfe-archiver: tests/e2e/configs/archiver-short-roll.yaml
    table: e2evrl
    sources:
      - &e2evrl
        files:
          transforms:
            - tests/e2e/programs/stamp_transformed.vrl
        name: e2evrl
        transform:
          engine: vrl
    outage:
      service: dfe-loader
      seconds: 60

  # The same chain with the transform instance itself stopped mid-chain
  - name: transform-vrl-outage-kafka
    profile: single
    # The archiver commits only when it rolls a file, every 300s by default
    config_overrides:
      dfe-archiver: tests/e2e/configs/archiver-short-roll.yaml
    table: e2evrl
    sources:
      - *e2evrl
    outage:
      service: dfe-transform-vrl-e2evrl
      seconds: 60

  # A hop killed with SIGKILL mid-stream rather than stopped, so whatever it held
  # in memory gets no drain. Every record the receiver answered 2xx still has to
  # land, on the Kafka path and on the direct gRPC path. The load is dense enough
  # that the kill lands with records in flight; a kill that catches none fails.
  - name: loader-kill-kafka
    profile: single
    expected_topics:
      - main_land
    outage:
      service: dfe-loader
      method: kill
      seconds: 30
      workers: 16
      interval: 0.01

  - name: receiver-kill-kafka
    profile: single
    expected_topics:
      - main_land
    outage:
      service: dfe-receiver
      method: kill
      seconds: 30
      workers: 16
      interval: 0.01

  - name: loader-kill-grpc
    profile: slim
    outage:
      service: dfe-loader
      method: kill
      seconds: 20
      pause:
        service: clickhouse
        seconds: 10
      workers: 16
      interval: 0.01

  - name: transform-vrl-kill-kafka
    profile: single
    # The archiver commits only when it rolls a file, every 300s by default
    config_overrides:
      dfe-archiver: tests/e2e/configs/archiver-short-roll.yaml
    table: e2evrl
    sources:
      - *e2evrl
    outage:
      service: dfe-transform-vrl-e2evrl
      method: kill
      seconds: 30
      workers: 16
      interval: 0.01

  # The kill lands on a hop holding what it took while its next hop was frozen.
  # The receiver dies with the loader paused, and with the broker paused.
  - name: receiver-kill-grpc-loader-paused
    profile: slim
    outage:
      service: dfe-receiver
      method: kill
      seconds: 20
      pause:
        service: dfe-loader
        seconds: 10
      workers: 16
      interval: 0.01

  - name: receiver-kill-kafka-broker-paused
    profile: single
    expected_topics:
      - main_land
    outage:
      service: dfe-receiver
      method: kill
      seconds: 20
      pause:
        service: kafka
        seconds: 10
      workers: 16
      interval: 0.01

  # The same kills with acknowledgements off on every hop to ClickHouse. Each must
  # lose records.
  - name: loader-kill-grpc-acks-off
    profile: slim
    config_overrides:
      dfe-loader: tests/e2e/configs/loader-grpc-acks-off.yaml
      dfe-receiver: tests/e2e/configs/receiver-grpc-acks-off.yaml
    outage:
      service: dfe-loader
      method: kill
      seconds: 20
      pause:
        service: clickhouse
        seconds: 10
      workers: 16
      interval: 0.01
      loss: required

  # A frozen loader backs the receiver's sender up to its flow-control window, so
  # the receiver holds almost nothing in memory when it dies and loses nothing
  # reliably.
  - name: receiver-kill-grpc-loader-paused-acks-off
    profile: slim
    config_overrides:
      dfe-loader: tests/e2e/configs/loader-grpc-acks-off.yaml
      dfe-receiver: tests/e2e/configs/receiver-grpc-acks-off.yaml
    outage:
      service: dfe-receiver
      method: kill
      seconds: 20
      pause:
        service: dfe-loader
        seconds: 10
      workers: 16
      interval: 0.01
      loss: unreliable

  - name: receiver-kill-kafka-broker-paused-acks-off
    profile: single
    expected_topics:
      - main_land
    config_overrides:
      dfe-loader: tests/e2e/configs/loader-kafka-acks-off.yaml
      dfe-receiver: tests/e2e/configs/receiver-kafka-acks-off.yaml
    outage:
      service: dfe-receiver
      method: kill
      seconds: 20
      pause:
        service: kafka
        seconds: 10
      workers: 16
      interval: 0.01
      loss: required

  # The kills as graceful stops: SIGTERM, a drain, then SIGKILL only if the stop
  # timeout runs out.
  - name: loader-sigterm-grpc
    profile: slim
    outage:
      service: dfe-loader
      seconds: 20
      pause:
        service: clickhouse
        seconds: 10
      workers: 16
      interval: 0.01

  - name: receiver-sigterm-grpc-loader-paused
    profile: slim
    outage:
      known_issue: hyperi-io/dfe-receiver#278
      service: dfe-receiver
      seconds: 20
      pause:
        service: dfe-loader
        seconds: 10
      workers: 16
      interval: 0.01

  - name: receiver-sigterm-kafka-broker-paused
    profile: single
    expected_topics:
      - main_land
    outage:
      known_issue: hyperi-io/dfe-receiver#278
      service: dfe-receiver
      seconds: 20
      pause:
        service: kafka
        seconds: 10
      workers: 16
      interval: 0.01

  - name: loader-sigterm-kafka
    profile: single
    expected_topics:
      - main_land
    outage:
      service: dfe-loader
      seconds: 20
      workers: 16
      interval: 0.01

  - name: transform-vrl-sigterm-kafka
    profile: single
    # The archiver commits only when it rolls a file, every 300s by default
    config_overrides:
      dfe-archiver: tests/e2e/configs/archiver-short-roll.yaml
    table: e2evrl
    sources:
      - *e2evrl
    outage:
      service: dfe-transform-vrl-e2evrl
      seconds: 20
      workers: 16
      interval: 0.01

  # Disk spillover serves answers given at enqueue only. With acknowledgements off
  # the spool fills while the loader is frozen. The kill loses what was in memory,
  # and every record on the spool at the signal must replay after the restart and
  # land.
  - name: receiver-kill-spillover-acks-off
    profile: slim
    config_overrides:
      dfe-loader: tests/e2e/configs/loader-grpc-acks-off.yaml
      dfe-receiver: tests/e2e/configs/receiver-grpc-spillover-acks-off.yaml
    outage:
      service: dfe-receiver
      method: kill
      seconds: 20
      pause:
        service: dfe-loader
        seconds: 10
      loss: tolerated
      spool:
        service: dfe-receiver
        path: /tmp/dfe-receiver-spillover
        must_replay: true

  # With acknowledgements held, spillover opens no spool: the loader frozen past
  # the receiver's hold is answered 503 and nothing reaches the disk.
  - name: receiver-spillover-acks-on-builds-no-spool
    profile: slim
    config_overrides:
      dfe-receiver: tests/e2e/configs/receiver-grpc-spillover.yaml
    outage:
      pause:
        service: dfe-loader
        seconds: 40
      expect_refusals: true
      spool:
        service: dfe-receiver
        path: /tmp/dfe-receiver-spillover
        must_stay_empty: true

  # A record ClickHouse refuses, one in every ten from the outage on, with good
  # records behind it and the loader killed while holding both. The good ones
  # land, and each refused one reaches the loader's file dead-letter queue or its
  # dropped count without holding up the records behind it.
  - name: loader-kill-grpc-poison
    profile: slim
    config_overrides:
      dfe-loader: tests/e2e/configs/loader-grpc-dead-letters.yaml
    outage:
      service: dfe-loader
      method: kill
      seconds: 20
      pause:
        service: clickhouse
        seconds: 10
      workers: 16
      interval: 0.01
      poison:
        data_file: tests/e2e/data/poison-integer-overflow.jsonl
        every: 10
      dead_letters:
        service: dfe-loader
        path: /var/spool/dfe/dlq

  # The archiver killed or stopped partway through a 30 s roll. Every accepted
  # record has to be in an archived file once the archiver is back and stopped
  # cleanly: duplicates pass, gaps fail.
  - name: archiver-kill-mid-roll
    profile: single
    config_overrides: &archive-roll
      dfe-archiver: tests/e2e/configs/archiver-kafka-archive-roll.yaml
    expected_topics:
      - main_land
    outage:
      service: dfe-archiver
      method: kill
      seconds: 20
      workers: 16
      interval: 0.01
      archive:
        services: [dfe-archiver]
        path: /var/lib/dfe-archiver/archive

  - name: archiver-sigterm-mid-roll
    profile: single
    config_overrides: *archive-roll
    expected_topics:
      - main_land
    outage:
      service: dfe-archiver
      seconds: 20
      workers: 16
      interval: 0.01
      archive:
        services: [dfe-archiver]
        path: /var/lib/dfe-archiver/archive

  # The broker down under load with every Kafka app consuming, each transform included: the e2evector and e2eelastic records keep the vector and elastic instances' own topics moving, so their groups have to catch up too
  - name: kafka-outage
    profile: single
    # The archiver commits only when it rolls a file, every 300s by default
    config_overrides:
      dfe-archiver: tests/e2e/configs/archiver-short-roll.yaml
    table: e2evrl
    sources:
      - *e2evrl
      - name: e2evector
        transform:
          engine: vector
      # The ECS schema the elastic catalogue builds this variant's table on (dfe-engine appmgmt/apps.yaml `catalogue`)
      - name: e2eelastic
        schema:
          additional_fields: additional/cisco_ios/log
          derived_schema: derived/cisco_ios/log
          meta_schema: meta/elastic/ecs
        transform:
          engine: elastic
          variant: filebeat.cisco_ios.default
    outage:
      service: kafka
      seconds: 60
      sources:
        e2evrl: tests/e2e/data/events.jsonl
        e2evector: tests/e2e/data/events.jsonl
        e2eelastic: tests/e2e/data/cisco-ios.jsonl
