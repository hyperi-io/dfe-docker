# Each test brings up the stack with a given compose profile, sends events
# from the data file to the receiver, and verifies they land in dfe.default.
# If sample_size is set, a random sample is taken; otherwise the full file
# is used. Kafka profiles also verify expected topics exist.
#
# Available profiles (list per test): full, full-kafka, bare-bones, debug

global:
  data_file: tests/e2e/data/events.jsonl
  mode: ci
  profiles:
    - full-kafka
  persistent_services:
    - clickhouse
    - kafka-ui

clickhouse:
  drop_database: false
  table_ddl_file_path: clickhouse/base_table_ddl.sql

tests:
  - name: simple-receiver-to-loader-grpc
    profiles:
      - full
      - receiver
    loader_config: config/loader-grpc.yaml
    receiver_config: config/receiver-grpc.yaml

  - name: simple-receiver-to-loader-kafka
    profiles:
      - full-kafka
      - receiver-kafka
    loader_config: config/loader-kafka.yaml
    receiver_config: config/receiver-kafka.yaml
    expected_topics:
      - default_land
      - simple_receiver_to_loader_kafka_land

  - name: simple-receiver-to-loader-kafka-with-archiver
    profiles:
      - full-kafka
      - receiver-kafka
      - archiver
    archiver_config: config/archiver-kafka.yaml
    loader_config: config/loader-kafka.yaml
    receiver_config: config/receiver-kafka.yaml
    expected_topics:
      - default_land
      - simple_receiver_to_loader_kafka_with_archiver_land

  - name: simple-fetcher-to-loader
    profiles:
      - full
      - fetcher
    fetcher_config: config/fetcher-aws-grpc.yaml
    loader_config: config/loader-grpc.yaml

  - name: simple-fetcher-to-loader-kafka
    profiles:
      - full-kafka
      - fetcher-kafka
    fetcher_config: config/fetcher-aws-kafka.yaml
    loader_config: config/loader-kafka.yaml
    expected_topics:
      - default_land
      - simple_fetcher_to_loader_kafka_land