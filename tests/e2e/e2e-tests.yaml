# Each test brings up the stack with a given compose profile, samples events
# from the data file, sends them to the receiver, and verifies they land in
# dfe.default. Kafka profiles also verify expected topics exist.
#
# Available profiles: full, full-kafka, bare-bones, debug

defaults:
  mode: ci
  profile: full-kafka
  sample_size: 100
  data_file: tests/e2e/data/events.jsonl

tests:
  - name: simple-kafka
    profile: full-kafka
    receiver_config: config/receiver-kafka.yaml
    loader_config: config/loader-kafka.yaml
    expected_topics:
      - default_land

  - name: simple-grpc
    profile: full
    receiver_config: config/receiver-grpc.yaml
    loader_config: config/loader-grpc.yaml