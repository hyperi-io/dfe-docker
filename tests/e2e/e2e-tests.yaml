# Each test references a profile from service_profiles.yaml. The profile declares which
# DFE services run and their config paths. The runner adds infra automatically
# (clickhouse always; kafka + ui when transport is kafka).
#
# Per-service config overrides can be set via `config_overrides`, keyed by
# service name (e.g. dfe-loader: config/custom.yaml).

global:
  data_file: tests/e2e/data/events.jsonl
  mode: dev
  persistent_services:
    - clickhouse
    - kafka-ui

clickhouse:
  drop_database: false
  table_ddl_file_path: clickhouse/ddls/base_table_ddl.sql

tests:
  - name: simple-receiver-to-loader-grpc
    profile: grpc-receiver

  - name: simple-receiver-to-loader-kafka
    profile: kafka-receiver
    expected_topics:
      - default_land
      - simple_receiver_to_loader_kafka_land

  - name: simple-receiver-to-loader-kafka-with-archiver
    profile: kafka-receiver-archiver
    expected_topics:
      - default_land
      - simple_receiver_to_loader_kafka_with_archiver_land

  - name: simple-fetcher-to-loader
    profile: grpc-fetcher

  - name: simple-fetcher-to-loader-kafka
    profile: kafka-fetcher
    clickhouse:
      table_ddl_file_path: clickhouse/ddls/aws_cloudtrail_ddl.sql
    expected_topics:
      - default_land
      - simple_fetcher_to_loader_kafka_land
