# Each test references a profile from service_profiles.yaml. The profile declares
# which DFE services run and their config paths. The runner adds infra
# automatically: ClickHouse + dfe-engine (the schema authority -- it provisions the
# landing tables and registers the schemas the loader needs) always, plus the
# selected Kafka backend profile + kafka-ui when transport is kafka.
#
# Verification, the two default DFE acceptances. INGEST: dfe-engine owns the
# schema and the loader drops unmapped fields, so the runner asserts the row-count
# DELTA plus this run's marker in the engine-provisioned landing table
# (dfe.main). SELF-MONITORING: on a profile declaring `otel`, that the stack's
# own telemetry is landing FRESH in the otel database.
#
# Per-service config overrides can be set via `config_overrides`, keyed by
# service name (e.g. dfe-loader: config/custom.yaml).
#
# An `outage` block replaces the one-shot send with steady load, stops the named
# service (`kafka` is whichever broker KAFKA_BACKEND selects) for `seconds`, and
# starts it again. It asserts no other DFE service exits or restarts, the
# receiver answers every request (a refusal is backpressure and passes), every
# accepted record lands, and on Kafka every consumer group catches up.
# `sources` maps each `_source` the load sends to its data file, defaulting to
# the test's table and `data_file`.

global:
  data_file: tests/e2e/data/events.jsonl
  mode: ci
  # Only ClickHouse persists between tests (schema + accumulated rows; the
  # count-delta verify baselines per test). Kafka, kafbat and the DFE services
  # recreate fresh each test so a test always runs its own config and a stale
  # broker cannot fail the next test's health gate.
  persistent_services:
    - clickhouse

tests:
  - name: simple-receiver-to-loader-grpc
    profile: grpc-receiver

  - name: simple-receiver-to-loader-kafka
    profile: kafka-receiver
    expected_topics:
      - main_land
      - simple_receiver_to_loader_kafka_land

  - name: simple-receiver-to-loader-kafka-with-archiver
    profile: kafka-receiver-archiver
    expected_topics:
      - main_land
      - simple_receiver_to_loader_kafka_with_archiver_land

  - name: simple-fetcher-to-loader
    profile: grpc-fetcher

  - name: simple-fetcher-to-loader-kafka
    profile: kafka-fetcher
    expected_topics:
      - main_land
      - simple_fetcher_to_loader_kafka_land

  # The complete single-node stack: receiver, fetcher, transform, loader and
  # archiver over Kafka, with the engine, UI and proxy in front. The HTTP checks
  # assert the single-origin contract dfe-proxy exists for -- UI and engine API
  # on ONE origin.
  - name: complete-single-node-stack
    profile: single
    expected_topics:
      - main_land
      - complete_single_node_stack_land
    expected_http:
      - url: http://localhost:3000/livez
        status: 200
        contains: "ok"
      - url: http://localhost:3000/
        status: 200
      - url: http://localhost:3000/api/v1/auth/setup-status
        status: 200
        contains: "initial_setup"

  # ClickHouse down under load on the core data path: dfe-loader has to hold or
  # refuse what it cannot write, and deliver it once ClickHouse is back.
  - name: clickhouse-outage
    profile: grpc-receiver
    outage:
      service: clickhouse
      seconds: 60

  # A direct gRPC destination pulled from under its sender and returned. Every
  # app upstream of the stopped one has to hold or refuse, never exit.
  - name: loader-outage-grpc
    profile: grpc-receiver
    outage:
      service: dfe-loader
      seconds: 60

  - name: loader-outage-grpc-transform-vrl
    profile: grpc-receiver-transform-vrl
    outage:
      service: dfe-loader
      seconds: 60

  - name: transform-vrl-outage-grpc
    profile: grpc-receiver-transform-vrl
    outage:
      service: dfe-transform-vrl
      seconds: 60

  # The broker down under load with every Kafka app consuming. The vector and
  # cisco-ios records keep dfe-transform-vector's and dfe-transform-elastic's
  # own topics moving, so their groups have to catch up too.
  - name: kafka-outage
    profile: kafka-resilience
    expected_topics:
      - main_land
      - main_load
      - vector_land
      - vector_load
      - cisco-ios_land
      - cisco-ios_load
    outage:
      service: kafka
      seconds: 60
      sources:
        main: tests/e2e/data/events.jsonl
        vector: tests/e2e/data/events.jsonl
        cisco-ios: tests/e2e/data/cisco-ios.jsonl
