# Project:   dfe-docker
# File:      tests/e2e/configs/loader-grpc-dead-letters.yaml
# Purpose:   dfe-loader on gRPC with a file dead-letter queue
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# A record ClickHouse refuses has to go somewhere a test can read back. The file
# backend writes it to the shared dlq-spool volume, so it outlives a kill.

transport: grpc

routing:
  dlq:
    enabled: true
    mode: file_only
    file_path: /var/spool/dfe/dlq
