# Project:   dfe-docker
# File:      docker-compose.container-logs.yml
# Purpose:   Ship DFE container stdout to the collector via Docker's fluentd driver
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# NOT auto-loaded. The Makefile chains it when self-monitoring resolves ON and
# DFE_CONTAINER_LOGS_ENABLED is not false.
#
# Kubernetes collects container logs off the node with a DaemonSet filelog
# receiver. Compose has no equivalent a product can rely on: the log files live
# under the daemon's data-root (which is not `/var/lib/docker` on every host, and
# is not on the host at all under Docker Desktop), and listing that directory
# needs root. Docker's own fluentd driver needs neither a host path nor a
# privilege, and it tags each stream with the container name, so the collector
# attributes ServiceName from a DECLARED name rather than a guessed one.
#
# Docker's dual logging keeps a local copy of each line, so `docker compose logs`
# still reads these services back, as well as `dfe.otel_logs` and HyperDX. Only
# DFE's own services move; ClickHouse, the broker, the proxies and HyperDX keep
# json-file. DFE_CONTAINER_LOGS_ENABLED=false puts every service back on json-file.
# The per-source instances scripts/instances.py generates carry the same options,
# copied from the x-container-logs block below.
#
# fluentd-async is what keeps the collector off the startup path: without it
# Docker REFUSES to create a container whose logging endpoint is unreachable, so
# a collector that is still starting would block the whole stack. The driver
# queues what it cannot send yet and retries.
#
# fluentd-request-ack is what makes that queue deliver. The collector's host port
# is Docker's port proxy, which accepts a connection from the moment the
# container starts, before the collector inside is listening, and drops the bytes
# it is sent. Without an ack the driver counts those lines as sent: a service that
# starts beside the collector loses its startup lines. With one, the driver
# resends until the collector answers.

x-container-logs: &container-logs
  driver: fluentd
  options:
    # The address the collector actually publishes on, not a fixed one: the driver
    # dials a HOST address, so a second stack that moved DFE_OTEL_FLUENT_PORT or
    # DFE_BIND_HOST would otherwise ship its containers' logs elsewhere.
    fluentd-address: ${DFE_CONTAINER_LOG_ADDRESS:-tcp://${DFE_BIND_HOST:-127.0.0.1}:${DFE_OTEL_FLUENT_PORT:-24224}}
    fluentd-async: "true"
    # A line counts as delivered only once the collector acks it (see above).
    fluentd-request-ack: "true"
    # The container name, which every DFE service sets explicitly.
    tag: "{{.Name}}"

services:
  dfe-archiver:
    logging: *container-logs
  dfe-engine:
    logging: *container-logs
  dfe-fetcher:
    logging: *container-logs
  dfe-hunt-runner:
    logging: *container-logs
  dfe-loader:
    logging: *container-logs
  dfe-receiver:
    logging: *container-logs
  dfe-transform-elastic:
    logging: *container-logs
  dfe-transform-vector:
    logging: *container-logs
  dfe-transform-vrl:
    logging: *container-logs
  dfe-ui:
    logging: *container-logs
